<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FAF7F1; --surface:#FFFFFF; --surface-soft:#F3EEE4;
  --ink:#2B2420; --ink-soft:#6B6054; --borde:#E6DED2;
  --terracotta:#B5664A; --terracotta-deep:#96503A;
  --sage:#7D8F82; --sage-deep:#5E6E62; --rose:#C9A0A0; --gold:#BFA06A;
  --grad-marca:linear-gradient(135deg,#B5664A 0%,#96503A 50%,#7D8F82 100%);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1080px;height:1080px;overflow:hidden;font-family:'Inter',sans-serif;}
.canvas{
  width:1080px;height:1080px;position:relative;
  background:
    radial-gradient(ellipse 900px 700px at 85% 95%, rgba(125,143,130,0.16) 0%, transparent 60%),
    radial-gradient(ellipse 700px 600px at -5% 0%, rgba(181,102,74,0.10) 0%, transparent 60%),
    var(--bg);
}
.logo{position:absolute; top:64px; left:64px; display:flex; align-items:center; gap:12px;}
.anillo{width:46px;height:46px;border-radius:50%;background:var(--grad-marca);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 6px 16px rgba(150,80,58,0.25);}
.wordmark{font-family:'Playfair Display',serif;font-weight:700;font-size:1.7rem;color:var(--ink);}

.eyebrow{
  position:absolute; top:168px; left:64px; right:64px; text-align:center;
  font-size:16px; letter-spacing:4px; text-transform:uppercase; color:var(--sage-deep); font-weight:600;
}
.headline{
  position:absolute; top:206px; left:64px; right:64px; text-align:center;
  font-family:'Playfair Display',serif; font-size:66px; line-height:1.14; font-weight:700; color:var(--ink);
}
.headline em{font-style:normal; color:var(--terracotta);}
.subtext{
  position:absolute; top:438px; left:140px; right:140px; text-align:center;
  font-size:26px; line-height:1.5; color:var(--ink-soft);
}

.mockup{
  position:absolute; top:566px; left:130px; width:820px; height:420px;
  border-radius:18px; overflow:hidden; box-shadow:0 30px 70px rgba(43,36,32,0.22); border:1px solid var(--borde);
  background:var(--surface); transform:rotate(-1.2deg);
}
.mockup img{width:100%; display:block; margin-top:-20px;}

.cta{
  position:absolute; bottom:72px; left:50%; transform:translateX(-50%);
  background:var(--terracotta); color:#fff; font-weight:600; font-size:25px;
  padding:20px 48px; border-radius:40px; box-shadow:0 14px 30px rgba(181,102,74,0.35);
  display:flex; align-items:center; gap:10px;
}
</style></head><body>
<div class="canvas">
  <div class="logo"><span class="anillo">💍</span><span class="wordmark">Vowia</span></div>
  <div class="eyebrow">✦ Para parejas comprometidas</div>
  <div class="headline">La boda es de los dos.<br><em>La planeación también.</em></div>
  <div class="subtext">Un planificador digital pensado para que ambos participen en las decisiones de su gran día.</div>
  <div class="mockup"><img src="dashboard.png" alt=""></div>
  <div class="cta">Conoce Vowia →</div>
</div>
</body></html>
