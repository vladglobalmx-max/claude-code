<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
:root{ --azul:#4C8DFF; --turquesa:#34C1BC; --violeta:#8A7CF5; --amarillo:#F6C84C; --ink-soft:#C7CEE0; }
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1080px;height:1920px;overflow:hidden;font-family:'Work Sans',sans-serif;}
.canvas{width:1080px;height:1920px;position:relative; background:linear-gradient(180deg,#1C2340 0%, #141A33 100%); display:flex; align-items:center; justify-content:center;}
.safe{position:absolute; top:250px; left:90px; right:90px; bottom:250px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;}

.logo{display:flex; align-items:center; gap:12px; margin-bottom:76px;}
.badge{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#4C8DFF,#8A7CF5);display:flex;align-items:center;justify-content:center;font-size:22px;}
.wordmark{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.7rem;color:#fff;}

.headline{font-family:'Fredoka',sans-serif; font-size:58px; line-height:1.28; font-weight:600; color:#fff;}
.linea{width:70px; height:3px; background:var(--amarillo); margin:44px 0;}

.precio-row{display:flex; align-items:baseline; gap:16px; font-family:'Fredoka',sans-serif; color:#fff; flex-wrap:wrap; justify-content:center;}
.precio-row .marca{font-size:30px; font-weight:600;}
.precio-row .precio{font-size:58px; font-weight:700; color:var(--turquesa); font-variant-numeric:tabular-nums;}
.nota{margin-top:20px; font-size:28px; color:var(--ink-soft);}

.cta{margin-top:64px; background:var(--amarillo); color:#1C2340; font-weight:700; font-size:28px; padding:24px 64px; border-radius:44px; box-shadow:0 18px 40px rgba(246,200,76,0.3);}
</style></head><body>
<div class="canvas">
  <div class="safe">
    <div class="logo"><span class="badge">📖</span><span class="wordmark">Bookfluence Kids</span></div>
    <div class="headline">Ayúdale a organizar<br>su día hoy.</div>
    <div class="linea"></div>
    <div class="precio-row"><span class="marca">MI DÍA GENIAL —</span><span class="precio">$299 MXN</span></div>
    <div class="nota">Pago único. Sin suscripción.</div>
    <div class="cta">Conoce Mi Día Genial</div>
  </div>
</div>
</body></html>
