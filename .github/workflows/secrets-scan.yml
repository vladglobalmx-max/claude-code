name: Secret scanning

# Sin filtro de paths a propósito: corre sobre TODO el monorepo
# (gaios/, gs-orders/, platform/) en cada push/PR a main, no solo sobre el
# proyecto que cambió — un leak de credenciales/PII puede pasar en
# cualquiera de los tres.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # NOTA: si este repo se mueve a una cuenta de tipo Organization,
        # gitleaks-action pide un GITLEAKS_LICENSE (hay uno gratis tipo
        # "Starter" para 1 repo de org en gitleaks.io/purchase). No hace
        # falta mientras el repo viva bajo una cuenta personal.
