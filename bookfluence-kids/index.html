<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bookfluence Kids — Mi Día Genial</title>
<meta name="description" content="Planificador interactivo para organizar tareas, hábitos, lectura y metas.">
<style>
/* =====================================================
   BOOKFLUENCE KIDS — MI DÍA GENIAL
   Hoja de estilos única
   ===================================================== */
:root{
  --azul-profundo:#25335B;
  --azul-brillante:#4C8DFF;
  --turquesa:#32C6B5;
  --amarillo:#F6C84C;
  --coral:#FF7A7A;
  --violeta:#8B7CF6;
  --fondo-claro:#F7F9FD;
  --texto:#253047;
  --blanco:#FFFFFF;

  --bg:var(--fondo-claro);
  --bg-elevada:#FFFFFF;
  --bg-sutil:#EDF1FB;
  --texto-principal:var(--texto);
  --texto-secundario:#5A6478;
  --borde:#E1E7F5;
  --sombra:0 4px 18px rgba(37,51,91,0.08);
  --sombra-fuerte:0 10px 30px rgba(37,51,91,0.16);
  --radio:18px;
  --radio-chico:12px;
  --fuente: ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif;
  --dur:180ms;
  --tamano-texto:16px;
  --focus-color:#25335B;
}
:root[data-theme="dark"]{
  --bg:#161B2E;
  --bg-elevada:#1F2540;
  --bg-sutil:#232A48;
  --texto-principal:#F1F4FC;
  --texto-secundario:#AEB6D4;
  --borde:#333B60;
  --sombra:0 4px 18px rgba(0,0,0,0.35);
  --sombra-fuerte:0 12px 32px rgba(0,0,0,0.45);
  --focus-color:#F6C84C;
}
@media (prefers-color-scheme: dark){
  :root[data-theme="auto"]{
    --bg:#161B2E;
    --bg-elevada:#1F2540;
    --bg-sutil:#232A48;
    --texto-principal:#F1F4FC;
    --texto-secundario:#AEB6D4;
    --borde:#333B60;
    --sombra:0 4px 18px rgba(0,0,0,0.35);
    --sombra-fuerte:0 12px 32px rgba(0,0,0,0.45);
    --focus-color:#F6C84C;
  }
}
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--fuente);
  background:var(--bg);
  color:var(--texto-principal);
  font-size:var(--tamano-texto);
  line-height:1.5;
  transition:background var(--dur), color var(--dur);
}
img,svg{display:block;max-width:100%;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}
a{color:inherit;}
h1,h2,h3,h4,p{margin:0;}
ul{margin:0;padding:0;list-style:none;}
.reducir-animacion *{animation-duration:0.001ms !important;transition-duration:0.001ms !important;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important;transition-duration:0.001ms !important;}
}

/* Foco accesible */
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--focus-color);
  outline-offset:2px;
  border-radius:6px;
}

.oculto{display:none !important;}
.solo-lectura-pantalla{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0;
}

/* ---------- Botones ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;min-width:44px;padding:10px 18px;
  border-radius:999px;border:2px solid transparent;
  font-weight:700;font-size:0.98rem;
  background:var(--bg-sutil);color:var(--texto-principal);
  transition:transform var(--dur), background var(--dur), box-shadow var(--dur);
}
.btn:hover{transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-primario{background:var(--azul-brillante);color:#fff;box-shadow:var(--sombra);}
.btn-primario:hover{background:#3d7ce8;}
.btn-exito{background:var(--turquesa);color:#0b3b35;}
.btn-alerta{background:var(--coral);color:#4a0f0f;}
.btn-amarillo{background:var(--amarillo);color:#4a3200;}
.btn-violeta{background:var(--violeta);color:#fff;}
.btn-fantasma{background:transparent;border-color:var(--borde);}
.btn-texto{background:transparent;padding:8px 10px;}
.btn-peligro{background:#fff;color:#C23B3B;border-color:#C23B3B;}
.btn-chico{min-height:36px;padding:6px 12px;font-size:0.85rem;}
.btn-icono{padding:8px;border-radius:50%;}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
.btn-bloque{width:100%;}

/* ---------- Layout general ---------- */
#app{min-height:100%;display:flex;flex-direction:column;}
.contenedor-app{display:flex;flex:1;min-height:100vh;}

.barra-lateral{
  width:250px;flex-shrink:0;background:var(--bg-elevada);
  border-right:1px solid var(--borde);
  padding:20px 14px;display:flex;flex-direction:column;gap:4px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.marca-lateral{display:flex;align-items:center;gap:10px;padding:8px 10px 20px;}
.marca-lateral .logo-texto{font-weight:800;font-size:1.05rem;color:var(--azul-profundo);}
:root[data-theme="dark"] .marca-lateral .logo-texto{color:#fff;}
.marca-lateral small{display:block;color:var(--texto-secundario);font-weight:500;font-size:0.72rem;}

.nav-item{
  display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;
  color:var(--texto-secundario);font-weight:700;text-decoration:none;min-height:44px;
  background:transparent;border:none;width:100%;text-align:left;
}
.nav-item:hover{background:var(--bg-sutil);}
.nav-item.activo{background:var(--azul-brillante);color:#fff;}
.nav-item svg{flex-shrink:0;}

.encabezado-app{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 20px;background:var(--bg-elevada);border-bottom:1px solid var(--borde);
  position:sticky;top:0;z-index:20;
}
.encabezado-app h1{font-size:1.05rem;}
.grupo-encabezado{display:flex;align-items:center;gap:10px;}
.avatar-mini{width:38px;height:38px;border-radius:50%;overflow:hidden;background:var(--bg-sutil);border:2px solid var(--borde);flex-shrink:0;}
.avatar-mini svg{width:100%;height:100%;}

.principal{flex:1;padding:22px;max-width:1100px;width:100%;margin:0 auto;padding-bottom:100px;}
.vista{display:flex;flex-direction:column;gap:20px;}
.vista-titulo{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.vista-titulo h2{font-size:1.4rem;color:var(--azul-profundo);}
:root[data-theme="dark"] .vista-titulo h2{color:#fff;}
.subtitulo-vista{color:var(--texto-secundario);font-size:0.92rem;margin-top:2px;}

/* ---------- Tarjetas ---------- */
.tarjeta{
  background:var(--bg-elevada);border-radius:var(--radio);padding:18px;
  box-shadow:var(--sombra);border:1px solid var(--borde);
}
.rejilla{display:grid;gap:16px;}
.rejilla-2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));}
.rejilla-3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
.rejilla-4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}

.estadistica{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:var(--radio-chico);background:var(--bg-sutil);}
.estadistica .valor{font-size:1.6rem;font-weight:800;color:var(--azul-profundo);}
:root[data-theme="dark"] .estadistica .valor{color:#fff;}
.estadistica .etiqueta{font-size:0.8rem;color:var(--texto-secundario);font-weight:600;}

.estado-vacio{
  text-align:center;padding:34px 18px;color:var(--texto-secundario);
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.estado-vacio svg{opacity:0.7;}

.etiqueta-chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  font-size:0.75rem;font-weight:700;background:var(--bg-sutil);color:var(--texto-secundario);
}
.chip-alta{background:#FFE3E3;color:#9B2C2C;}
:root[data-theme="dark"] .chip-alta{background:#4a2323;color:#ffb3b3;}
.chip-media{background:#FFF3D6;color:#8a5a00;}
:root[data-theme="dark"] .chip-media{background:#4a3a10;color:#ffd98a;}
.chip-baja{background:#DFF6EF;color:#0f6b57;}
:root[data-theme="dark"] .chip-baja{background:#173d34;color:#8ee9d2;}

.lista-elementos{display:flex;flex-direction:column;gap:10px;}
.fila-elemento{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radio-chico);
  background:var(--bg-sutil);border:1px solid transparent;
}
.fila-elemento.terminada{opacity:0.65;}
.fila-elemento .contenido-fila{flex:1;min-width:0;}
.fila-elemento .titulo-fila{font-weight:700;}
.fila-elemento .meta-fila{font-size:0.8rem;color:var(--texto-secundario);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;}
.acciones-fila{display:flex;gap:6px;flex-shrink:0;}

/* ---------- Formularios ---------- */
.campo{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.campo label{font-weight:700;font-size:0.9rem;}
.campo input[type="text"],.campo input[type="number"],.campo input[type="date"],
.campo input[type="time"],.campo input[type="password"],.campo select,.campo textarea{
  border:2px solid var(--borde);border-radius:var(--radio-chico);padding:11px 12px;
  background:var(--bg-elevada);color:var(--texto-principal);min-height:44px;width:100%;
}
.campo textarea{min-height:80px;resize:vertical;}
.campo .ayuda-campo{font-size:0.78rem;color:var(--texto-secundario);}
.campo .error-campo{font-size:0.82rem;color:#C23B3B;font-weight:700;}
.campo.con-error input,.campo.con-error select,.campo.con-error textarea{border-color:#C23B3B;}
.fila-campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;}
.grupo-opciones{display:flex;flex-wrap:wrap;gap:8px;}
.opcion-pastilla{
  border:2px solid var(--borde);background:var(--bg-elevada);padding:8px 14px;border-radius:999px;
  font-weight:700;min-height:40px;
}
.opcion-pastilla[aria-pressed="true"]{background:var(--azul-brillante);color:#fff;border-color:var(--azul-brillante);}
.selector-color{display:flex;gap:8px;flex-wrap:wrap;}
.bola-color{width:34px;height:34px;border-radius:50%;border:3px solid transparent;padding:0;}
.bola-color[aria-pressed="true"]{border-color:var(--texto-principal);}

/* ---------- Modales ---------- */
.fondo-modal{
  position:fixed;inset:0;background:rgba(20,26,48,0.55);
  display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:0;
}
.modal{
  background:var(--bg-elevada);border-radius:22px 22px 0 0;padding:22px;
  width:100%;max-width:560px;max-height:92vh;overflow-y:auto;box-shadow:var(--sombra-fuerte);
}
@media (min-width:600px){
  .fondo-modal{align-items:center;padding:20px;}
  .modal{border-radius:22px;}
}
.encabezado-modal{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;}
.encabezado-modal h2,.encabezado-modal h3{font-size:1.15rem;color:var(--azul-profundo);}
:root[data-theme="dark"] .encabezado-modal h2,:root[data-theme="dark"] .encabezado-modal h3{color:#fff;}
.pie-modal{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap;}

/* ---------- Toasts ---------- */
#zona-toasts{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);}
@media (min-width:1024px){#zona-toasts{bottom:24px;}}
.toast{
  background:var(--azul-profundo);color:#fff;padding:12px 16px;border-radius:14px;
  box-shadow:var(--sombra-fuerte);display:flex;align-items:center;gap:10px;font-weight:600;
  animation:aparecer-toast 220ms ease;
}
.toast.exito{background:#0f6b57;}
.toast.error{background:#9B2C2C;}
.toast.info{background:var(--azul-brillante);}
@keyframes aparecer-toast{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* ---------- Navegación móvil ---------- */
.nav-inferior{
  display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg-elevada);
  border-top:1px solid var(--borde);z-index:50;padding:4px 4px calc(4px + env(safe-area-inset-bottom));
}
.nav-inferior ul{display:flex;justify-content:space-around;}
.nav-inferior button{
  display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;
  color:var(--texto-secundario);font-size:0.68rem;font-weight:700;flex:1;padding:6px 2px;min-height:48px;border-radius:12px;
}
.nav-inferior button.activo{color:var(--azul-brillante);}

/* ---------- Estrellas ---------- */
.estrellas-contador{display:flex;align-items:center;gap:6px;background:var(--bg-sutil);padding:6px 12px;border-radius:999px;font-weight:800;color:#8a5a00;}
:root[data-theme="dark"] .estrellas-contador{color:var(--amarillo);}

/* ---------- Onboarding ---------- */
.pantalla-onboarding{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(160deg,var(--fondo-claro),#E7EEFF);
}
:root[data-theme="dark"] .pantalla-onboarding{background:linear-gradient(160deg,#161B2E,#1c2542);}
.tarjeta-onboarding{
  background:var(--bg-elevada);border-radius:26px;padding:30px;max-width:620px;width:100%;
  box-shadow:var(--sombra-fuerte);display:flex;flex-direction:column;gap:16px;
}
.paso-onboarding{display:flex;flex-direction:column;gap:14px;}
.progreso-onboarding{display:flex;gap:6px;}
.progreso-onboarding span{height:6px;flex:1;border-radius:999px;background:var(--bg-sutil);}
.progreso-onboarding span.hecho{background:var(--turquesa);}
.avatar-grande{width:90px;height:90px;border-radius:50%;margin:0 auto;background:var(--bg-sutil);overflow:hidden;}

/* ---------- Barra de progreso ---------- */
.barra-progreso{height:12px;border-radius:999px;background:var(--bg-sutil);overflow:hidden;}
.barra-progreso > div{height:100%;background:var(--turquesa);border-radius:999px;transition:width 320ms ease;}

/* ---------- Calendario ---------- */
.rejilla-calendario{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.celda-calendario{
  min-height:74px;border-radius:12px;background:var(--bg-sutil);padding:6px;font-size:0.78rem;
  display:flex;flex-direction:column;gap:3px;border:2px solid transparent;text-align:left;
}
.celda-calendario.hoy{border-color:var(--azul-brillante);}
.celda-calendario.fuera-mes{opacity:0.4;}
.punto-evento{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:3px;}
.dia-semana-cab{text-align:center;font-weight:800;font-size:0.75rem;color:var(--texto-secundario);}

/* ---------- Temporizador ---------- */
.esfera-temporizador{
  width:220px;height:220px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--turquesa) calc(var(--progreso,0) * 1%), var(--bg-sutil) 0);
  position:relative;
}
.esfera-temporizador::before{
  content:"";position:absolute;inset:12px;border-radius:50%;background:var(--bg-elevada);
}
.texto-temporizador{position:relative;font-size:2.1rem;font-weight:800;color:var(--azul-profundo);}
:root[data-theme="dark"] .texto-temporizador{color:#fff;}

/* ---------- Utilidades ---------- */
.flex{display:flex;}
.flex-col{flex-direction:column;}
.gap-8{gap:8px;}
.gap-12{gap:12px;}
.centrado{text-align:center;}
.texto-secundario{color:var(--texto-secundario);}
.mt-8{margin-top:8px;}
.mt-16{margin-top:16px;}
.separador{height:1px;background:var(--borde);margin:10px 0;}
.franja-color{width:14px;height:14px;border-radius:5px;flex-shrink:0;}

/* Tamaños de texto configurables */
:root[data-tamano="chico"]{--tamano-texto:14px;}
:root[data-tamano="normal"]{--tamano-texto:16px;}
:root[data-tamano="grande"]{--tamano-texto:19px;}
:root[data-tamano="muy-grande"]{--tamano-texto:22px;}

/* ---------- Responsive ---------- */
@media (max-width:1023px){
  .barra-lateral{display:none;}
  .principal{padding:16px;padding-bottom:96px;}
  .nav-inferior{display:block;}
}
@media (max-width:599px){
  .rejilla-2,.rejilla-3,.rejilla-4{grid-template-columns:1fr;}
  .fila-elemento{flex-wrap:wrap;}
}

/* ---------- Impresión ---------- */
#zona-impresion{display:none;}
@media print{
  body *{visibility:hidden;}
  #zona-impresion,#zona-impresion *{visibility:visible;}
  #zona-impresion{display:block;position:absolute;top:0;left:0;width:100%;background:#fff;color:#000;padding:16px;}
  .barra-lateral,.nav-inferior,.encabezado-app,#zona-toasts,.no-imprimir{display:none !important;}
  .hoja-impresion{page-break-inside:avoid;}
  .marca-impresion{font-size:0.75rem;color:#666;text-align:center;margin-top:20px;}
  @page{size:auto;margin:14mm;}
}
</style>
</head>
<body>
<div id="app" role="application" aria-label="Bookfluence Kids, Mi Día Genial"></div>
<div id="zona-toasts" aria-live="polite" aria-atomic="true"></div>
<div id="zona-modal"></div>
<div id="zona-impresion" aria-hidden="true"></div>

<script>
"use strict";
/* =====================================================
   BOOKFLUENCE KIDS — MI DÍA GENIAL
   JavaScript — arquitectura modular (IIFE por módulo)
   ===================================================== */

/* ===================== Utils ===================== */
const Utils = (function(){
  function uid(prefix){
    const rnd = (crypto && crypto.getRandomValues) ? crypto.getRandomValues(new Uint32Array(3)) : [Math.random()*1e9,Math.random()*1e9,Math.random()*1e9];
    return (prefix||"id") + "_" + Date.now().toString(36) + "_" + Array.from(rnd).map(n=>Math.floor(n).toString(36)).join("");
  }
  function pad2(n){ return String(n).padStart(2,"0"); }
  function todayISO(){ return dateToISO(new Date()); }
  function dateToISO(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
  function isoToDate(iso){
    if(!iso) return null;
    const parts = iso.split("-");
    if(parts.length!==3) return null;
    const d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
    return isNaN(d.getTime()) ? null : d;
  }
  function isValidISODate(iso){
    if(typeof iso !== "string") return false;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return false;
    return isoToDate(iso) !== null;
  }
  function addDays(iso, n){
    const d = isoToDate(iso);
    if(!d) return iso;
    d.setDate(d.getDate()+n);
    return dateToISO(d);
  }
  function startOfWeek(iso, weekStartsMonday){
    const d = isoToDate(iso) || new Date();
    const day = d.getDay(); // 0 dom - 6 sab
    let diff;
    if(weekStartsMonday){
      diff = (day === 0) ? -6 : (1 - day);
    } else {
      diff = -day;
    }
    d.setDate(d.getDate()+diff);
    return dateToISO(d);
  }
  function formatFechaLarga(iso){
    const d = isoToDate(iso);
    if(!d) return "";
    const dias = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
    const meses = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
    return dias[d.getDay()] + " " + d.getDate() + " de " + meses[d.getMonth()] + " de " + d.getFullYear();
  }
  function formatFechaCorta(iso){
    const d = isoToDate(iso);
    if(!d) return "";
    const meses = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
    return d.getDate() + " " + meses[d.getMonth()];
  }
  function formatHora(hhmm, formato24){
    if(!hhmm) return "";
    const [h,m] = hhmm.split(":").map(Number);
    if(formato24 === false){
      const h12 = ((h % 12) || 12);
      return h12 + ":" + pad2(m) + " " + (h < 12 ? "a.m." : "p.m.");
    }
    return pad2(h) + ":" + pad2(m);
  }
  function debounce(fn, wait){
    let t = null;
    return function(...args){
      clearTimeout(t);
      t = setTimeout(()=>fn.apply(this,args), wait);
    };
  }
  function clamp(n,min,max){ return Math.min(max, Math.max(min, n)); }
  function sum(arr, fn){ return arr.reduce((a,x)=>a+(fn?fn(x):x),0); }
  function byId(arr, id){ return arr.find(x=>x.id===id) || null; }
  function groupBy(arr, fn){
    const out = {};
    arr.forEach(x=>{ const k = fn(x); (out[k] = out[k]||[]).push(x); });
    return out;
  }
  return { uid, pad2, todayISO, dateToISO, isoToDate, isValidISODate, addDays, startOfWeek,

/* ===================== SanitizationService ===================== */
const SanitizationService = (function(){
  function escapeHtml(str){
    if(str === null || str === undefined) return "";
    return String(str)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#39;");
  }
  function stripTags(str){
    if(!str) return "";
    return String(str).replace(/<[^>]*>/g,"");
  }
  function cleanText(str, maxLen){
    let out = stripTags(str || "").trim();
    if(maxLen && out.length > maxLen) out = out.slice(0,maxLen);
    return out;
  }
  function onlyDigits(str){
    return String(str||"").replace(/[^0-9]/g,"");
  }
  return { escapeHtml, stripTags, cleanText, onlyDigits };
})();

/* ===================== ValidationService ===================== */
const ValidationService = (function(){
  function required(val, mensaje){
    const ok = val !== undefined && val !== null && String(val).trim().length > 0;
    return { ok, mensaje: ok ? "" : mensaje };
  }
  function maxLen(val, max, mensaje){
    const ok = String(val||"").length <= max;
    return { ok, mensaje: ok ? "" : mensaje };
  }
  function rangoNumero(val, min, max, mensaje){
    const n = Number(val);
    const ok = !isNaN(n) && n >= min && n <= max;
    return { ok, mensaje: ok ? "" : mensaje };
  }
  function fechaValida(val, mensaje){
    const ok = Utils.isValidISODate(val);
    return { ok, mensaje: ok ? "" : mensaje };
  }
  function pinValido(pin){
    if(!/^[0-9]{4,6}$/.test(pin||"")) return { ok:false, mensaje:"El PIN debe tener entre 4 y 6 números." };
    return { ok:true, mensaje:"" };
  }
  return { required, maxLen, rangoNumero, fechaValida, pinValido };
})();

/* ===================== MigrationService ===================== */
const MigrationService = (function(){
  function migrar(datos){
    if(!datos || typeof datos !== "object") return Schema.vacio();
    let d = datos;
    if(!d.schemaVersion || d.schemaVersion < 1){
      d.schemaVersion = 1;
    }
    // Punto central de futuras migraciones: agregar bloques "if(d.schemaVersion === N){ ... d.schemaVersion = N+1; }"
    const base = Schema.vacio();
    const fusion = Object.assign({}, base, d);
    Object.keys(base).forEach(clave=>{
      if(Array.isArray(base[clave]) && !Array.isArray(fusion[clave])) fusion[clave] = [];
      if(typeof base[clave] === "object" && !Array.isArray(base[clave]) && base[clave] !== null){
        fusion[clave] = Object.assign({}, base[clave], d[clave]||{});
      }
    });
    fusion.schemaVersion = Schema.VERSION;
    return fusion;
  }
  return { migrar };
})();

/* ===================== Store ===================== */
const Store = (function(){
  const CLAVE = "bookfluenceKidsData";
  let datos = null;
  let guardarPendiente = null;

  function cargar(){
    try{
      const crudo = localStorage.getItem(CLAVE);
      if(!crudo){
        datos = Schema.vacio();
        return datos;
      }
      const parseado = JSON.parse(crudo);
      datos = MigrationService.migrar(parseado);
      return datos;
    }catch(err){
      console.error("Error al leer los datos guardados:", err);
      datos = Schema.vacio();
      return datos;
    }
  }

  function guardarInmediato(){
    try{
      localStorage.setItem(CLAVE, JSON.stringify(datos));
      return true;
    }catch(err){
      console.error("Error al guardar los datos:", err);
      if(typeof ToastManager !== "undefined"){
        ToastManager.mostrar("No pudimos guardar tus cambios. Puede que el espacio esté lleno.", "error");
      }
      return false;
    }
  }

  const guardarConDebounce = Utils.debounce(guardarInmediato, 250);

  function obtener(){
    if(!datos) cargar();
    return datos;
  }
  function guardar(inmediato){
    if(inmediato) return guardarInmediato();
    guardarConDebounce();
  }
  function reemplazar(nuevo){
    datos = nuevo;
    return guardarInmediato();
  }
  function reiniciar(){
    datos = Schema.vacio();
    return guardarInmediato();
  }
  return { cargar, obtener, guardar, reemplazar, reiniciar, CLAVE };
})();

/* ===================== ToastManager ===================== */
const ToastManager = (function(){
  function mostrar(mensaje, tipo){
    const zona = document.getElementById("zona-toasts");
    if(!zona) return;
    const div = document.createElement("div");
    div.className = "toast " + (tipo||"info");
    div.setAttribute("role","status");
    div.textContent = mensaje;
    zona.appendChild(div);
    setTimeout(()=>{
      div.style.transition = "opacity 220ms ease";
      div.style.opacity = "0";
      setTimeout(()=>div.remove(), 240);
    }, 3200);
  }
  return { mostrar };
})();

/* ===================== ModalManager ===================== */
const ModalManager = (function(){
  let elementoActivador = null;
  let cerrandoConTecla = null;

  function abrir(opciones){
    cerrar(true);
    elementoActivador = document.activeElement;
    const zona = document.getElementById("zona-modal");
    const fondo = document.createElement("div");
    fondo.className = "fondo-modal";
    fondo.setAttribute("data-fondo-modal","1");
    const modal = document.createElement("div");
    modal.className = "modal";
    modal.setAttribute("role","dialog");
    modal.setAttribute("aria-modal","true");
    if(opciones.titulo) modal.setAttribute("aria-label", opciones.titulo);
    modal.innerHTML = opciones.html;
    fondo.appendChild(modal);
    zona.appendChild(fondo);

    fondo.addEventListener("mousedown", (e)=>{
      if(e.target === fondo) cerrar();
    });
    cerrandoConTecla = function(e){
      if(e.key === "Escape") cerrar();
    };
    document.addEventListener("keydown", cerrandoConTecla);

    const primerFoco = modal.querySelector("[data-autofoco]") || modal.querySelector("input,select,textarea,button");
    if(primerFoco) primerFoco.focus();

    if(opciones.alMontar) opciones.alMontar(modal);
    return modal;
  }
  function cerrar(silencioso){
    const zona = document.getElementById("zona-modal");
    zona.innerHTML = "";
    if(cerrandoConTecla){
      document.removeEventListener("keydown", cerrandoConTecla);
      cerrandoConTecla = null;
    }
    if(!silencioso && elementoActivador && elementoActivador.focus){
      elementoActivador.focus();
    }
  }
  function confirmar(opciones){
    const modal = abrir({
      titulo: opciones.titulo,
      html: `
        <div class="encabezado-modal">
          <h2>${SanitizationService.escapeHtml(opciones.titulo)}</h2>
          <button class="btn btn-icono btn-fantasma" data-cerrar-modal aria-label="Cerrar">${ICONS.close}</button>
        </div>
        <p>${SanitizationService.escapeHtml(opciones.mensaje)}</p>
        ${opciones.detalle ? `<div class="tarjeta" style="margin-top:10px;background:var(--bg-sutil);box-shadow:none;">${opciones.detalle}</div>` : ""}
        <div class="pie-modal">

          <button class="btn ${opciones.claseConfirmar||'btn-primario'}" data-accion-confirmar data-autofoco>${SanitizationService.escapeHtml(opciones.textoConfirmar||"Confirmar")}</button>
        </div>`
    });
    modal.addEventListener("click",(e)=>{
      if(e.target.closest("[data-cerrar-modal],[data-accion-cancelar]")){ cerrar(); if(opciones.alCancelar) opciones.alCancelar(); }
      if(e.target.closest("[data-accion-confirmar]")){ cerrar(); if(opciones.alConfirmar) opciones.alConfirmar(); }
    });
    return modal;
  }
  return { abrir, cerrar, confirmar };
})();

/* ===================== AuthService ===================== */
const AuthService = (function(){
  let modoAdultoActivo = false;
  const soportaCripto = !!(window.crypto && window.crypto.subtle && window.crypto.getRandomValues);

  function generarSalt(){
    if(soportaCripto){
      const arr = new Uint8Array(16);
      crypto.getRandomValues(arr);
      return Array.from(arr).map(b=>b.toString(16).padStart(2,"0")).join("");
    }
    return Math.random().toString(36).slice(2) + Date.now().toString(36);
  }

  async function hashPin(pin, salt){
    if(soportaCripto){
      const encoder = new TextEncoder();
      const material = await crypto.subtle.importKey("raw", encoder.encode(pin+":"+salt), {name:"PBKDF2"}, false, ["deriveBits"]);
      const bits = await crypto.subtle.deriveBits({name:"PBKDF2", salt: encoder.encode(salt), iterations: 120000, hash:"SHA-256"}, material, 256);
      const bytes = new Uint8Array(bits);
      return Array.from(bytes).map(b=>b.toString(16).padStart(2,"0")).join("");
    }
    // Alternativa local si Web Crypto no está disponible (menos robusta)
    let h = 0;
    const cadena = pin+":"+salt;
    for(let i=0;i<cadena.length;i++){
      h = (Math.imul(31,h) + cadena.charCodeAt(i)) | 0;
    }
    return "fallback_" + Math.abs(h).toString(16) + "_" + cadena.length;
  }

  async function configurarPin(pin, nombreAdulto){
    const salt = generarSalt();
    const hash = await hashPin(pin, salt);
    const datos = Store.obtener();
    datos.parentSettings.pinHash = hash;
    datos.parentSettings.pinSalt = salt;
    datos.parentSettings.pinAlgo = soportaCripto ? "PBKDF2-SHA256" : "fallback";
    datos.parentSettings.adultName = nombreAdulto || datos.parentSettings.adultName || "";
    datos.parentSettings.createdAt = new Date().toISOString();
    Store.guardar(true);
    return true;
  }

  async function verificarPin(pin){
    const datos = Store.obtener();
    if(!datos.parentSettings.pinHash) return false;
    const hash = await hashPin(pin, datos.parentSettings.pinSalt);
    return hash === datos.parentSettings.pinHash;
  }

  function tienePinConfigurado(){
    return !!Store.obtener().parentSettings.pinHash;
  }
  function soporteCriptoDisponible(){ return soportaCripto; }
  function esModoAdulto(){ return modoAdultoActivo; }
  function activarModoAdulto(){ modoAdultoActivo = true; }
  function salirModoAdulto(){ modoAdultoActivo = false; }

  function pedirPin(opciones){
    const modal = ModalManager.abrir({
      titulo: opciones.titulo || "Ingresa el PIN",
      html: `
        <div class="encabezado-modal">
          <h2>${icono("lock")} ${SanitizationService.escapeHtml(opciones.titulo || "Ingresa el PIN familiar")}</h2>
          <button class="btn btn-icono btn-fantasma" data-cerrar-modal aria-label="Cerrar">${ICONS.close}</button>
        </div>
        <p class="texto-secundario">${SanitizationService.escapeHtml(opciones.mensaje || "Este PIN es un control familiar dentro de este dispositivo, pídeselo a tu adulto.")}</p>
        <form data-form-pin>
          <div class="campo">
            <label for="campo-pin-modal">PIN</label>
            <input id="campo-pin-modal" name="pin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" data-autofoco maxlength="6">
            <span class="error-campo oculto" data-error-pin></span>
          </div>
          <div class="pie-modal">
            <button type="button" class="btn btn-fantasma" data-cerrar-modal>Cancelar</button>
            <button type="submit" class="btn btn-primario">Entrar</button>
          </div>
        </form>`
    });
    const form = modal.querySelector("[data-form-pin]");
    form.addEventListener("submit", async (e)=>{
      e.preventDefault();
      const pin = SanitizationService.onlyDigits(form.pin.value);
      const ok = await verificarPin(pin);
      if(ok){
        ModalManager.cerrar();
        if(opciones.alExito) opciones.alExito();
      } else {
        const err = modal.querySelector("[data-error-pin]");
        err.textContent = "Ese PIN no es correcto. Inténtalo de nuevo.";
        err.classList.remove("oculto");
        form.pin.value = "";
        form.pin.focus();
      }
    });
    return modal;
  }

  return { configurarPin, verificarPin, tienePinConfigurado, soporteCriptoDisponible,
    esModoAdulto, activarModoAdulto, salirModoAdulto, pedirPin, generarSalt, hashPin };
})();

/* ===================== Avatares (SVG generado localmente) ===================== */
const AvatarService = (function(){
  const FORMAS = ["redondo","estrella","escudo","nube","hexagono"];
  const RASGOS = ["A","B","C","D"];
  function avatarSVG(avatar, colorFavorito){
    const a = avatar || {forma:"redondo", rasgo:"A", color: colorFavorito || "#4C8DFF"};
    const color = a.color || colorFavorito || "#4C8DFF";
    let forma = "";
    switch(a.forma){
      case "estrella": forma = '<path d="M50 8 62 38 94 42 68 62 76 94 50 76 24 94 32 62 6 42 38 38Z" fill="'+color+'"/>'; break;
      case "escudo": forma = '<path d="M50 6 90 20v30c0 26-18 40-40 44C28 90 10 76 10 50V20Z" fill="'+color+'"/>'; break;
      case "nube": forma = '<path d="M28 66a18 18 0 0 1-2-35.8A22 22 0 0 1 68 20a16 16 0 0 1 14 26 15 15 0 0 1-4 30H30Z" fill="'+color+'"/>'; break;
      case "hexagono": forma = '<path d="M50 4 91 27v46L50 96 9 73V27Z" fill="'+color+'"/>'; break;
      default: forma = '<circle cx="50" cy="50" r="46" fill="'+color+'"/>';
    }
    let rasgo = "";
    switch(a.rasgo){
      case "B": rasgo = '<circle cx="38" cy="46" r="6" fill="#25335B"/><circle cx="62" cy="46" r="6" fill="#25335B"/><path d="M36 64c6 7 22 7 28 0" stroke="#25335B" stroke-width="4" stroke-linecap="round" fill="none"/>'; break;
      case "C": rasgo = '<rect x="30" y="42" width="14" height="6" rx="3" fill="#25335B"/><rect x="56" y="42" width="14" height="6" rx="3" fill="#25335B"/><path d="M38 66h24" stroke="#25335B" stroke-width="4" stroke-linecap="round"/>'; break;
      case "D": rasgo = '<circle cx="38" cy="46" r="5" fill="#25335B"/><circle cx="62" cy="46" r="5" fill="#25335B"/><path d="M36 68c6-6 22-6 28 0" stroke="#25335B" stroke-width="4" stroke-linecap="round" fill="none"/>'; break;
      default: rasgo = '<circle cx="38" cy="45" r="5.5" fill="#25335B"/><circle cx="62" cy="45" r="5.5" fill="#25335B"/><path d="M37 63c6 6 20 6 26 0" stroke="#25335B" stroke-width="4" stroke-linecap="round" fill="none"/>';
    }
    return '<svg viewBox="0 0 100 100" role="img" aria-label="Avatar"><rect width="100" height="100" fill="none"/>'+forma+rasgo+'</svg>';
  }
  function avatarAleatorio(color){
    return {
      forma: FORMAS[Math.floor(Math.random()*FORMAS.length)],
      rasgo: RASGOS[Math.floor(Math.random()*RASGOS.length)],
      color: color || "#4C8DFF"
    };
  }
  return { avatarSVG, avatarAleatorio, FORMAS, RASGOS };
})();

/* ===================== ProfileService ===================== */
const ProfileService = (function(){
  function listar(incluirArchivados){
    const datos = Store.obtener();
    return datos.profiles.filter(p=> incluirArchivados ? true : !p.archived);
  }
  function obtener(id){
    return Utils.byId(Store.obtener().profiles, id);
  }
  function activo(){
    const datos = Store.obtener();
    return obtener(datos.appSettings.activeProfileId) || listar()[0] || null;
  }
  function crear(datosPerfil){
    const datos = Store.obtener();
    const perfil = {
      id: Utils.uid("perfil"),
      name: SanitizationService.cleanText(datosPerfil.name, 40),
      age: Utils.clamp(parseInt(datosPerfil.age,10)||7,7,12),
      avatar: datosPerfil.avatar || AvatarService.avatarAleatorio(datosPerfil.color),
      theme: datosPerfil.theme || "auto",
      color: datosPerfil.color || "#4C8DFF",
      schoolDays: datosPerfil.schoolDays || [1,2,3,4,5],
      createdAt: new Date().toISOString(),
      active: true,
      archived: false,
      preferences: datosPerfil.preferences || {}
    };
    datos.profiles.push(perfil);
    if(!datos.appSettings.activeProfileId) datos.appSettings.activeProfileId = perfil.id;
    Store.guardar(true);
    return perfil;
  }
  function actualizar(id, cambios){
    const perfil = obtener(id);
    if(!perfil) return null;
    if(cambios.name !== undefined) perfil.name = SanitizationService.cleanText(cambios.name, 40);
    if(cambios.age !== undefined) perfil.age = Utils.clamp(parseInt(cambios.age,10)||7,7,12);
    if(cambios.avatar !== undefined) perfil.avatar = cambios.avatar;
    if(cambios.theme !== undefined) perfil.theme = cambios.theme;
    if(cambios.color !== undefined) perfil.color = cambios.color;
    if(cambios.schoolDays !== undefined) perfil.schoolDays = cambios.schoolDays;
    Store.guardar(true);
    return perfil;
  }
  function establecerActivo(id){
    const datos = Store.obtener();
    datos.appSettings.activeProfileId = id;
    Store.guardar(true);
  }
  function archivar(id){
    const perfil = obtener(id);
    if(!perfil) return;
    perfil.archived = true;
    const datos = Store.obtener();
    if(datos.appSettings.activeProfileId === id){
      const otro = listar()[0];
      datos.appSettings.activeProfileId = otro ? otro.id : null;
    }
    Store.guardar(true);
  }
  function resumenEliminacion(id){
    const datos = Store.obtener();
    const contar = arr => arr.filter(x=>x.profileId===id).length;
    return {
      tareas: contar(datos.tasks),
      habitos: contar(datos.habits),
      libros: contar(datos.books),
      metas: contar(datos.goals),
      eventos: contar(datos.events)
    };
  }
  function eliminarDefinitivo(id){
    const datos = Store.obtener();
    datos.profiles = datos.profiles.filter(p=>p.id!==id);
    ["subjects","tasks","events","habits","habitLogs","studySessions","books","readingSessions",
     "reviews","goals","goalSteps","emotionLogs","gratitudeLogs","rewards","rewardRedemptions","starTransactions"]
     .forEach(clave=>{ datos[clave] = datos[clave].filter(x=>x.profileId!==id); });
    if(datos.appSettings.activeProfileId === id){
      const otro = listar()[0];
      datos.appSettings.activeProfileId = otro ? otro.id : null;
    }
    Store.guardar(true);
  }
  return { listar, obtener, activo, crear, actualizar, establecerActivo, archivar, resumenEliminacion, eliminarDefinitivo };
})();

/* ===================== Router ===================== */
const Router = (function(){
  const RUTAS_VALIDAS = ["inicio","dia","semana","calendario","tareas","estudio","habitos",
    "biblioteca","metas","gratitud","recompensas","padres","configuracion","ayuda"];
  let manejador = null;
  function rutaActual(){
    const hash = (location.hash || "#/inicio").replace("#/","").split("?")[0];
    return RUTAS_VALIDAS.includes(hash) ? hash : "inicio";
  }
  function ir(ruta){
    if(location.hash === "#/"+ruta){ if(manejador) manejador(ruta); return; }
    location.hash = "#/"+ruta;
  }
  function iniciar(cb){
    manejador = cb;
    window.addEventListener("hashchange", ()=>cb(rutaActual()));
    cb(rutaActual());
  }
  return { rutaActual, ir, iniciar, RUTAS_VALIDAS };
})();

/* ===================== StarService ===================== */
const StarService = (function(){
  const MOTIVOS_DEFECTO = {
    tarea: 3, prioridad: 2, estudio: 3, lectura: 2, meta: 3, habito: 1, gratitud: 1
  };
  function transaccionesDePerfil(profileId){
    return Store.obtener().starTransactions.filter(t=>t.profileId===profileId);
  }
  function saldo(profileId){
    return Utils.sum(transaccionesDePerfil(profileId), t=>t.amount);
  }
  function otorgadasHoy(profileId){
    const hoy = Utils.todayISO();
    return Utils.sum(transaccionesDePerfil(profileId).filter(t=>t.date===hoy && t.amount>0), t=>t.amount);
  }
  function limiteDiario(){ return Store.obtener().appSettings.dailyStarLimit || 12; }
  function otorgar(profileId, cantidadSugerida, motivo, relatedType, relatedId){
    const datos = Store.obtener();
    const yaGanadas = otorgadasHoy(profileId);
    const limite = limiteDiario();
    let cantidad = cantidadSugerida;
    if(yaGanadas >= limite) cantidad = 0;
    else if(yaGanadas + cantidad > limite) cantidad = limite - yaGanadas;
    if(cantidad <= 0) return null;
    const trans = {
      id: Utils.uid("estrella"),
      profileId, amount: cantidad, reason: motivo,
      relatedType: relatedType||"", relatedId: relatedId||"",
      date: Utils.todayISO(), type: "earn"
    };
    datos.starTransactions.push(trans);
    Store.guardar(true);
    if(cantidad > 0){
      ToastManager.mostrar("¡Ganaste "+cantidad+" estrella"+(cantidad===1?"":"s")+"! "+motivo, "exito");
    }
    return trans;
  }
  function gastar(profileId, cantidad, motivo, relatedType, relatedId){
    const disponible = saldo(profileId);
    if(cantidad > disponible) return null;
    const datos = Store.obtener();
    const trans = {
      id: Utils.uid("estrella"),
      profileId, amount: -Math.abs(cantidad), reason: motivo,
      relatedType: relatedType||"", relatedId: relatedId||"",
      date: Utils.todayISO(), type: "spend"
    };
    datos.starTransactions.push(trans);
    Store.guardar(true);
    return trans;
  }
  return { saldo, otorgar, gastar, otorgadasHoy, limiteDiario, MOTIVOS_DEFECTO };
})();

          <button class="fila-elemento" style="width:100%;border:none;text-align:left;${activo&&activo.id===p.id?'outline:2px solid var(--azul-brillante);':''}" data-seleccionar-perfil="${p.id}">
            <div class="avatar-mini">${AvatarService.avatarSVG(p.avatar,p.color)}</div>
            <span class="contenido-fila"><span class="titulo-fila">${SanitizationService.escapeHtml(p.name)}</span><span class="meta-fila">${p.age} años</span></span>
          </button>`).join("")}
      </div>
      <div class="pie-modal" style="justify-content:space-between;">
        <button class="btn btn-fantasma" data-accion-nuevo-perfil>${icono("plus")} Nuevo perfil</button>
        <button class="btn btn-fantasma" data-cerrar-modal>Cerrar</button>
      </div>`
    });
    modal.addEventListener("click",(e)=>{
      const sel = e.target.closest("[data-seleccionar-perfil]");
      if(sel){
        ProfileService.establecerActivo(sel.getAttribute("data-seleccionar-perfil"));
        ModalManager.cerrar();
        UI.renderShell();
      }
      if(e.target.closest("[data-accion-nuevo-perfil]")){
        ModalManager.cerrar();
        ParentPanel.abrirFormularioPerfil(null);
      }
    });
  },
  alternarModoAdulto: function(){
    if(AuthService.esModoAdulto()){
      AuthService.salirModoAdulto();
      ToastManager.mostrar("Saliste del modo adulto.", "info");
      UI.renderShell();
      return;
    }
    if(!AuthService.tienePinConfigurado()){
      ToastManager.mostrar("Primero configura un PIN familiar en Configuración.", "info");
      Router.ir("configuracion");
      return;
    }
    AuthService.pedirPin({
      titulo:"Entrar al modo adulto",
      mensaje:"Ingresa el PIN familiar para ver el panel de padres y la configuración.",
      alExito: function(){
        AuthService.activarModoAdulto();
        ToastManager.mostrar("Modo adulto activado.", "exito");
        Router.ir("padres");
      }
    });
  }
};

        </div>
      </div>
      <div class="campo">
        <label>Forma del avatar</label>
        <div class="grupo-opciones" role="group" aria-label="Forma de avatar">
          ${AvatarService.FORMAS.map(f=>`<button type="button" class="opcion-pastilla" data-forma-avatar="${f}" aria-pressed="${(p.avatar&&p.avatar.forma)===f}">${f}</button>`).join("")}

        <label>Días escolares</label>
        <div class="grupo-opciones" role="group" aria-label="Días escolares">

      <div class="pie-modal">
        <button class="btn btn-fantasma" data-accion-onboarding="atras">Atrás</button>
        <button class="btn btn-primario" data-accion-onboarding="siguiente-perfil">Siguiente</button>
      </div>
    </div>`;
  }

    return `<div class="paso-onboarding">
      <h2>Materias</h2>
      <p class="texto-secundario">Activa las materias que usará este perfil. Puedes cambiarlas después.</p>
      <div class="lista-elementos">
        ${estado.materias.map((m,i)=>`
          <div class="fila-elemento">
            <span class="franja-color" style="background:${m.color}"></span>
            <span class="contenido-fila titulo-fila">${SanitizationService.escapeHtml(m.name)}</span>
            <button type="button" class="btn btn-chico ${m.active?'btn-exito':'btn-fantasma'}" data-toggle-materia="${i}" aria-pressed="${m.active}">${m.active?'Activa':'Inactiva'}</button>
          </div>`).join("")}
      </div>
      <div class="pie-modal">
        <button class="btn btn-fantasma" data-accion-onboarding="atras">Atrás</button>
        <button class="btn btn-primario" data-accion-onboarding="siguiente">Siguiente</button>
      </div>
    </div>`;
  }

  function pasoHabitos(){
    return `<div class="paso-onboarding">
      <h2>Hábitos</h2>
      <p class="texto-secundario">Elige entre 3 y 5 hábitos para comenzar.</p>
      <div class="grupo-opciones" role="group" aria-label="Selecciona hábitos">
        ${DEFAULTS.habitos.map(h=>`<button type="button" class="opcion-pastilla" data-toggle-habito="${SanitizationService.escapeHtml(h.name)}" aria-pressed="${estado.habitosElegidos.includes(h.name)}">${icono(h.icon)} ${SanitizationService.escapeHtml(h.name)}</button>`).join("")}
      </div>
      <p class="error-campo oculto" data-error-onboarding></p>
      <div class="pie-modal">
        <button class="btn btn-fantasma" data-accion-onboarding="atras">Atrás</button>
        <button class="btn btn-primario" data-accion-onboarding="siguiente-habitos">Siguiente</button>
      </div>
    </div>`;
  }

  function pasoRecompensas(){
    return `<div class="paso-onboarding">
      <h2>Recompensas familiares</h2>
      <p class="texto-secundario">Estas dos recompensas iniciales se pueden editar luego desde el panel de padres.</p>
      <div class="lista-elementos">
        ${estado.recompensas.map((r,i)=>`
          <div class="fila-elemento">
            ${icono(r.icon)}
            <span class="contenido-fila">
              <input type="text" aria-label="Nombre de recompensa ${i+1}" value="${SanitizationService.escapeHtml(r.name)}" data-recompensa-nombre="${i}" maxlength="40" style="border:2px solid var(--borde);border-radius:10px;padding:8px;width:100%;background:var(--bg-elevada);color:var(--texto-principal);">
            </span>
            <span class="flex gap-8" style="align-items:center;">
              <input type="number" min="1" max="999" value="${r.cost}" data-recompensa-costo="${i}" aria-label="Costo en estrellas" style="width:70px;border:2px solid var(--borde);border-radius:10px;padding:8px;background:var(--bg-elevada);color:var(--texto-principal);">
              ${icono("star")}
            </span>
          </div>`).join("")}
      </div>
      <div class="pie-modal">
        <button class="btn btn-fantasma" data-accion-onboarding="atras">Atrás</button>
        <button class="btn btn-primario" data-accion-onboarding="siguiente">Siguiente</button>
      </div>
    </div>`;
  }

  function pasoFinal(){
    const p = estado.perfil;
    return `<div class="paso-onboarding centrado">
      <div class="avatar-grande">${AvatarService.avatarSVG(p.avatar,p.color)}</div>
      <h2>¡Todo listo, ${SanitizationService.escapeHtml(p.name || "explorador")}!</h2>
      <p class="texto-secundario">Creamos tu perfil, tus materias, ${estado.habitosElegidos.length} hábitos y ${estado.recompensas.length} recompensas.</p>
      <div class="flex flex-col gap-8">
        <button class="btn btn-primario btn-bloque" data-autofoco data-accion-onboarding="entrar-nino">Entrar como niño</button>
        <button class="btn btn-fantasma btn-bloque" data-accion-onboarding="entrar-padres">Ir al panel de padres</button>
      </div>
    </div>`;
  }

  function mostrarError(msg){
    const el = document.querySelector("[data-error-onboarding]");
    if(el){ el.textContent = msg; el.classList.remove("oculto"); }
  }

  function actualizarPreviaAvatar(cont){
    const previa = cont.querySelector(".avatar-grande");
    if(previa) previa.innerHTML = AvatarService.avatarSVG(estado.perfil.avatar, estado.perfil.color);
  }
  function ligarEventosPaso(){
    const cont = document.getElementById("app");
    // Guardar en vivo lo que se escribe, para que los micro-clics (color, avatar, día)
    // no borren texto ya escrito al no forzar un render completo del paso.
    const campoNombreNino = cont.querySelector("#ob-nombre-nino");
    if(campoNombreNino) campoNombreNino.addEventListener("input", ()=>{ estado.perfil.name = campoNombreNino.value; });
    const campoNombreAdulto = cont.querySelector("#ob-adulto-nombre");
    if(campoNombreAdulto) campoNombreAdulto.addEventListener("input", ()=>{ estado.adultName = campoNombreAdulto.value; });

    cont.querySelectorAll("[data-color-perfil]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        estado.perfil.color = btn.getAttribute("data-color-perfil");
        if(estado.perfil.avatar) estado.perfil.avatar.color = estado.perfil.color;
        cont.querySelectorAll("[data-color-perfil]").forEach(b=>b.setAttribute("aria-pressed", b===btn));
        actualizarPreviaAvatar(cont);
      });
    });
    cont.querySelectorAll("[data-forma-avatar]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        estado.perfil.avatar = Object.assign({forma:"redondo",rasgo:"A",color:estado.perfil.color}, estado.perfil.avatar, {forma: btn.getAttribute("data-forma-avatar")});
        cont.querySelectorAll("[data-forma-avatar]").forEach(b=>b.setAttribute("aria-pressed", b===btn));
        actualizarPreviaAvatar(cont);
      });
    });
    cont.querySelectorAll("[data-dia-escolar]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const v = parseInt(btn.getAttribute("data-dia-escolar"),10);
        const idx = estado.perfil.schoolDays.indexOf(v);
        if(idx>=0) estado.perfil.schoolDays.splice(idx,1); else estado.perfil.schoolDays.push(v);
        btn.setAttribute("aria-pressed", estado.perfil.schoolDays.includes(v));
      });
    });
    cont.querySelectorAll("[data-toggle-materia]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const i = parseInt(btn.getAttribute("data-toggle-materia"),10);
        estado.materias[i].active = !estado.materias[i].active;
        btn.textContent = estado.materias[i].active ? "Activa" : "Inactiva";
        btn.classList.toggle("btn-exito", estado.materias[i].active);
        btn.classList.toggle("btn-fantasma", !estado.materias[i].active);
        btn.setAttribute("aria-pressed", estado.materias[i].active);
      });
    });
    cont.querySelectorAll("[data-toggle-habito]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const nombre = btn.getAttribute("data-toggle-habito");
        const idx = estado.habitosElegidos.indexOf(nombre);
        if(idx>=0){ estado.habitosElegidos.splice(idx,1); btn.setAttribute("aria-pressed","false"); }
        else if(estado.habitosElegidos.length < 5){ estado.habitosElegidos.push(nombre); btn.setAttribute("aria-pressed","true"); }
      });
    });
    cont.querySelectorAll("[data-recompensa-nombre]").forEach(inp=>{
      inp.addEventListener("input", ()=>{ estado.recompensas[parseInt(inp.getAttribute("data-recompensa-nombre"),10)].name = inp.value; });
    });
    cont.querySelectorAll("[data-recompensa-costo]").forEach(inp=>{
      inp.addEventListener("input", ()=>{ estado.recompensas[parseInt(inp.getAttribute("data-recompensa-costo"),10)].cost = parseInt(inp.value,10)||1; });
    });
    cont.querySelectorAll("[data-accion-onboarding]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const accion = btn.getAttribute("data-accion-onboarding");
        if(accion === "comenzar"){ paso = 2; render(); }
        else if(accion === "demo"){ await finalizarConDemo(); }
        else if(accion === "atras"){ paso = Math.max(1,paso-1); render(); }
        else if(accion === "siguiente"){ paso++; render(); }
        else if(accion === "siguiente-adulto"){
          const nombre = document.getElementById("ob-adulto-nombre").value;
          const pin = SanitizationService.onlyDigits(document.getElementById("ob-pin").value);
          const pin2 = SanitizationService.onlyDigits(document.getElementById("ob-pin-confirmar").value);
          const val = ValidationService.pinValido(pin);
          if(!val.ok){ mostrarError(val.mensaje); return; }
          if(pin !== pin2){ mostrarError("Los dos PIN deben ser iguales. Vuelve a escribirlos."); return; }
          estado.adultName = SanitizationService.cleanText(nombre,40);
          estado.pin = pin; estado.pinConfirm = pin2;
          paso = 3; render();
        }
        else if(accion === "siguiente-perfil"){
          const nombre = document.getElementById("ob-nombre-nino").value;
          if(!ValidationService.required(nombre,"").ok){ mostrarError("Escribe un nombre o apodo para continuar."); return; }
          estado.perfil.name = SanitizationService.cleanText(nombre,30);
          estado.perfil.age = parseInt(document.getElementById("ob-edad-nino").value,10);
          estado.perfil.theme = document.getElementById("ob-tema-nino").value;
          if(estado.perfil.schoolDays.length===0){ mostrarError("Elige al menos un día escolar."); return; }
          if(!estado.perfil.avatar) estado.perfil.avatar = {forma:"redondo",rasgo:"A",color:estado.perfil.color};
          paso = 4; render();
        }
        else if(accion === "siguiente-habitos"){
          if(estado.habitosElegidos.length < 3){ mostrarError("Elige al menos 3 hábitos."); return; }
          paso = 6; render();
        }
        else if(accion === "entrar-nino"){ await finalizar(false); }
        else if(accion === "entrar-padres"){ await finalizar(true); }
      });
    });
  }

  async function crearDatosBase(){
    const datos = Store.obtener();
    await AuthService.configurarPin(estado.pin, estado.adultName);
    const perfil = ProfileService.crear(estado.perfil);
    estado.materias.forEach(m=>{
      datos.subjects.push({ id:Utils.uid("materia"), profileId:perfil.id, name:m.name, color:m.color, active:m.active, isDefault:true });
    });
    estado.habitosElegidos.forEach(nombre=>{
      const def = DEFAULTS.habitos.find(h=>h.name===nombre) || {icon:"star"};
      datos.habits.push({
        id:Utils.uid("habito"), profileId:perfil.id, name:nombre, icon:def.icon, color:perfil.color,
        activeDays:[0,1,2,3,4,5,6], time:"", stars:1, status:"activo",
        startDate:Utils.todayISO(), archivedDate:""
      });
    });
    estado.recompensas.forEach(r=>{
      datos.rewards.push({
        id:Utils.uid("recompensa"), profileId:perfil.id, name:SanitizationService.cleanText(r.name,40)||r.name,
        description:"", cost: Utils.clamp(r.cost,1,999), icon:r.icon, active:true,
        requiresApproval:true, timesAvailable:0, timesRedeemed:0
      });
    });
    datos.appSettings.onboardingDone = true;
    datos.appSettings.activeProfileId = perfil.id;
    Store.guardar(true);
    return perfil;
  }

  async function finalizar(irAPadres){
    await crearDatosBase();
    App.arrancarAppPrincipal();
    if(irAPadres){ App.alternarModoAdulto(); }
  }

  async function finalizarConDemo(){
    estado.adultName = "Adulto de la familia";
    estado.pin = "1234"; estado.pinConfirm = "1234";
    estado.perfil.name = "Alex";
    estado.perfil.age = 10;
    estado.perfil.avatar = {forma:"estrella", rasgo:"A", color:"#4C8DFF"};
    estado.habitosElegidos = ["Preparar mochila","Leer","Tomar agua"];
    const perfil = await crearDatosBase();
    DemoData.cargarParaPerfil(perfil.id);
    App.arrancarAppPrincipal();
  }

  function iniciar(){ paso = 1; render(); }
  return { iniciar };
})();

/* ===================== Plantillas para dividir tareas ===================== */
const PLANTILLAS_PASOS = {
  exposicion: ["Elegir tema","Buscar información","Escribir resumen","Preparar material","Practicar","Entregar o presentar"],
  proyecto: ["Definir objetivo","Reunir materiales","Hacer un borrador","Revisar y corregir","Terminar y entregar"],
  examen: ["Repasar apuntes","Hacer resumen","Resolver ejercicios de práctica","Repasar dudas","Descansar bien antes del examen"],
  lectura: ["Elegir capítulo o páginas","Leer con calma","Escribir lo más importante","Comentarlo con un adulto"],
  general: ["Entender qué se pide","Reunir lo necesario","Hacer una parte","Revisar","Terminar"]
};

/* ===================== SubjectService ===================== */
const SubjectService = (function(){
  function listar(profileId, soloActivas){
    const datos = Store.obtener();
    return datos.subjects.filter(s=> s.profileId===profileId && (soloActivas ? s.active : true));
  }
  function obtener(id){ return Utils.byId(Store.obtener().subjects, id); }

/* ===================== TaskService ===================== */
const TaskService = (function(){
  function listar(profileId, filtros){
    const datos = Store.obtener();
    let lista = datos.tasks.filter(t=>t.profileId===profileId);
    if(filtros){
      if(filtros.estado) lista = lista.filter(t=>t.status===filtros.estado);
      if(filtros.materiaId) lista = lista.filter(t=>t.subjectId===filtros.materiaId);
      if(filtros.fecha) lista = lista.filter(t=>t.dueDate===filtros.fecha);
      if(filtros.necesitaAyuda) lista = lista.filter(t=>t.needsHelp);
    }
    return lista.sort((a,b)=> (a.dueDate||"9999").localeCompare(b.dueDate||"9999"));
  }
  function obtener(id){ return Utils.byId(Store.obtener().tasks, id); }
  function crear(profileId, campos){
    const datos = Store.obtener();
    const tarea = {
      id: Utils.uid("tarea"), profileId,
      subjectId: campos.subjectId || "",
      title: SanitizationService.cleanText(campos.title, 80),
      description: SanitizationService.cleanText(campos.description, 500),
      dueDate: campos.dueDate || "",
      priority: campos.priority || "media",
      difficulty: campos.difficulty || "facil",
      estimatedMinutes: Utils.clamp(parseInt(campos.estimatedMinutes,10)||15, 5, 480),
      materials: SanitizationService.cleanText(campos.materials, 200),
      steps: [],
      status: "pendiente",
      needsHelp: !!campos.needsHelp,
      notes: SanitizationService.cleanText(campos.notes, 500),
      createdAt: new Date().toISOString(),
      completedAt: ""
    };
    datos.tasks.push(tarea);
    Store.guardar(true);
    return tarea;
  }
  function actualizar(id, campos){
    const t = obtener(id);
    if(!t) return null;
    ["subjectId","priority","difficulty","dueDate"].forEach(k=>{ if(campos[k]!==undefined) t[k]=campos[k]; });
    if(campos.title!==undefined) t.title = SanitizationService.cleanText(campos.title,80);
    if(campos.description!==undefined) t.description = SanitizationService.cleanText(campos.description,500);
    if(campos.materials!==undefined) t.materials = SanitizationService.cleanText(campos.materials,200);
    if(campos.notes!==undefined) t.notes = SanitizationService.cleanText(campos.notes,500);
    if(campos.estimatedMinutes!==undefined) t.estimatedMinutes = Utils.clamp(parseInt(campos.estimatedMinutes,10)||15,5,480);
    if(campos.needsHelp!==undefined) t.needsHelp = !!campos.needsHelp;
    Store.guardar(true);
    return t;
  }
  function cambiarEstado(id, estado){
    const t = obtener(id);
    if(!t) return null;
    const previo = t.status;
    t.status = estado;
    if(estado === "terminada" && previo !== "terminada"){
      t.completedAt = new Date().toISOString();
      StarService.otorgar(t.profileId, StarService.MOTIVOS_DEFECTO.tarea, "por terminar la tarea \""+t.title+"\"", "tarea", t.id);
    }
    Store.guardar(true);
    return t;
  }
  function agregarPaso(id, texto){
    const t = obtener(id);
    if(!t) return null;
    t.steps.push({ id: Utils.uid("paso"), text: SanitizationService.cleanText(texto,120), done:false });
    Store.guardar(true);
    return t;
  }
  function aplicarPlantilla(id, clave){
    const t = obtener(id);
    if(!t) return null;
    const pasos = PLANTILLAS_PASOS[clave] || PLANTILLAS_PASOS.general;
    pasos.forEach(p=> t.steps.push({ id: Utils.uid("paso"), text:p, done:false }));
    Store.guardar(true);
    return t;
  }
  function alternarPaso(idTarea, idPaso){
    const t = obtener(idTarea);
    if(!t) return null;
    const paso = t.steps.find(s=>s.id===idPaso);
    if(paso) paso.done = !paso.done;
    if(t.steps.length && t.steps.every(s=>s.done) && t.status !== "terminada"){
      cambiarEstado(idTarea, "terminada");
    } else {
      Store.guardar(true);
    }
    return t;
  }
  function eliminarPaso(idTarea, idPaso){
    const t = obtener(idTarea);
    if(!t) return null;
    t.steps = t.steps.filter(s=>s.id!==idPaso);
    Store.guardar(true);
    return t;
  }
  function eliminar(id){
    const datos = Store.obtener();
    datos.tasks = datos.tasks.filter(t=>t.id!==id);
    Store.guardar(true);
  }
  return { listar, obtener, crear, actualizar, cambiarEstado, agregarPaso, aplicarPlantilla, alternarPaso, eliminarPaso, eliminar };
})();

/* ===================== CalendarService (eventos) ===================== */
const CalendarService = (function(){
  const TIPOS = [
    {v:"tarea", l:"Tarea", color:"#4C8DFF"}, {v:"examen", l:"Examen", color:"#FF7A7A"},
    {v:"entrega", l:"Entrega", color:"#F6C84C"}, {v:"deporte", l:"Deporte", color:"#32C6B5"},
    {v:"actividad", l:"Actividad", color:"#8B7CF6"}, {v:"cumpleanos", l:"Cumpleaños", color:"#FF7A7A"},
    {v:"vacaciones", l:"Vacaciones", color:"#32C6B5"}, {v:"familia", l:"Familia", color:"#F6C84C"},
    {v:"otro", l:"Otro", color:"#5A6478"}
  ];
  function listar(profileId, filtros){
    const datos = Store.obtener();
    let lista = datos.events.filter(e=>e.profileId===profileId);
    if(filtros){
      if(filtros.desde) lista = lista.filter(e=>e.date >= filtros.desde);
      if(filtros.hasta) lista = lista.filter(e=>e.date <= filtros.hasta);
      if(filtros.tipo) lista = lista.filter(e=>e.type===filtros.tipo);
    }
    return lista.sort((a,b)=> (a.date+ (a.time||"00:00")).localeCompare(b.date+(b.time||"00:00")));
  }
  function obtener(id){ return Utils.byId(Store.obtener().events, id); }
  function crear(profileId, campos){
    const datos = Store.obtener();
    const ev = {
      id: Utils.uid("evento"), profileId,
      title: SanitizationService.cleanText(campos.title,80),
      date: campos.date, time: campos.time||"",
      type: campos.type || "otro",
      color: (TIPOS.find(t=>t.v===(campos.type||"otro"))||{}).color || "#5A6478",
      description: SanitizationService.cleanText(campos.description,300),
      repeat: campos.repeat || "ninguna",
      status: "pendiente"
    };
    datos.events.push(ev);
    if(ev.repeat && ev.repeat !== "ninguna"){
      generarRepeticiones(ev);
    }
    Store.guardar(true);
    return ev;
  }
  function generarRepeticiones(evBase){
    const datos = Store.obtener();
    const veces = 8;
    let fecha = evBase.date;
    for(let i=0;i<veces;i++){
      fecha = evBase.repeat === "semanal" ? Utils.addDays(fecha,7) : Utils.addDays(fecha,1);
      datos.events.push(Object.assign({}, evBase, { id:Utils.uid("evento"), date:fecha }));
    }
  }
  function actualizar(id, campos){
    const ev = obtener(id);
    if(!ev) return null;
    ["date","time","type","repeat","status"].forEach(k=>{ if(campos[k]!==undefined) ev[k]=campos[k]; });
    if(campos.title!==undefined) ev.title = SanitizationService.cleanText(campos.title,80);
    if(campos.description!==undefined) ev.description = SanitizationService.cleanText(campos.description,300);
    if(campos.type!==undefined) ev.color = (TIPOS.find(t=>t.v===campos.type)||{}).color || "#5A6478";
    Store.guardar(true);
    return ev;
  }
  function eliminar(id){
    const datos = Store.obtener();
    datos.events = datos.events.filter(e=>e.id!==id);
    Store.guardar(true);
  }
  return { listar, obtener, crear, actualizar, eliminar, TIPOS };
})();

      startDate: Utils.todayISO(),
      archivedDate: ""
    };

    Store.guardar(true);

  }
  function actualizar(id, campos){
    const h = obtener(id);
    if(!h) return null;
    if(campos.name!==undefined) h.name = SanitizationService.cleanText(campos.name,40);
    ["icon","color","activeDays","time"].forEach(k=>{ if(campos[k]!==undefined) h[k]=campos[k]; });
    if(campos.stars!==undefined) h.stars = Utils.clamp(parseInt(campos.stars,10)||1,1,10);
    Store.guardar(true);
    return h;
  }
  function archivar(id){
    const h = obtener(id);
    if(!h) return;
    h.status = "archivado";
    h.archivedDate = Utils.todayISO();
    Store.guardar(true);
  }
  function logDeFecha(habitId, fecha){
    return Store.obtener().habitLogs.find(l=>l.habitId===habitId && l.date===fecha) || null;
  }
  function estaMarcado(habitId, fecha){
    const log = logDeFecha(habitId, fecha);
    return !!(log && log.done);
  }
  function marcar(habitId, fecha){
    const datos = Store.obtener();
    const h = obtener(habitId);
    if(!h) return null;
    let log = logDeFecha(habitId, fecha);
    if(!log){
      log = { id: Utils.uid("registro"), habitId, profileId:h.profileId, date:fecha, done:true };
      datos.habitLogs.push(log);
    } else {
      log.done = true;
    }
    Store.guardar(true);
    StarService.otorgar(h.profileId, h.stars, "por cumplir el hábito \""+h.name+"\"", "habito", h.id);
    return log;
  }
  function desmarcar(habitId, fecha){
    const log = logDeFecha(habitId, fecha);
    if(log){ log.done = false; Store.guardar(true); }
    return log;
  }
  function porcentajeCumplimiento(habitId, desdeISO, hastaISO){
    const datos = Store.obtener();
    const logs = datos.habitLogs.filter(l=>l.habitId===habitId && l.date>=desdeISO && l.date<=hastaISO && l.done);
    let dias = 0; let cursor = desdeISO;
    while(cursor <= hastaISO){ dias++; cursor = Utils.addDays(cursor,1); }
    return dias ? Math.round((logs.length/dias)*100) : 0;
  }
  return { listar, obtener, crear, actualizar, archivar, marcar, desmarcar, estaMarcado, logDeFecha, porcentajeCumplimiento };
})();

const ReadingService = (function(){

  function colorPortada(titulo){
    let h = 0;
    for(let i=0;i<(titulo||"").length;i++) h = (h + titulo.charCodeAt(i)) % COLORES_PORTADA.length;
    return COLORES_PORTADA[h];

  function listarLibros(profileId, estado){

  function actualizar(id, campos){

    if(campos.reflection!==undefined) g.reflection = SanitizationService.cleanText(campos.reflection,400);

    return g;
  }
  function agregarPaso(goalId, texto){

    datos.goalSteps.push({ id:Utils.uid("pasometa"), goalId, text:SanitizationService.cleanText(texto,120), done:false, order:pasosDe(goalId).length });
    recalcularProgreso(goalId);
    return obtener(goalId);
  }
  function alternarPaso(goalId, pasoId){
    const datos = Store.obtener();
    const p = datos.goalSteps.find(s=>s.id===pasoId);
    if(p) p.done = !p.done;
    recalcularProgreso(goalId);
  }
  function recalcularProgreso(goalId){
    const datos = Store.obtener();
    const g = obtener(goalId);
    const pasos = pasosDe(goalId);
    if(g){
      g.progress = pasos.length ? Math.round((pasos.filter(p=>p.done).length / pasos.length) * 100) : g.progress;
      if(g.progress === 100 && g.status === "activa"){
        g.status = "cumplida";
        StarService.otorgar(g.profileId, StarService.MOTIVOS_DEFECTO.meta, "por cumplir la meta \""+g.name+"\"", "meta", g.id);
      }
    }
    Store.guardar(true);
  }
  function registrarAvance(goalId){
    const g = obtener(goalId);
    if(!g) return;
    StarService.otorgar(g.profileId, StarService.MOTIVOS_DEFECTO.meta, "por trabajar en la meta \""+g.name+"\"", "meta", g.id);
  }
  function eliminar(id){
    const datos = Store.obtener();
    datos.goals = datos.goals.filter(g=>g.id!==id);
    datos.goalSteps = datos.goalSteps.filter(s=>s.goalId!==id);
    Store.guardar(true);
  }
  return { listar, obtener, pasosDe, crear, actualizar, agregarPaso, alternarPaso, recalcularProgreso, registrarAvance, eliminar, CATEGORIAS };
})();

/* ===================== EmotionService (emociones y gratitud) ===================== */
const EmotionService = (function(){
  const EMOCIONES = [
    {v:"feliz", l:"Feliz", icono:"smile"}, {v:"tranquilo", l:"Tranquilo", icono:"smile"},
    {v:"emocionado", l:"Emocionado", icono:"star"}, {v:"cansado", l:"Cansado", icono:"bed"},
    {v:"preocupado", l:"Preocupado", icono:"help"}, {v:"triste", l:"Triste", icono:"smile"},
    {v:"enojado", l:"Enojado", icono:"activity"}, {v:"confundido", l:"Confundido", icono:"puzzle"}
  ];
  const EMOCIONES_DIFICILES = ["preocupado","triste","enojado","confundido"];

  function registrarEmocion(profileId, fecha, emocion, nota){
    const datos = Store.obtener();
    let log = datos.emotionLogs.find(e=>e.profileId===profileId && e.date===fecha);
    if(!log){
      log = { id: Utils.uid("emocion"), profileId, date:fecha, emotion:emocion, note: SanitizationService.cleanText(nota,200) };
      datos.emotionLogs.push(log);
    } else {
      log.emotion = emocion;
      log.note = SanitizationService.cleanText(nota, 200);
    }
    Store.guardar(true);
    return log;
  }
  function emocionDeHoy(profileId){
    return Store.obtener().emotionLogs.find(e=>e.profileId===profileId && e.date===Utils.todayISO()) || null;
  }
  function historial(profileId, dias){
    const datos = Store.obtener();
    const desde = Utils.addDays(Utils.todayISO(), -(dias||14));
    return datos.emotionLogs.filter(e=>e.profileId===profileId && e.date>=desde).sort((a,b)=>b.date.localeCompare(a.date));
  }
  function necesitaSugerenciaConversacion(profileId){
    const datos = Store.obtener();
    if(datos.appSettings.hideEmotionAdvice) return false;
    const ultimos = historial(profileId, 5);
    const dificiles = ultimos.filter(e=>EMOCIONES_DIFICILES.includes(e.emotion));
    return dificiles.length >= 3;
  }
  function registrarGratitud(profileId, fecha, campos){
    const datos = Store.obtener();
    const existente = datos.gratitudeLogs.find(g=>g.profileId===profileId && g.date===fecha);
    const registro = {
      id: existente ? existente.id : Utils.uid("gratitud"), profileId, date: fecha,
      threeThings: (campos.threeThings||[]).map(t=>SanitizationService.cleanText(t,100)).filter(Boolean),
      goodThing: SanitizationService.cleanText(campos.goodThing,200),
      helper: SanitizationService.cleanText(campos.helper,100),
      kindThing: SanitizationService.cleanText(campos.kindThing,200),
      learned: SanitizationService.cleanText(campos.learned,200),
      tomorrowWant: SanitizationService.cleanText(campos.tomorrowWant,200)
    };
    if(existente){
      Object.assign(existente, registro);
    } else {
      datos.gratitudeLogs.push(registro);
      StarService.otorgar(profileId, StarService.MOTIVOS_DEFECTO.gratitud, "por registrar tu gratitud", "gratitud", registro.id);
    }
    Store.guardar(true);
    return registro;
  }
  function gratitudDeFecha(profileId, fecha){
    return Store.obtener().gratitudeLogs.find(g=>g.profileId===profileId && g.date===fecha) || null;
  }
  function listarGratitud(profileId){
    return Store.obtener().gratitudeLogs.filter(g=>g.profileId===profileId).sort((a,b)=>b.date.localeCompare(a.date));
  }
  return { registrarEmocion, emocionDeHoy, historial, necesitaSugerenciaConversacion,
    registrarGratitud, gratitudDeFecha, listarGratitud, EMOCIONES, EMOCIONES_DIFICILES };
})();

/* ===================== RewardService ===================== */
const RewardService = (function(){
  function listar(profileId, soloActivas){
    const datos = Store.obtener();
    return datos.rewards.filter(r=> r.profileId===profileId && (soloActivas ? r.active : true));
  }
  function obtener(id){ return Utils.byId(Store.obtener().rewards, id); }
  function crear(profileId, campos){
    const datos = Store.obtener();
    const r = {
      id: Utils.uid("recompensa"), profileId,
      name: SanitizationService.cleanText(campos.name,60),
      description: SanitizationService.cleanText(campos.description,200),
      cost: Utils.clamp(parseInt(campos.cost,10)||10,1,999),
      icon: campos.icon || "gift",
      active: true,
      requiresApproval: campos.requiresApproval !== false,
      timesAvailable: parseInt(campos.timesAvailable,10)||0,
      timesRedeemed: 0
    };
    datos.rewards.push(r);
    Store.guardar(true);
    return r;
  }
  function actualizar(id, campos){
    const r = obtener(id);
    if(!r) return null;
    if(campos.name!==undefined) r.name = SanitizationService.cleanText(campos.name,60);
    if(campos.description!==undefined) r.description = SanitizationService.cleanText(campos.description,200);
    if(campos.cost!==undefined) r.cost = Utils.clamp(parseInt(campos.cost,10)||10,1,999);
    ["icon","active","requiresApproval","timesAvailable"].forEach(k=>{ if(campos[k]!==undefined) r[k]=campos[k]; });
    Store.guardar(true);
    return r;
  }
  function eliminar(id){
    const datos = Store.obtener();
    datos.rewards = datos.rewards.filter(r=>r.id!==id);
    Store.guardar(true);
  }
  function solicitarCanje(profileId, rewardId){
    const r = obtener(rewardId);
    if(!r) return null;
    const saldo = StarService.saldo(profileId);
    if(saldo < r.cost) return { error: "No tienes suficientes estrellas todavía para esta recompensa." };
    const datos = Store.obtener();
    const solicitud = {
      id: Utils.uid("canje"), profileId, rewardId,
      status: "pendiente", requestedAt: new Date().toISOString(), resolvedAt: "", resolvedBy: ""
    };
    datos.rewardRedemptions.push(solicitud);
    Store.guardar(true);
    return { solicitud };
  }
  function listarSolicitudes(profileId, estado){
    const datos = Store.obtener();
    let lista = profileId ? datos.rewardRedemptions.filter(s=>s.profileId===profileId) : datos.rewardRedemptions.slice();
    if(estado) lista = lista.filter(s=>s.status===estado);
    return lista.sort((a,b)=> b.requestedAt.localeCompare(a.requestedAt));
  }
  function resolverSolicitud(id, aprobar, nombreResponsable){
    const datos = Store.obtener();
    const s = datos.rewardRedemptions.find(x=>x.id===id);
    if(!s) return null;
    const r = obtener(s.rewardId);
    if(aprobar){
      const saldo = StarService.saldo(s.profileId);
      if(!r || saldo < r.cost){
        s.status = "rechazado";
        s.resolvedAt = new Date().toISOString();
        s.resolvedBy = nombreResponsable||"";
        Store.guardar(true);
        return { ok:false, motivo:"Ya no hay estrellas suficientes para este canje." };
      }
      StarService.gastar(s.profileId, r.cost, "por canjear \""+r.name+"\"", "recompensa", r.id);
      r.timesRedeemed = (r.timesRedeemed||0) + 1;
      s.status = "aprobado";
    } else {
      s.status = "rechazado";
    }
    s.resolvedAt = new Date().toISOString();
    s.resolvedBy = nombreResponsable||"";
    Store.guardar(true);
    return { ok:true };
  }
  return { listar, obtener, crear, actualizar, eliminar, solicitarCanje, listarSolicitudes, resolverSolicitud };
})();
