<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FAF7F1; --ink-soft:#C9BDB0;
  --terracotta:#D08563; --sage:#9BAC9D; --gold:#BFA06A;
  --grad-marca:linear-gradient(135deg,#D08563 0%,#B5664A 50%,#7D8F82 100%);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1080px;height:1920px;overflow:hidden;font-family:'Inter',sans-serif;}
.canvas{
  width:1080px;height:1920px;position:relative;
  background:
    radial-gradient(ellipse 900px 700px at 50% 85%, rgba(208,133,99,0.16) 0%, transparent 60%),
    linear-gradient(180deg,#241F1A 0%, #1C1713 100%);
  display:flex; align-items:center; justify-content:center;
}
.safe{position:absolute; top:250px; left:90px; right:90px; bottom:250px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;}

.logo{display:flex; align-items:center; gap:12px; margin-bottom:76px;}
.anillo{width:50px;height:50px;border-radius:50%;background:var(--grad-marca);display:flex;align-items:center;justify-content:center;font-size:24px;}
.wordmark{font-family:'Playfair Display',serif;font-weight:700;font-size:1.9rem;color:#FAF7F1;}

.headline{
  font-family:'Playfair Display',serif; font-size:70px; line-height:1.2; font-weight:700; color:#FAF7F1;
}

.linea{width:70px; height:2px; background:var(--gold); margin:44px 0;}

.precio-row{display:flex; align-items:baseline; gap:16px; font-family:'Playfair Display',serif; color:#FAF7F1;}
.precio-row .marca{font-size:40px; font-weight:700;}
.precio-row .precio{font-size:66px; font-weight:700; color:var(--terracotta); font-variant-numeric:tabular-nums;}
.nota{margin-top:20px; font-size:28px; color:var(--ink-soft);}

.cta{
  margin-top:64px; background:var(--terracotta); color:#1C1713; font-weight:700; font-size:28px;
  padding:24px 64px; border-radius:44px; box-shadow:0 18px 40px rgba(208,133,99,0.3);
}
</style></head><body>
<div class="canvas">
  <div class="safe">
    <div class="logo"><span class="anillo">💍</span><span class="wordmark">Vowia</span></div>
    <div class="headline">Empiecen a<br>planear juntos.</div>
    <div class="linea"></div>
    <div class="precio-row"><span class="marca">VOWIA —</span><span class="precio">$344 MXN</span></div>
    <div class="nota">Pago único. Sin mensualidades.</div>
    <div class="cta">Conoce Vowia</div>
  </div>
</div>
</body></html>
