      titulo: t ? "Editar tarea" : "Nueva tarea",
      html: `<div class="encabezado-modal"><h2>${t?"Editar tarea":"Nueva tarea"}</h2><button class="btn btn-icono btn-fantasma" data-cerrar-modal aria-label="Cerrar">${ICONS.close}</button></div>
      <form data-form-tarea>
        <div class="campo">
          <label for="tarea-titulo">Título</label>
          <input id="tarea-titulo" type="text" maxlength="80" value="${t?SanitizationService.escapeHtml(t.title):''}" data-autofoco>
          <span class="error-campo oculto" data-error="titulo"></span>
        </div>
        <div class="campo">
          <label for="tarea-materia">Materia</label>
          <select id="tarea-materia">
            <option value="">Sin materia</option>
            ${materias.map(m=>`<option value="${m.id}" ${t&&t.subjectId===m.id?'selected':''}>${SanitizationService.escapeHtml(m.name)}</option>`).join("")}
          </select>
        </div>
        <div class="campo">
          <label for="tarea-desc">Descripción</label>
          <textarea id="tarea-desc" maxlength="500">${t?SanitizationService.escapeHtml(t.description):''}</textarea>
        </div>
        <div class="fila-campos">
          <div class="campo"><label for="tarea-fecha">Fecha de entrega</label><input id="tarea-fecha" type="date" value="${t?t.dueDate:''}"></div>
          <div class="campo"><label for="tarea-tiempo">Tiempo estimado (min)</label><input id="tarea-tiempo" type="number" min="5" max="480" value="${t?t.estimatedMinutes:20}"></div>
        </div>
        <div class="fila-campos">
          <div class="campo"><label for="tarea-prioridad">Prioridad</label>
            <select id="tarea-prioridad">
              <option value="baja" ${t&&t.priority==='baja'?'selected':''}>Baja</option>
              <option value="media" ${(!t||t.priority==='media')?'selected':''}>Media</option>
              <option value="alta" ${t&&t.priority==='alta'?'selected':''}>Alta</option>
            </select>
          </div>
          <div class="campo"><label for="tarea-dificultad">Dificultad</label>
            <select id="tarea-dificultad">
              <option value="facil" ${(!t||t.difficulty==='facil')?'selected':''}>Fácil</option>
              <option value="concentrarme" ${t&&t.difficulty==='concentrarme'?'selected':''}>Necesito concentrarme</option>
              <option value="dificil" ${t&&t.difficulty==='dificil'?'selected':''}>Difícil</option>
              <option value="ayuda" ${t&&t.difficulty==='ayuda'?'selected':''}>Necesito ayuda</option>
            </select>
          </div>
        </div>
        <div class="campo"><label for="tarea-materiales">Materiales necesarios</label><input id="tarea-materiales" type="text" maxlength="200" value="${t?SanitizationService.escapeHtml(t.materials):''}"></div>
        <div class="campo"><label for="tarea-notas">Notas</label><textarea id="tarea-notas" maxlength="500">${t?SanitizationService.escapeHtml(t.notes):''}</textarea></div>
        <div class="campo">
          <label><input type="checkbox" id="tarea-ayuda" ${t&&t.needsHelp?'checked':''} style="width:auto;"> Necesito ayuda con esta tarea</label>
        </div>
        <div class="pie-modal">
          ${t?`<button type="button" class="btn btn-peligro" data-eliminar-tarea="${t.id}">${icono("trash")} Eliminar</button>`:''}
          <button type="button" class="btn btn-fantasma" data-cerrar-modal>Cancelar</button>
          <button type="submit" class="btn btn-primario">Guardar</button>
        </div>
      </form>`
    });
    modal.querySelector("[data-form-tarea]").addEventListener("submit", (e)=>{
      e.preventDefault();
      const titulo = document.getElementById("tarea-titulo").value;
      const val = ValidationService.required(titulo,"");
      if(!val.ok){
        const err = modal.querySelector('[data-error="titulo"]');
        err.textContent = "No encontramos el nombre de la tarea. Escríbelo para poder guardarla.";
        err.classList.remove("oculto");
        return;
      }
      const campos = {
        title: titulo,
        subjectId: document.getElementById("tarea-materia").value,
        description: document.getElementById("tarea-desc").value,
        dueDate: document.getElementById("tarea-fecha").value,
        estimatedMinutes: document.getElementById("tarea-tiempo").value,
        priority: document.getElementById("tarea-prioridad").value,
        difficulty: document.getElementById("tarea-dificultad").value,
        materials: document.getElementById("tarea-materiales").value,
        notes: document.getElementById("tarea-notas").value,
        needsHelp: document.getElementById("tarea-ayuda").checked
      };
      if(t){ TaskService.actualizar(t.id, campos); ToastManager.mostrar("Tarea actualizada.","exito"); }
      else { const nueva = TaskService.crear(perfil.id, campos); ToastManager.mostrar("Tarea creada.","exito"); }
      ModalManager.cerrar();
      UI.renderVista(Router.rutaActual());
    });
    modal.querySelectorAll("[data-eliminar-tarea]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        ModalManager.confirmar({
          titulo:"Eliminar tarea",
          mensaje:"¿Quieres eliminar esta tarea? Esta acción no se puede deshacer.",
          claseConfirmar:"btn-peligro",
          textoConfirmar:"Eliminar",
          alConfirmar: ()=>{ TaskService.eliminar(t.id); ModalManager.cerrar(); UI.renderVista(Router.rutaActual()); ToastManager.mostrar("Tarea eliminada.","info"); }
        });
      });
    });
  }

  function abrirDetalle(tareaId){
    const t = TaskService.obtener(tareaId);
    if(!t) return;
    const modal = ModalManager.abrir({
      titulo: t.title,
      html: `<div class="encabezado-modal"><h2>${SanitizationService.escapeHtml(t.title)}</h2><button class="btn btn-icono btn-fantasma" data-cerrar-modal aria-label="Cerrar">${ICONS.close}</button></div>
      ${t.description?`<p class="texto-secundario">${SanitizationService.escapeHtml(t.description)}</p>`:''}
      <div class="grupo-opciones mt-8">
        ${["pendiente","en-progreso","necesito-ayuda","terminada","reprogramada"].map(s=>`<button type="button" class="opcion-pastilla" data-cambiar-estado-tarea="${s}" aria-pressed="${t.status===s}">${etiquetaEstadoTarea(s)}</button>`).join("")}
      </div>
      <div class="separador"></div>
      <h3>Dividir esta tarea en pasos</h3>
      <div class="grupo-opciones mt-8">
        <button type="button" class="btn btn-chico btn-fantasma" data-plantilla-pasos="exposicion">Exposición</button>
        <button type="button" class="btn btn-chico btn-fantasma" data-plantilla-pasos="proyecto">Proyecto</button>
        <button type="button" class="btn btn-chico btn-fantasma" data-plantilla-pasos="examen">Examen</button>
        <button type="button" class="btn btn-chico btn-fantasma" data-plantilla-pasos="lectura">Lectura</button>
        <button type="button" class="btn btn-chico btn-fantasma" data-plantilla-pasos="general">General</button>
      </div>
      <div class="lista-elementos mt-8" data-lista-pasos>${renderPasos(t)}</div>
      <form data-form-nuevo-paso class="flex gap-8 mt-8">
        <input type="text" maxlength="120" placeholder="Añadir un paso nuevo" aria-label="Nuevo paso" style="flex:1;border:2px solid var(--borde);border-radius:10px;padding:10px;background:var(--bg-elevada);color:var(--texto-principal);">
        <button type="submit" class="btn btn-primario btn-icono" aria-label="Añadir paso">${ICONS.plus}</button>
      </form>
      <div class="pie-modal"><button class="btn btn-fantasma" data-editar-tarea="${t.id}" data-cerrar-modal>Editar datos</button><button class="btn btn-primario" data-cerrar-modal>Cerrar</button></div>`
    });
    function refrescarPasos(){
      const t2 = TaskService.obtener(tareaId);
      modal.querySelector("[data-lista-pasos]").innerHTML = renderPasos(t2);
    }
    modal.addEventListener("click",(e)=>{
      const btnEstado = e.target.closest("[data-cambiar-estado-tarea]");
      if(btnEstado){ TaskService.cambiarEstado(tareaId, btnEstado.getAttribute("data-cambiar-estado-tarea")); ModalManager.cerrar(); UI.renderVista(Router.rutaActual()); return; }
      const btnPlantilla = e.target.closest("[data-plantilla-pasos]");
      if(btnPlantilla){ TaskService.aplicarPlantilla(tareaId, btnPlantilla.getAttribute("data-plantilla-pasos")); refrescarPasos(); return; }
      const chk = e.target.closest("[data-alternar-paso]");
      if(chk){ TaskService.alternarPaso(tareaId, chk.getAttribute("data-alternar-paso")); refrescarPasos(); UI.renderVista(Router.rutaActual()); return; }
      const del = e.target.closest("[data-eliminar-paso]");
      if(del){ TaskService.eliminarPaso(tareaId, del.getAttribute("data-eliminar-paso")); refrescarPasos(); return; }
      const editar = e.target.closest("[data-editar-tarea]");
      if(editar){ setTimeout(()=>abrirFormulario(tareaId),0); }
    });
    modal.querySelector("[data-form-nuevo-paso]").addEventListener("submit",(e)=>{
      e.preventDefault();
      const input = e.target.querySelector("input");
      if(input.value.trim()){ TaskService.agregarPaso(tareaId, input.value); input.value=""; refrescarPasos(); }
    });
  }

  function renderPasos(t){
    if(!t.steps.length) return `<p class="texto-secundario">Aún no divides esta tarea en pasos.</p>`;
    return t.steps.map(s=>`<div class="fila-elemento ${s.done?'terminada':''}">
      <input type="checkbox" ${s.done?'checked':''} data-alternar-paso="${s.id}" aria-label="Paso: ${SanitizationService.escapeHtml(s.text)}" style="width:22px;height:22px;">
      <span class="contenido-fila titulo-fila">${SanitizationService.escapeHtml(s.text)}</span>
      <button class="btn btn-icono btn-fantasma btn-chico" data-eliminar-paso="${s.id}" aria-label="Eliminar paso">${ICONS.close}</button>
    </div>`).join("");
  }

  function etiquetaEstadoTarea(s){
    return { pendiente:"Pendiente", "en-progreso":"En progreso", "necesito-ayuda":"Necesito ayuda", terminada:"Terminada", reprogramada:"Reprogramada" }[s] || s;
  }

  function establecerFiltros(cambios){
    if(cambios.estado!==undefined) filtroEstado = cambios.estado;
    if(cambios.materia!==undefined) filtroMateria = cambios.materia;
    UI.renderVista("tareas");
  }

  return { render, tareasDeHoy, abrirFormulario, abrirDetalle, etiquetaEstadoTarea, establecerFiltros };
})();
Views.tareas = TareasView.render;

Acciones["data-accion-nueva-tarea"] = function(){ TareasView.abrirFormulario(null); };

/* ===================== HabitosView (#/habitos) ===================== */
const HabitosView = (function(){
  function habitosDeHoy(profileId){
    const diaSemana = new Date().getDay();
    return HabitService.listar(profileId).filter(h=> !h.activeDays.length || h.activeDays.includes(diaSemana));
  }
  function estaHechoHoy(habitId){
    return HabitService.estaMarcado(habitId, Utils.todayISO());
  }

  function render(){
    const perfil = ProfileService.activo();
    if(!perfil) return `<div class="estado-vacio tarjeta"><p>Crea un perfil primero.</p></div>`;
    const habitos = HabitService.listar(perfil.id);
    const hoy = Utils.todayISO();
    const inicioSemana = Utils.startOfWeek(hoy, Store.obtener().appSettings.weekStartsMonday);

    return `<div class="vista">
      <div class="vista-titulo">
        <div><h2>${icono("check")} Hábitos</h2><p class="subtitulo-vista">Hoy tienes una nueva oportunidad para cada hábito.</p></div>
        <button class="btn btn-primario" data-accion-nuevo-habito>${icono("plus")} Nuevo hábito</button>
      </div>
      ${habitos.length ? `<div class="flex flex-col gap-12">${habitos.map(h=>tarjetaHabito(h, inicioSemana)).join("")}</div>`
        : `<div class="tarjeta estado-vacio">${icono("check")}<p>Aún no tienes hábitos. Elige uno para empezar hoy.</p><button class="btn btn-primario" data-accion-nuevo-habito>Crear hábito</button></div>`}
    </div>`;
  }

  function tarjetaHabito(h, inicioSemana){
    const hoy = Utils.todayISO();
    const hecho = estaHechoHoy(h.id);
    const pct = HabitService.porcentajeCumplimiento(h.id, inicioSemana, Utils.addDays(inicioSemana,6));
    const diasEtiquetas = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
    const semanaDias = Array.from({length:7}).map((_,i)=>Utils.addDays(inicioSemana,i));
    return `<div class="tarjeta">
      <div class="flex" style="justify-content:space-between;align-items:flex-start;">
        <div class="flex gap-8" style="align-items:center;">
          <span class="franja-color" style="background:${h.color};width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;">${icono(h.icon)}</span>
          <div><strong>${SanitizationService.escapeHtml(h.name)}</strong><br><span class="texto-secundario" style="font-size:0.8rem;">${pct}% esta semana</span></div>
        </div>
        <span class="acciones-fila">
          <button class="btn btn-icono btn-fantasma btn-chico" data-editar-habito="${h.id}" aria-label="Editar">${ICONS.edit}</button>
          <button class="btn btn-icono btn-fantasma btn-chico" data-archivar-habito="${h.id}" aria-label="Archivar">${ICONS.trash}</button>
        </span>
      </div>
      <div class="mt-16" style="overflow-x:auto;">
        <div class="flex gap-8" style="justify-content:space-between;min-width:340px;">
          ${semanaDias.map((d,i)=>`<span class="centrado" style="flex:1;"><div style="font-size:0.68rem;color:var(--texto-secundario);">${diasEtiquetas[i]}</div><button class="btn btn-icono btn-chico ${HabitService.estaMarcado(h.id,d)?'btn-exito':'btn-fantasma'}" ${d>hoy?'disabled':''} data-marcar-dia-habito="${h.id}|${d}" aria-label="Marcar ${d}">${HabitService.estaMarcado(h.id,d)?ICONS.check:''}</button></span>`).join("")}
        </div>
      </div>
      <button class="btn btn-bloque mt-16 ${hecho?'btn-exito':'btn-primario'}" data-alternar-habito-hoy="${h.id}">${hecho?icono("check")+' Hecho hoy':'Marcar como realizado hoy'}</button>
    </div>`;
  }

  function abrirFormulario(habitoId){
    const perfil = ProfileService.activo();
    const h = habitoId ? HabitService.obtener(habitoId) : null;
    const iconosDisponibles = ["backpack","book","droplet","broom","tooth","activity","bed","hands","star"];
    const modal = ModalManager.abrir({
      titulo: h?"Editar hábito":"Nuevo hábito",
      html:`<div class="encabezado-modal"><h2>${h?"Editar hábito":"Nuevo hábito"}</h2><button class="btn btn-icono btn-fantasma" data-cerrar-modal aria-label="Cerrar">${ICONS.close}</button></div>
      <form data-form-habito>
        <div class="campo"><label for="habito-nombre">Nombre</label><input id="habito-nombre" type="text" maxlength="40" value="${h?SanitizationService.escapeHtml(h.name):''}" data-autofoco></div>
        <div class="campo"><label>Icono</label><div class="grupo-opciones" data-selector-icono>${iconosDisponibles.map(i=>`<button type="button" class="btn btn-icono ${((h&&h.icon)||'star')===i?'btn-primario':'btn-fantasma'}" data-icono-opcion="${i}" aria-label="${i}">${icono(i)}</button>`).join("")}</div></div>
        <div class="campo"><label>Días activos</label><div class="grupo-opciones">${DEFAULTS.diasSemana.map(d=>`<button type="button" class="opcion-pastilla" data-dia-habito="${d.v}" aria-pressed="${h?h.activeDays.includes(d.v):true}">${d.l}</button>`).join("")}</div></div>
        <div class="fila-campos">
          <div class="campo"><label for="habito-hora">Hora (opcional)</label><input id="habito-hora" type="time" value="${h?h.time:''}"></div>
          <div class="campo"><label for="habito-estrellas">Estrellas al cumplirlo</label><input id="habito-estrellas" type="number" min="1" max="10" value="${h?h.stars:1}"></div>
        </div>
        <div class="pie-modal">
          ${h?`<button type="button" class="btn btn-peligro" data-archivar-habito-form="${h.id}">Archivar</button>`:''}
          <button type="button" class="btn btn-fantasma" data-cerrar-modal>Cancelar</button>
          <button type="submit" class="btn btn-primario">Guardar</button>
        </div>
      </form>`
    });
    let iconoElegido = (h && h.icon) || "star";
    let diasElegidos = h ? h.activeDays.slice() : [0,1,2,3,4,5,6];
    modal.querySelectorAll("[data-icono-opcion]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        iconoElegido = btn.getAttribute("data-icono-opcion");
        modal.querySelectorAll("[data-icono-opcion]").forEach(b=>b.classList.toggle("btn-primario", b===btn));
        modal.querySelectorAll("[data-icono-opcion]").forEach(b=>b.classList.toggle("btn-fantasma", b!==btn));
      });
    });
    modal.querySelectorAll("[data-dia-habito]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const v = parseInt(btn.getAttribute("data-dia-habito"),10);
        const idx = diasElegidos.indexOf(v);
        if(idx>=0) diasElegidos.splice(idx,1); else diasElegidos.push(v);
        btn.setAttribute("aria-pressed", diasElegidos.includes(v));
      });
    });
    modal.querySelector("[data-form-habito]").addEventListener("submit",(e)=>{
      e.preventDefault();
      const nombre = document.getElementById("habito-nombre").value;
      if(!ValidationService.required(nombre,"").ok){ ToastManager.mostrar("Escribe un nombre para el hábito.","error"); return; }
      const campos = { name:nombre, icon:iconoElegido, color: perfil.color, activeDays:diasElegidos,
        time: document.getElementById("habito-hora").value, stars: document.getElementById("habito-estrellas").value };
      if(h) HabitService.actualizar(h.id, campos); else HabitService.crear(perfil.id, campos);
      ModalManager.cerrar();
      UI.renderVista("habitos");
      ToastManager.mostrar(h?"Hábito actualizado.":"Hábito creado.","exito");
    });
    modal.querySelectorAll("[data-archivar-habito-form]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        HabitService.archivar(h.id);
        ModalManager.cerrar();
        UI.renderVista("habitos");
      });
    });
  }

  return { render, habitosDeHoy, estaHechoHoy, abrirFormulario };
})();
Views.habitos = HabitosView.render;

Acciones["data-accion-nuevo-habito"] = function(){ HabitosView.abrirFormulario(null); };

    ModalManager.confirmar({

      alConfirmar: ()=>{ HabitService.desmarcar(id, fecha); UI.renderVista("habitos"); }
    });
  } else {
    HabitService.marcar(id, fecha);
    UI.renderVista("habitos");
  }
};

/* ===================== EstudioView (#/estudio) — sesiones y temporizador ===================== */
const EstudioView = (function(){
  let temporizador = { sesionId:null, corriendo:false, inicioMs:0, acumuladoSeg:0, intervalo:null };

  function render(){
    const perfil = ProfileService.activo();
    if(!perfil) return `<div class="estado-vacio tarjeta"><p>Crea un perfil primero.</p></div>`;
    const sesiones = StudyService.listar(perfil.id);
    const activa = sesiones.find(s=>s.status==="en-progreso" || s.status==="planeada" || s.status==="pausada");

    return `<div class="vista">
      <div class="vista-titulo">
        <div><h2>${icono("clock")} Sesiones de estudio</h2><p class="subtitulo-vista">Estudia en bloques cortos y celebra tu esfuerzo.</p></div>
        <button class="btn btn-primario" data-accion-nueva-sesion>${icono("plus")} Nueva sesión</button>
      </div>
      ${activa ? panelSesion(activa) : ""}
      <div class="tarjeta">
        <h3>Historial</h3>
        ${sesiones.filter(s=>s.status==='terminada'||s.status==='cancelada').length ?
          `<div class="lista-elementos mt-8">${sesiones.filter(s=>s.status==='terminada'||s.status==='cancelada').slice(0,10).map(filaHistorial).join("")}</div>`
          : `<p class="texto-secundario mt-8">Aún no terminas ninguna sesión de estudio.</p>`}
      </div>
    </div>`;
  }

  function filaHistorial(s){
    const min = Math.round((s.actualSeconds||0)/60);
    return `<div class="fila-elemento">
      <span class="contenido-fila"><span class="titulo-fila">${SanitizationService.escapeHtml(s.topic||"Sesión de estudio")}</span>
      <span class="meta-fila">${min} min reales · planeados ${s.plannedMinutes} min · <span class="etiqueta-chip">${s.status==='terminada'?'Terminada':'Cancelada'}</span></span></span>
    </div>`;
  }

  function panelSesion(s){
    const segundosPlan = s.plannedMinutes*60;
    const transcurridos = segundosTranscurridos(s);
    const progreso = Utils.clamp(Math.round((transcurridos/segundosPlan)*100),0,100);
    return `<div class="tarjeta centrado">
      <h3>${SanitizationService.escapeHtml(s.topic||"Tu sesión de estudio")}</h3>
      <p class="texto-secundario">${SanitizationService.escapeHtml(s.objective||"")}</p>
      <div class="esfera-temporizador mt-16" style="--progreso:${progreso}">
        <span class="texto-temporizador" data-texto-temporizador>${formatoMMSS(segundosPlan-transcurridos)}</span>
      </div>
      <p class="texto-secundario mt-8">Sesión ${((s.completedSessions||0)+1)} de ${s.totalSessions}</p>
      <div class="flex gap-8 mt-16" style="justify-content:center;flex-wrap:wrap;">
        ${s.status==="planeada" ? `<button class="btn btn-primario" data-accion-temporizador="iniciar">${icono("play")} Iniciar</button>` : ""}
        ${s.status==="en-progreso" ? `
          <button class="btn btn-amarillo" data-accion-temporizador="pausar">${icono("pause")} Pausar</button>
          <button class="btn btn-exito" data-accion-temporizador="terminar">${icono("check")} Terminar</button>` : ""}
        ${s.status==="pausada" ? `<button class="btn btn-primario" data-accion-temporizador="continuar">${icono("play")} Continuar</button>` : ""}
        <button class="btn btn-peligro" data-accion-temporizador="cancelar">Cancelar</button>
      </div>
    </div>`;
  }

  function segundosTranscurridos(s){
    let base = s.actualSeconds || 0;
    if(temporizador.corriendo && temporizador.sesionId===s.id){
      base += Math.floor((Date.now()-temporizador.inicioMs)/1000);
    }
    return base;
  }
  function formatoMMSS(seg){
    seg = Math.max(0,seg);
    const m = Math.floor(seg/60), s = seg%60;
    return Utils.pad2(m)+":"+Utils.pad2(s);
  }

  function actualizarPantalla(){
    const s = obtenerSesionActivaActual();
    if(!s) { detenerIntervalo(); return; }
    const el = document.querySelector("[data-texto-temporizador]");
    if(!el){ return; }
    const restante = s.plannedMinutes*60 - segundosTranscurridos(s);
    el.textContent = formatoMMSS(restante);
    const esfera = document.querySelector(".esfera-temporizador");
    if(esfera){
      const progreso = Utils.clamp(Math.round((segundosTranscurridos(s)/(s.plannedMinutes*60))*100),0,100);
      esfera.style.setProperty("--progreso", progreso);
    }
    if(restante<=0 && temporizador.corriendo){
      pausarInterno(s.id);
      ToastManager.mostrar("¡Tiempo cumplido! Puedes terminar tu sesión.", "info");
      UI.renderVista("estudio");
    }
  }
  function obtenerSesionActivaActual(){
    const perfil = ProfileService.activo();
    if(!perfil) return null;
    return StudyService.listar(perfil.id).find(s=>s.status==="en-progreso"||s.status==="pausada"||s.status==="planeada") || null;
  }
  function iniciarIntervalo(){
    detenerIntervalo();
    temporizador.intervalo = setInterval(actualizarPantalla, 1000);
  }
  function detenerIntervalo(){
    if(temporizador.intervalo){ clearInterval(temporizador.intervalo); temporizador.intervalo = null; }
  }
  function pausarInterno(sesionId){
    const s = StudyService.obtener(sesionId);
    if(!s) return;
    s.actualSeconds = segundosTranscurridos(s);
    s.status = "pausada";
    Store.guardar(true);
    temporizador.corriendo = false;
    detenerIntervalo();
  }

  function abrirFormulario(){
    const perfil = ProfileService.activo();
    const materias = SubjectService.listar(perfil.id, true);
    const duraciones = Store.obtener().appSettings.studyDurations || [10,15,20,25];
    const modal = ModalManager.abrir({
      titulo:"Nueva sesión de estudio",
      html:`<div class="encabezado-modal"><h2>${icono("clock")} Nueva sesión de estudio</h2><button class="btn btn-icono btn-fantasma" data-cerrar-modal aria-label="Cerrar">${ICONS.close}</button></div>
      <form data-form-sesion>
        <div class="campo"><label for="sesion-materia">Materia</label>
          <select id="sesion-materia"><option value="">Sin materia</option>${materias.map(m=>`<option value="${m.id}">${SanitizationService.escapeHtml(m.name)}</option>`).join("")}</select>
        </div>
        <div class="campo"><label for="sesion-tema">Tema</label><input id="sesion-tema" type="text" maxlength="80" data-autofoco></div>
        <div class="campo"><label for="sesion-objetivo">Objetivo</label><input id="sesion-objetivo" type="text" maxlength="200"></div>
        <div class="campo"><label>Duración</label>
          <div class="grupo-opciones" data-selector-duracion>
            ${duraciones.map(d=>`<button type="button" class="opcion-pastilla" data-duracion="${d}" aria-pressed="${d===duraciones[0]}">${d} min</button>`).join("")}
            <button type="button" class="opcion-pastilla" data-duracion="personalizado">Personalizado</button>
          </div>
          <input type="number" min="1" max="240" id="sesion-duracion-custom" placeholder="Minutos personalizados" class="oculto mt-8">
        </div>
        <div class="fila-campos">
          <div class="campo"><label for="sesion-descanso">Descanso (min)</label><input id="sesion-descanso" type="number" min="0" max="60" value="5"></div>
          <div class="campo"><label for="sesion-numero">Número de sesiones</label><input id="sesion-numero" type="number" min="1" max="10" value="1"></div>
        </div>
        <div class="pie-modal"><button type="button" class="btn btn-fantasma" data-cerrar-modal>Cancelar</button><button type="submit" class="btn btn-primario">Crear y empezar</button></div>
      </form>`
    });
    let duracionElegida = duraciones[0];
    modal.querySelectorAll("[data-duracion]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        modal.querySelectorAll("[data-duracion]").forEach(b=>b.setAttribute("aria-pressed","false"));
        btn.setAttribute("aria-pressed","true");
        const custom = document.getElementById("sesion-duracion-custom");
        if(btn.getAttribute("data-duracion")==="personalizado"){ custom.classList.remove("oculto"); duracionElegida = null; custom.focus(); }
        else { custom.classList.add("oculto"); duracionElegida = parseInt(btn.getAttribute("data-duracion"),10); }
      });
    });
    modal.querySelector("[data-form-sesion]").addEventListener("submit",(e)=>{
      e.preventDefault();
      const tema = document.getElementById("sesion-tema").value;
      if(!ValidationService.required(tema,"").ok){ ToastManager.mostrar("Escribe el tema que vas a estudiar.","error"); return; }
      let minutos = duracionElegida;
      if(!minutos){ minutos = parseInt(document.getElementById("sesion-duracion-custom").value,10) || 20; }
      const s = StudyService.crear(perfil.id, {
        subjectId: document.getElementById("sesion-materia").value,
        topic: tema, objective: document.getElementById("sesion-objetivo").value,
        plannedMinutes: minutos, breakMinutes: document.getElementById("sesion-descanso").value,
        totalSessions: document.getElementById("sesion-numero").value
      });
      ModalManager.cerrar();
      UI.renderVista("estudio");
    });
  }

  function iniciarSesion(){
    const s = obtenerSesionActivaActual();
    if(!s) return;
    StudyService.iniciar(s.id);
    temporizador = { sesionId:s.id, corriendo:true, inicioMs:Date.now(), acumuladoSeg:0 };
    iniciarIntervalo();
    UI.renderVista("estudio");
  }
  function pausarSesion(){
    const s = obtenerSesionActivaActual();
    if(!s) return;
    pausarInterno(s.id);
    UI.renderVista("estudio");
  }
  function continuarSesion(){
    const s = obtenerSesionActivaActual();
    if(!s) return;
    s.status = "en-progreso";
    Store.guardar(true);
    temporizador = { sesionId:s.id, corriendo:true, inicioMs:Date.now(), acumuladoSeg:0 };
    iniciarIntervalo();
    UI.renderVista("estudio");
  }
  function cancelarSesion(){
    const s = obtenerSesionActivaActual();
    if(!s) return;
    ModalManager.confirmar({
      titulo:"Cancelar sesión",
      mensaje:"¿Quieres cancelar esta sesión de estudio?",
      textoConfirmar:"Sí, cancelar",
      claseConfirmar:"btn-peligro",
      alConfirmar: ()=>{ detenerIntervalo(); StudyService.cancelar(s.id); UI.renderVista("estudio"); }
    });
  }
  function terminarSesion(){
    const s = obtenerSesionActivaActual();
    if(!s) return;
    const segundos = segundosTranscurridos(s);
    detenerIntervalo();
    const modal = ModalManager.abrir({
      titulo:"¿Cómo estuvo tu sesión?",
      html:`<div class="encabezado-modal"><h2>¿Cómo estuvo tu sesión?</h2><button class="btn btn-icono btn-fantasma" data-cerrar-modal aria-label="Cerrar">${ICONS.close}</button></div>
      <form data-form-fin-sesion>
        <div class="campo"><label for="fin-aprendiste">¿Qué aprendiste?</label><textarea id="fin-aprendiste" maxlength="300" data-autofoco></textarea></div>
        <div class="campo"><label>¿Terminaste tu objetivo?</label>
          <div class="grupo-opciones"><button type="button" class="opcion-pastilla" data-resultado="si">Sí</button><button type="button" class="opcion-pastilla" data-resultado="parcial">En parte</button><button type="button" class="opcion-pastilla" data-resultado="no">No</button></div>
        </div>
        <div class="campo"><label>¿Qué tan difícil fue?</label>
          <div class="grupo-opciones"><button type="button" class="opcion-pastilla" data-dificultad-sesion="facil">Fácil</button><button type="button" class="opcion-pastilla" data-dificultad-sesion="normal">Normal</button><button type="button" class="opcion-pastilla" data-dificultad-sesion="dificil">Difícil</button></div>
        </div>
        <div class="campo"><label><input type="checkbox" id="fin-otra-sesion" style="width:auto;"> Quiero otra sesión</label></div>
        <div class="campo"><label><input type="checkbox" id="fin-pedir-ayuda" style="width:auto;"> Quiero pedir ayuda</label></div>
        <div class="pie-modal"><button type="submit" class="btn btn-primario">Guardar</button></div>
      </form>`
    });
    let resultado = "si", dificultad = "normal";
    modal.querySelectorAll("[data-resultado]").forEach(b=>b.addEventListener("click",()=>{ resultado=b.getAttribute("data-resultado"); modal.querySelectorAll("[data-resultado]").forEach(x=>x.setAttribute("aria-pressed", x===b)); }));
    modal.querySelectorAll("[data-dificultad-sesion]").forEach(b=>b.addEventListener("click",()=>{ dificultad=b.getAttribute("data-dificultad-sesion"); modal.querySelectorAll("[data-dificultad-sesion]").forEach(x=>x.setAttribute("aria-pressed", x===b)); }));
    modal.querySelector("[data-form-fin-sesion]").addEventListener("submit",(e)=>{
      e.preventDefault();
      StudyService.terminar(s.id, {
        actualSeconds: segundos,
        completedSessions: (s.completedSessions||0)+1,
        result: resultado+"|"+dificultad+(document.getElementById("fin-otra-sesion").checked?"|otra":"")+(document.getElementById("fin-pedir-ayuda").checked?"|ayuda":""),
        reflection: document.getElementById("fin-aprendiste").value
      });
      ModalManager.cerrar();
      ToastManager.mostrar("¡Sesión de estudio terminada!","exito");
      UI.renderVista("estudio");
    });
  }

  return { render, abrirFormulario, iniciarSesion, pausarSesion, continuarSesion, cancelarSesion, terminarSesion };
})();
Views.estudio = EstudioView.render;

Acciones["data-accion-nueva-sesion"] = function(){ EstudioView.abrirFormulario(); };
Acciones["data-accion-temporizador"] = function(el){
  const accion = el.getAttribute("data-accion-temporizador");
  if(accion==="iniciar") EstudioView.iniciarSesion();
  else if(accion==="pausar") EstudioView.pausarSesion();
  else if(accion==="continuar") EstudioView.continuarSesion();
  else if(accion==="terminar") EstudioView.terminarSesion();
  else if(accion==="cancelar") EstudioView.cancelarSesion();
};

const MetasView = (function(){

        <button class="btn btn-primario" data-accion-nueva-meta>${icono("plus")} Nueva meta</button>
      </div>
      <div class="tarjeta" style="background:var(--bg-sutil);box-shadow:none;">
        <h3>¿Qué es una meta CLARA?</h3>
        <p class="texto-secundario mt-8">C - Clara: se entiende bien qué quieres lograr. L - se puede Lograr con esfuerzo. A - es posible con tu edad. R - es importante para ti. A - tiene una fecha para revisarla.</p>
      </div>
      ${metas.length ? `<div class="rejilla rejilla-2">${metas.map(tarjetaMeta).join("")}</div>`

    </div>`;
  }

  function tarjetaMeta(g){
    return `<div class="tarjeta">
      <div class="flex" style="justify-content:space-between;">
        <span class="etiqueta-chip">${SanitizationService.escapeHtml(g.category)}</span>
        <span class="etiqueta-chip ${g.status==='cumplida'?'chip-baja':''}">${g.status==='cumplida'?'Cumplida':g.status==='activa'?'Activa':'Pausada'}</span>
      </div>
      <h3 class="mt-8">${SanitizationService.escapeHtml(g.name)}</h3>
      ${g.reason?`<p class="texto-secundario">${SanitizationService.escapeHtml(g.reason)}</p>`:''}

      <p class="texto-secundario mt-8" style="font-size:0.82rem;">${g.progress}% completado ${g.targetDate?' · meta: '+Utils.formatFechaCorta(g.targetDate):''}</p>

  function abrirFormulario(){
    const perfil = ProfileService.activo();
    const modal = ModalManager.abrir({
      titulo:"Nueva meta",
      html:`<div class="encabezado-modal"><h2>${icono("target")} Nueva meta</h2><button class="btn btn-icono btn-fantasma" data-cerrar-modal aria-label="Cerrar">${ICONS.close}</button></div>
      <form data-form-meta>
        <div class="campo"><label for="meta-nombre">Nombre de la meta</label><input id="meta-nombre" type="text" maxlength="80" data-autofoco></div>
        <div class="campo"><label for="meta-categoria">Categoría</label><select id="meta-categoria">${GoalService.CATEGORIAS.map(c=>`<option value="${c}">${c}</option>`).join("")}</select></div>

          <input type="text" maxlength="120" placeholder="Paso 3" id="meta-paso-3" class="mt-8">

    });
    modal.querySelector("[data-form-meta]").addEventListener("submit",(e)=>{
      e.preventDefault();
      const nombre = document.getElementById("meta-nombre").value;

      GoalService.crear(perfil.id, {
        name: nombre, category: document.getElementById("meta-categoria").value,
        reason: document.getElementById("meta-motivo").value,
        startDate: document.getElementById("meta-inicio").value,
        targetDate: document.getElementById("meta-fecha").value,

      ModalManager.cerrar();
      ToastManager.mostrar("¡Meta creada!","exito");

  function abrirDetalle(goalId){
    const g = GoalService.obtener(goalId);
    if(!g) return;
    function contenido(){
      const g2 = GoalService.obtener(goalId);
      const pasos = GoalService.pasosDe(goalId);
      return `<div class="encabezado-modal"><h2>${SanitizationService.escapeHtml(g2.name)}</h2><button class="btn btn-icono btn-fantasma" data-cerrar-modal aria-label="Cerrar">${ICONS.close}</button></div>
        <div class="barra-progreso"><div style="width:${g2.progress}%"></div></div>
        <p class="texto-secundario mt-8">${g2.progress}% completado</p>
        <div class="lista-elementos mt-8" data-lista-pasos-meta>
          ${pasos.length ? pasos.map(p=>`<div class="fila-elemento ${p.done?'terminada':''}">
            <input type="checkbox" ${p.done?'checked':''} data-alternar-paso-meta="${p.id}" style="width:22px;height:22px;" aria-label="Paso: ${SanitizationService.escapeHtml(p.text)}">
            <span class="contenido-fila titulo-fila">${SanitizationService.escapeHtml(p.text)}</span>
          </div>`).join("") : `<p class="texto-secundario">Aún no tienes pasos. Añade el primero.</p>`}
        </div>
        <form data-form-paso-meta class="flex gap-8 mt-8">
          <input type="text" maxlength="120" placeholder="Nuevo paso" aria-label="Nuevo paso" style="flex:1;border:2px solid var(--borde);border-radius:10px;padding:10px;background:var(--bg-elevada);color:var(--texto-principal);">
          <button type="submit" class="btn btn-primario btn-icono" aria-label="Añadir paso">${ICONS.plus}</button>
        </form>
        <div class="separador"></div>
        <button class="btn btn-fantasma btn-bloque" data-registrar-avance-meta="${g2.id}">${icono("star")} Registrar que trabajé en esta meta hoy</button>
        ${g2.status==='cumplida' ? `<div class="campo mt-16"><label for="meta-reflexion">Reflexión final</label><textarea id="meta-reflexion" maxlength="400">${SanitizationService.escapeHtml(g2.reflection||"")}</textarea><button class="btn btn-chico btn-fantasma mt-8" data-guardar-reflexion-meta="${g2.id}">Guardar reflexión</button></div>` : ""}
        <div class="pie-modal"><button class="btn btn-primario" data-cerrar-modal>Cerrar</button></div>`;
    }
    const modal = ModalManager.abrir({ titulo:g.name, html: contenido() });
    function refrescar(){ modal.innerHTML = contenido(); }
    modal.addEventListener("click",(e)=>{
      const chk = e.target.closest("[data-alternar-paso-meta]");
      if(chk){ GoalService.alternarPaso(goalId, chk.getAttribute("data-alternar-paso-meta")); refrescar(); UI.renderVista("metas"); return; }
      const avance = e.target.closest("[data-registrar-avance-meta]");
      if(avance){ GoalService.registrarAvance(goalId); ToastManager.mostrar("¡Sigue así!","exito"); return; }
      const guardarRef = e.target.closest("[data-guardar-reflexion-meta]");
      if(guardarRef){ GoalService.actualizar(goalId, {reflection: modal.querySelector("#meta-reflexion").value}); ToastManager.mostrar("Reflexión guardada.","exito"); }
    });
    modal.addEventListener("submit",(e)=>{
      if(e.target.matches("[data-form-paso-meta]")){
        e.preventDefault();
        const input = e.target.querySelector("input");
        if(input.value.trim()){ GoalService.agregarPaso(goalId, input.value); input.value=""; refrescar(); UI.renderVista("metas"); }
      }
    });
  }

  return { render, abrirFormulario, abrirDetalle };
})();

const RecompensasView = (function(){
  function render(){
    const perfil = ProfileService.activo();
    if(!perfil) return `<div class="estado-vacio tarjeta"><p>Crea un perfil primero.</p></div>`;
    const recompensas = RewardService.listar(perfil.id, true);
    const saldo = StarService.saldo(perfil.id);
    const solicitudes = RewardService.listarSolicitudes(perfil.id);

    return `<div class="vista">
      <div class="vista-titulo">
        <div><h2>${icono("gift")} Estrellas y recompensas</h2><p class="subtitulo-vista">Usa tus estrellas para pedir una recompensa familiar.</p></div>
        <span class="estrellas-contador">${icono("star")} ${saldo} disponibles</span>
      </div>
      ${recompensas.length ? `<div class="rejilla rejilla-3">${recompensas.map(r=>tarjetaRecompensa(r,saldo)).join("")}</div>`
        : `<div class="tarjeta estado-vacio">${icono("gift")}<p>Pide a un adulto que prepare una recompensa para tus estrellas.</p></div>`}
      <div class="tarjeta">
        <h3>Tus solicitudes</h3>
        ${solicitudes.length ? `<div class="lista-elementos mt-8">${solicitudes.slice(0,8).map(filaSolicitud).join("")}</div>` : `<p class="texto-secundario mt-8">Aún no has pedido ninguna recompensa.</p>`}
      </div>
    </div>`;
  }

  function tarjetaRecompensa(r, saldo){
    const alcanza = saldo >= r.cost;
    return `<div class="tarjeta">
      <div class="flex gap-8" style="align-items:center;">${icono(r.icon)}<strong>${SanitizationService.escapeHtml(r.name)}</strong></div>
      ${r.description?`<p class="texto-secundario mt-8">${SanitizationService.escapeHtml(r.description)}</p>`:''}
      <p class="mt-8 etiqueta-chip">${icono("star")} ${r.cost} estrellas</p>
      <button class="btn btn-bloque mt-8 ${alcanza?'btn-primario':'btn-fantasma'}" ${alcanza?'':'disabled'} data-solicitar-canje="${r.id}">${alcanza?'Solicitar canje':'Te faltan estrellas'}</button>
    </div>`;
  }
  function filaSolicitud(s){
    const r = RewardService.obtener(s.rewardId);
    const estadoTxt = { pendiente:"Pendiente de aprobación", aprobado:"Aprobado", rechazado:"No aprobado" }[s.status];
    return `<div class="fila-elemento">
      <span class="contenido-fila"><span class="titulo-fila">${r?SanitizationService.escapeHtml(r.name):"Recompensa"}</span>
      <span class="meta-fila">${new Date(s.requestedAt).toLocaleDateString()} · <span class="etiqueta-chip">${estadoTxt}</span></span></span>
    </div>`;
  }

  return { render };
})();

    const prioridades = tareasDia.filter(t=>t.priority==="alta");
    const totalActividades = tareasDia.length + eventosDia.length;

    return `<div class="vista">

        </div>
      </div>

      <div class="tarjeta">

  function abrirNuevaActividad(){
    const perfil = ProfileService.activo();
    const materias = SubjectService.listar(perfil.id, true);
    const modal = ModalManager.abrir({
      titulo:"Añadir actividad",
      html:`<div class="encabezado-modal"><h2>${icono("plus")} Añadir actividad</h2><button class="btn btn-icono btn-fantasma" data-cerrar-modal aria-label="Cerrar">${ICONS.close}</button></div>
      <form data-form-actividad-dia>
        <div class="campo"><label for="act-titulo">¿Qué vas a hacer?</label><input id="act-titulo" type="text" maxlength="80" data-autofoco></div>
        <div class="campo"><label for="act-materia">Materia (opcional)</label><select id="act-materia"><option value="">Ninguna</option>${materias.map(m=>`<option value="${m.id}">${SanitizationService.escapeHtml(m.name)}</option>`).join("")}</select></div>
        <div class="campo"><label for="act-hora">Horario (opcional)</label><input id="act-hora" type="time"></div>
        <div class="campo"><label for="act-prioridad">Prioridad</label><select id="act-prioridad"><option value="baja">Baja</option><option value="media" selected>Media</option><option value="alta">Alta</option></select></div>
        <div class="pie-modal"><button type="button" class="btn btn-fantasma" data-cerrar-modal>Cancelar</button><button type="submit" class="btn btn-primario">Añadir</button></div>
      </form>`
    });
    modal.querySelector("[data-form-actividad-dia]").addEventListener("submit",(e)=>{
      e.preventDefault();
      const titulo = document.getElementById("act-titulo").value;
      if(!ValidationService.required(titulo,"").ok){ ToastManager.mostrar("Escribe qué vas a hacer.","error"); return; }
      TaskService.crear(perfil.id, {
        title: titulo, subjectId: document.getElementById("act-materia").value,
        dueDate: fechaSeleccionada, priority: document.getElementById("act-prioridad").value,
        estimatedMinutes:20, notes: document.getElementById("act-hora").value ? "Hora: "+document.getElementById("act-hora").value : ""
      });
      ModalManager.cerrar();
      UI.renderVista("dia");
    });
  }

  function abrirCierreDia(fecha){
    const perfil = ProfileService.activo();
    const prefs = prefsPerfil(perfil);
    const previo = prefs.dayClosures[fecha] || {};
    const modal = ModalManager.abrir({
      titulo:"Cerrar mi día",
      html:`<div class="encabezado-modal"><h2>${icono("star")} Cerrar mi día</h2><button class="btn btn-icono btn-fantasma" data-cerrar-modal aria-label="Cerrar">${ICONS.close}</button></div>
      <form data-form-cierre-dia>
        <div class="campo"><label for="cierre-logro">¿Qué lograste hoy?</label><textarea id="cierre-logro" maxlength="300" data-autofoco>${SanitizationService.escapeHtml(previo.achieved||'')}</textarea></div>
        <div class="campo"><label for="cierre-momento">¿Cuál fue tu mejor momento?</label><textarea id="cierre-momento" maxlength="300">${SanitizationService.escapeHtml(previo.bestMoment||'')}</textarea></div>
        <div class="campo"><label for="cierre-pendiente">¿Qué queda para mañana?</label><textarea id="cierre-pendiente" maxlength="300">${SanitizationService.escapeHtml(previo.pending||'')}</textarea></div>
        <div class="campo"><label for="cierre-emocion">¿Cómo te sientes ahora?</label>
          <select id="cierre-emocion">${EmotionService.EMOCIONES.map(e=>`<option value="${e.v}" ${previo.emotion===e.v?'selected':''}>${e.l}</option>`).join("")}</select>
        </div>
        <div class="pie-modal"><button type="submit" class="btn btn-primario">Guardar y celebrar</button></div>
      </form>`
    });
    modal.querySelector("[data-form-cierre-dia]").addEventListener("submit",(e)=>{
      e.preventDefault();
      prefs.dayClosures[fecha] = {
        achieved: document.getElementById("cierre-logro").value,
        bestMoment: document.getElementById("cierre-momento").value,
        pending: document.getElementById("cierre-pendiente").value,
        emotion: document.getElementById("cierre-emocion").value
      };
      EmotionService.registrarEmocion(perfil.id, fecha, prefs.dayClosures[fecha].emotion, "");
      Store.guardar(true);
      ModalManager.cerrar();
      mostrarCelebracion();
      UI.renderVista("dia");
    });
  }

  function mostrarCelebracion(){
    ModalManager.abrir({
      titulo:"¡Día terminado!",
      html:`<div class="centrado">
        <div class="avatar-grande">${icono("star")}</div>
        <h2 class="mt-8">¡Excelente día!</h2>
        <p class="texto-secundario">Gracias por organizarte y cuidar de ti. Nos vemos mañana para seguir avanzando.</p>
        <button class="btn btn-primario mt-16" data-cerrar-modal data-autofoco>Gracias</button>
      </div>`
    });
  }

  function cambiarFecha(delta){ fechaSeleccionada = Utils.addDays(fechaSeleccionada, delta); UI.renderVista("dia"); }
  function establecerFecha(iso){ if(Utils.isValidISODate(iso)){ fechaSeleccionada = iso; UI.renderVista("dia"); } }
  function fechaActual(){ return fechaSeleccionada; }

  return { render, abrirNuevaActividad, abrirCierreDia, cambiarFecha, establecerFecha, fechaActual };
})();

/* ===================== SemanaView (#/semana) — Mi Semana ===================== */
const SemanaView = (function(){
  let inicioSemana = null;
  let filtroTipo = "";
  let diaMovilSeleccionado = Utils.todayISO();

  function inicioActual(){
    if(!inicioSemana) inicioSemana = Utils.startOfWeek(Utils.todayISO(), Store.obtener().appSettings.weekStartsMonday);
    return inicioSemana;
  }

  function progresoSemanaActual(profileId){
    const inicio = Utils.startOfWeek(Utils.todayISO(), Store.obtener().appSettings.weekStartsMonday);
    const fin = Utils.addDays(inicio,6);
    const tareas = TaskService.listar(profileId).filter(t=>t.dueDate>=inicio && t.dueDate<=fin);
    const datos = Store.obtener();
    const habitosActivos = HabitService.listar(profileId);
    let totalHabitoDias = 0, hechoHabitoDias = 0;
    let cursor = inicio;
    while(cursor<=fin){
      habitosActivos.forEach(h=>{
        if(!h.activeDays.length || h.activeDays.includes(Utils.isoToDate(cursor).getDay())){
          totalHabitoDias++;
          if(HabitService.estaMarcado(h.id,cursor)) hechoHabitoDias++;
        }
      });
      cursor = Utils.addDays(cursor,1);
    }
    const totalItems = tareas.length + totalHabitoDias;
    const hechos = tareas.filter(t=>t.status==="terminada").length + hechoHabitoDias;
    return totalItems ? Math.round((hechos/totalItems)*100) : 0;
  }

  function render(){
    const perfil = ProfileService.activo();
    if(!perfil) return `<div class="estado-vacio tarjeta"><p>Crea un perfil primero.</p></div>`;
    const inicio = inicioActual();
    const dias = Array.from({length:7}).map((_,i)=>Utils.addDays(inicio,i));
    const etiquetasDias = dias.map(d=>Utils.isoToDate(d).toLocaleDateString("es-MX",{weekday:"short"}));

    return `<div class="vista">
      <div class="vista-titulo">
        <div><h2>${icono("calendar")} Mi semana</h2><p class="subtitulo-vista">${Utils.formatFechaCorta(inicio)} – ${Utils.formatFechaCorta(Utils.addDays(inicio,6))}</p></div>
        <div class="flex gap-8">
          <button class="btn btn-chico btn-fantasma" data-semana-hoy>Hoy</button>
          <button class="btn btn-icono btn-fantasma no-imprimir" data-semana-mover="-1" aria-label="Semana anterior">${ICONS.chevronLeft}</button>
          <button class="btn btn-icono btn-fantasma no-imprimir" data-semana-mover="1" aria-label="Semana siguiente">${ICONS.chevronRight}</button>
          <button class="btn btn-chico btn-fantasma no-imprimir" data-accion-imprimir="semana">${icono("printer")} Imprimir</button>
        </div>
      </div>
      <div class="tarjeta no-imprimir">
        <label for="filtro-tipo-semana" class="solo-lectura-pantalla">Filtrar por tipo</label>
        <select id="filtro-tipo-semana" data-filtro-tipo-semana>
          <option value="">Todo</option><option value="tarea" ${filtroTipo==='tarea'?'selected':''}>Tareas</option>
          <option value="evento" ${filtroTipo==='evento'?'selected':''}>Eventos</option><option value="habito" ${filtroTipo==='habito'?'selected':''}>Hábitos</option>
        </select>
      </div>
      <div class="tarjeta vista-semana-escritorio" style="display:none;">
        <div class="rejilla-calendario" style="grid-template-columns:repeat(7,1fr);">
          ${dias.map((d,i)=>`<div class="dia-semana-cab">${etiquetasDias[i]}<br>${Utils.isoToDate(d).getDate()}</div>`).join("")}
          ${dias.map(d=>`<div class="celda-calendario ${d===Utils.todayISO()?'hoy':''}" style="min-height:160px;align-items:stretch;">${contenidoDia(perfil.id,d)}</div>`).join("")}
        </div>
      </div>
      <div class="vista-semana-movil">
        <div class="grupo-opciones no-imprimir">${dias.map((d,i)=>`<button type="button" class="opcion-pastilla" data-elegir-dia-movil="${d}" aria-pressed="${d===diaMovilSeleccionado}">${etiquetasDias[i]} ${Utils.isoToDate(d).getDate()}</button>`).join("")}</div>
        <div class="tarjeta mt-8"><h3>${Utils.formatFechaLarga(diaMovilSeleccionado)}</h3><div class="mt-8">${contenidoDia(perfil.id,diaMovilSeleccionado, true)}</div></div>
      </div>
    </div>
    <style>
      @media (min-width:1024px){ .vista-semana-escritorio{display:block !important;} .vista-semana-movil{display:none !important;} }
    </style>`;
  }

  function contenidoDia(profileId, fecha, expandido){
    const tareas = TaskService.listar(profileId,{fecha}).filter(t=>!filtroTipo||filtroTipo==='tarea');
    const eventos = CalendarService.listar(profileId,{desde:fecha,hasta:fecha}).filter(()=>!filtroTipo||filtroTipo==='evento');
    const dow = Utils.isoToDate(fecha).getDay();
    const habitos = filtroTipo && filtroTipo!=='habito' ? [] : HabitService.listar(profileId).filter(h=>!h.activeDays.length||h.activeDays.includes(dow));
    if(!tareas.length && !eventos.length && !habitos.length) return `<p class="texto-secundario" style="font-size:0.78rem;">Sin actividades</p>`;
    return [
      ...tareas.map(t=>`<div><span class="punto-evento" style="background:var(--azul-brillante)"></span>${SanitizationService.escapeHtml(t.title)}</div>`),
      ...eventos.map(e=>`<div><span class="punto-evento" style="background:${e.color}"></span>${SanitizationService.escapeHtml(e.title)}</div>`),
      ...habitos.map(h=>`<div><span class="punto-evento" style="background:${h.color}"></span>${SanitizationService.escapeHtml(h.name)}</div>`)
    ].join("");
  }

  function moverSemana(delta){ inicioSemana = Utils.addDays(inicioActual(), delta*7); UI.renderVista("semana"); }
  function irAHoy(){ inicioSemana = Utils.startOfWeek(Utils.todayISO(), Store.obtener().appSettings.weekStartsMonday); diaMovilSeleccionado = Utils.todayISO(); UI.renderVista("semana"); }
  function elegirDiaMovil(fecha){ diaMovilSeleccionado = fecha; UI.renderVista("semana"); }
  function establecerFiltro(tipo){ filtroTipo = tipo; UI.renderVista("semana"); }

  return { render, progresoSemanaActual, moverSemana, irAHoy, elegirDiaMovil, establecerFiltro };
})();
Views.semana = SemanaView.render;

Acciones["data-semana-mover"] = function(el){ SemanaView.moverSemana(parseInt(el.getAttribute("data-semana-mover"),10)); };
Acciones["data-semana-hoy"] = function(){ SemanaView.irAHoy(); };

VistaHooks.semana = function(){
  const sel = document.getElementById("filtro-tipo-semana");
  if(sel) sel.addEventListener("change", ()=>SemanaView.establecerFiltro(sel.value));
};

/* ===================== CalendarioView (#/calendario) ===================== */
const CalendarioView = (function(){
  let mesActual = null; // {year, month(0-11)}
  let vistaActiva = "mes"; // mes | proximos

  function mesEnCurso(){
    if(!mesActual){ const d = new Date(); mesActual = {year:d.getFullYear(), month:d.getMonth()}; }
    return mesActual;
  }

  function render(){
    const perfil = ProfileService.activo();
    if(!perfil) return `<div class="estado-vacio tarjeta"><p>Crea un perfil primero.</p></div>`;
    const {year, month} = mesEnCurso();
    return `<div class="vista">
      <div class="vista-titulo">
        <div><h2>${icono("calendar")} Calendario</h2><p class="subtitulo-vista">Organiza exámenes, entregas y actividades familiares.</p></div>
        <div class="flex gap-8">
          <button class="btn btn-chico ${vistaActiva==='mes'?'btn-primario':'btn-fantasma'}" data-calendario-vista="mes">Mes</button>
          <button class="btn btn-chico ${vistaActiva==='proximos'?'btn-primario':'btn-fantasma'}" data-calendario-vista="proximos">Próximos</button>
          <button class="btn btn-primario" data-accion-nuevo-evento>${icono("plus")} Nuevo evento</button>
        </div>
      </div>
      ${vistaActiva==='mes' ? renderMes(perfil.id, year, month) : renderProximos(perfil.id)}
    </div>`;
  }

  function renderMes(profileId, year, month){
    const primerDia = new Date(year, month, 1);
    const ultimoDia = new Date(year, month+1, 0);
    const offset = primerDia.getDay();
    const nombreMes = primerDia.toLocaleDateString("es-MX",{month:"long", year:"numeric"});
    const eventos = CalendarService.listar(profileId);
    const hoy = Utils.todayISO();
    const celdas = [];
    for(let i=0;i<offset;i++) celdas.push(null);
    for(let dia=1; dia<=ultimoDia.getDate(); dia++) celdas.push(Utils.dateToISO(new Date(year,month,dia)));
    while(celdas.length % 7 !== 0) celdas.push(null);

    return `<div class="tarjeta">
      <div class="flex" style="justify-content:space-between;align-items:center;">
        <button class="btn btn-icono btn-fantasma" data-mes-mover="-1" aria-label="Mes anterior">${ICONS.chevronLeft}</button>
        <h3 style="text-transform:capitalize;">${nombreMes}</h3>
        <button class="btn btn-icono btn-fantasma" data-mes-mover="1" aria-label="Mes siguiente">${ICONS.chevronRight}</button>
      </div>
      <div class="rejilla-calendario mt-16">
        ${["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"].map(d=>`<div class="dia-semana-cab">${d}</div>`).join("")}
        ${celdas.map(fecha=>{
          if(!fecha) return `<div class="celda-calendario fuera-mes"></div>`;
          const evsDia = eventos.filter(e=>e.date===fecha);
          return `<button type="button" class="celda-calendario ${fecha===hoy?'hoy':''}" data-abrir-dia-calendario="${fecha}" aria-label="${Utils.formatFechaLarga(fecha)}">
            <strong>${Utils.isoToDate(fecha).getDate()}</strong>
            ${evsDia.slice(0,3).map(e=>`<span style="font-size:0.68rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"><span class="punto-evento" style="background:${e.color}"></span>${SanitizationService.escapeHtml(e.title)}</span>`).join("")}
            ${evsDia.length>3?`<span style="font-size:0.68rem;">+${evsDia.length-3} más</span>`:''}
          </button>`;
        }).join("")}
      </div>
    </div>`;
  }

  function renderProximos(profileId){
    const hoy = Utils.todayISO();
    const eventos = CalendarService.listar(profileId,{desde:hoy});
    return `<div class="tarjeta">
      <h3>Próximos eventos</h3>
      ${eventos.length ? `<div class="lista-elementos mt-8">${eventos.map(e=>filaEvento(e)).join("")}</div>` : `<p class="texto-secundario mt-8">No tienes eventos próximos.</p>`}
    </div>`;
  }
  function filaEvento(e){
    const tipo = CalendarService.TIPOS.find(t=>t.v===e.type);
    return `<div class="fila-elemento">
      <span class="franja-color" style="background:${e.color}"></span>
      <span class="contenido-fila"><span class="titulo-fila">${SanitizationService.escapeHtml(e.title)}</span>
      <span class="meta-fila">${Utils.formatFechaCorta(e.date)}${e.time?' · '+Utils.formatHora(e.time,Store.obtener().appSettings.timeFormat24):''} · ${tipo?tipo.l:e.type}</span></span>
      <button class="btn btn-icono btn-fantasma btn-chico" data-editar-evento="${e.id}" aria-label="Editar">${ICONS.edit}</button>
    </div>`;
  }

  function abrirDia(fecha){
    const perfil = ProfileService.activo();
    const eventos = CalendarService.listar(perfil.id,{desde:fecha,hasta:fecha});
    const modal = ModalManager.abrir({
      titulo:Utils.formatFechaLarga(fecha),
      html:`<div class="encabezado-modal"><h2>${Utils.formatFechaLarga(fecha)}</h2><button class="btn btn-icono btn-fantasma" data-cerrar-modal aria-label="Cerrar">${ICONS.close}</button></div>
      <div class="lista-elementos">${eventos.length?eventos.map(filaEvento).join(""):'<p class="texto-secundario">No hay eventos este día.</p>'}</div>
      <div class="pie-modal"><button class="btn btn-primario" data-crear-evento-fecha="${fecha}" data-cerrar-modal>${icono("plus")} Nuevo evento este día</button></div>`
    });
  }

  function abrirFormularioEvento(eventoId, fechaSugerida){
    const perfil = ProfileService.activo();
    const ev = eventoId ? CalendarService.obtener(eventoId) : null;
    const modal = ModalManager.abrir({
      titulo: ev?"Editar evento":"Nuevo evento",
      html:`<div class="encabezado-modal"><h2>${ev?"Editar evento":"Nuevo evento"}</h2><button class="btn btn-icono btn-fantasma" data-cerrar-modal aria-label="Cerrar">${ICONS.close}</button></div>
      <form data-form-evento>
        <div class="campo"><label for="ev-titulo">Título</label><input id="ev-titulo" type="text" maxlength="80" value="${ev?SanitizationService.escapeHtml(ev.title):''}" data-autofoco></div>
        <div class="fila-campos">
          <div class="campo"><label for="ev-fecha">Fecha</label><input id="ev-fecha" type="date" value="${ev?ev.date:(fechaSugerida||Utils.todayISO())}"></div>
          <div class="campo"><label for="ev-hora">Hora (opcional)</label><input id="ev-hora" type="time" value="${ev?ev.time:''}"></div>
        </div>
        <div class="campo"><label for="ev-tipo">Tipo</label><select id="ev-tipo">${CalendarService.TIPOS.map(t=>`<option value="${t.v}" ${ev&&ev.type===t.v?'selected':''}>${t.l}</option>`).join("")}</select></div>
        <div class="campo"><label for="ev-descripcion">Descripción</label><textarea id="ev-descripcion" maxlength="300">${ev?SanitizationService.escapeHtml(ev.description):''}</textarea></div>
        <div class="campo"><label for="ev-repeticion">Repetición</label><select id="ev-repeticion">
          <option value="ninguna" ${(!ev||ev.repeat==='ninguna')?'selected':''}>Ninguna</option>
          <option value="semanal" ${ev&&ev.repeat==='semanal'?'selected':''}>Semanal (8 veces)</option>
          <option value="diaria" ${ev&&ev.repeat==='diaria'?'selected':''}>Diaria (8 veces)</option>
        </select></div>
        <div class="pie-modal">
          ${ev?`<button type="button" class="btn btn-peligro" data-eliminar-evento="${ev.id}">${icono("trash")} Eliminar</button>`:''}
          <button type="button" class="btn btn-fantasma" data-cerrar-modal>Cancelar</button>
          <button type="submit" class="btn btn-primario">Guardar</button>
        </div>
      </form>`
    });
    modal.querySelector("[data-form-evento]").addEventListener("submit",(e)=>{
      e.preventDefault();
      const titulo = document.getElementById("ev-titulo").value;
      if(!ValidationService.required(titulo,"").ok){ ToastManager.mostrar("Escribe el título del evento.","error"); return; }
      const fecha = document.getElementById("ev-fecha").value;
      if(!ValidationService.fechaValida(fecha,"").ok){ ToastManager.mostrar("Elige una fecha válida.","error"); return; }
      const campos = { title:titulo, date:fecha, time:document.getElementById("ev-hora").value, type:document.getElementById("ev-tipo").value,
        description:document.getElementById("ev-descripcion").value, repeat:document.getElementById("ev-repeticion").value };
      if(ev) CalendarService.actualizar(ev.id, campos); else CalendarService.crear(perfil.id, campos);
      ModalManager.cerrar();
      ToastManager.mostrar(ev?"Evento actualizado.":"Evento creado.","exito");
      UI.renderVista("calendario");
    });
    modal.querySelectorAll("[data-eliminar-evento]").forEach(btn=>btn.addEventListener("click",()=>{
      ModalManager.confirmar({ titulo:"Eliminar evento", mensaje:"¿Eliminar este evento?", claseConfirmar:"btn-peligro", textoConfirmar:"Eliminar",
        alConfirmar: ()=>{ CalendarService.eliminar(ev.id); ModalManager.cerrar(); UI.renderVista("calendario"); } });
    }));
  }

  function moverMes(delta){
    const m = mesEnCurso();
    let nuevo = m.month + delta, anio = m.year;
    if(nuevo<0){ nuevo=11; anio--; } if(nuevo>11){ nuevo=0; anio++; }
    mesActual = {year:anio, month:nuevo};
    UI.renderVista("calendario");
  }
  function cambiarVista(v){ vistaActiva = v; UI.renderVista("calendario"); }

  return { render, abrirDia, abrirFormularioEvento, moverMes, cambiarVista };
})();

/* ===================== ParentPanel (#/padres) ===================== */
const ParentPanel = (function(){
  let seccionActiva = "resumen";
  let filtroPerfil = "";
  let filtroSemana = "";

  const SECCIONES = [
    {v:"resumen", l:"Resumen"}, {v:"perfiles", l:"Perfiles"}, {v:"tareas", l:"Tareas"},
    {v:"habitos", l:"Hábitos"}, {v:"recompensas", l:"Recompensas"}, {v:"reportes", l:"Reportes"},
    {v:"configuracion", l:"Configuración"}, {v:"respaldo", l:"Respaldo"}
  ];

  function render(){
    if(!AuthService.esModoAdulto()){
      return `<div class="vista"><div class="tarjeta estado-vacio">${icono("lock")}
        <p>Esta sección está protegida con el PIN familiar.</p>
        <button class="btn btn-primario" data-accion-modo-adulto>Entrar con PIN</button></div></div>`;
    }
    return `<div class="vista">
      <div class="vista-titulo">
        <div><h2>${icono("family")} Panel de padres</h2><p class="subtitulo-vista">Consulta avances y gestiona la aplicación en lenguaje claro y neutral.</p></div>
      </div>
      <div class="tarjeta no-imprimir" style="padding:8px;">
        <div class="grupo-opciones">${SECCIONES.map(s=>`<button type="button" class="opcion-pastilla" data-seccion-padres="${s.v}" aria-pressed="${seccionActiva===s.v}">${s.l}</button>`).join("")}</div>
      </div>
      <div data-contenido-seccion-padres>${renderSeccion()}</div>
    </div>`;
  }

  function renderSeccion(){
    switch(seccionActiva){
      case "resumen": return seccionResumen();
      case "perfiles": return seccionPerfiles();
      case "tareas": return seccionTareas();
      case "habitos": return seccionHabitos();
      case "recompensas": return seccionRecompensas();
      case "reportes": return ReportService.renderSelector();
      case "configuracion": return Views.configuracion();
      case "respaldo": return BackupView.render();
      default: return "";
    }
  }

  function perfilesFiltrados(){
    const perfiles = ProfileService.listar();
    return filtroPerfil ? perfiles.filter(p=>p.id===filtroPerfil) : perfiles;
  }

  function seccionResumen(){
    const perfiles = perfilesFiltrados();
    const hoy = Utils.todayISO();
    const inicioSemana = Utils.startOfWeek(hoy, Store.obtener().appSettings.weekStartsMonday);
    let terminadas=0, pendientes=0, ayuda=0, minEstudio=0, minLectura=0, metas=0, solicitudes=0;
    perfiles.forEach(p=>{
      const tareas = TaskService.listar(p.id);
      terminadas += tareas.filter(t=>t.status==="terminada").length;
      pendientes += tareas.filter(t=>t.status!=="terminada").length;
      ayuda += tareas.filter(t=>t.needsHelp).length;
      minEstudio += Utils.sum(StudyService.listar(p.id).filter(s=>s.status==="terminada"), s=>Math.round((s.actualSeconds||0)/60));
      minLectura += ReadingService.minutosLeidosSemana(p.id, inicioSemana);
      metas += GoalService.listar(p.id,"activa").length;
      solicitudes += RewardService.listarSolicitudes(p.id,"pendiente").length;
    });
    const canjesPendientes = RewardService.listarSolicitudes(null,"pendiente").filter(s=>!filtroPerfil||s.profileId===filtroPerfil);

    return `<div class="rejilla rejilla-4">
        <div class="estadistica"><span class="valor">${terminadas}</span><span class="etiqueta">Actividades terminadas</span></div>
        <div class="estadistica"><span class="valor">${pendientes}</span><span class="etiqueta">Pendientes</span></div>
        <div class="estadistica"><span class="valor">${ayuda}</span><span class="etiqueta">Solicitudes de ayuda</span></div>
        <div class="estadistica"><span class="valor">${minEstudio}</span><span class="etiqueta">Minutos de estudio</span></div>
        <div class="estadistica"><span class="valor">${minLectura}</span><span class="etiqueta">Minutos de lectura (semana)</span></div>
        <div class="estadistica"><span class="valor">${metas}</span><span class="etiqueta">Metas activas</span></div>
        <div class="estadistica"><span class="valor">${solicitudes}</span><span class="etiqueta">Canjes por aprobar</span></div>
      </div>
      <div class="tarjeta mt-16">
        <h3>Canjes pendientes de aprobación</h3>
        ${canjesPendientes.length ? `<div class="lista-elementos mt-8">${canjesPendientes.map(filaCanje).join("")}</div>` : `<p class="texto-secundario mt-8">No hay canjes pendientes.</p>`}
      </div>`;
  }

  function filaCanje(s){
    const perfil = ProfileService.obtener(s.profileId);
    const r = RewardService.obtener(s.rewardId);
    return `<div class="fila-elemento">
      <span class="contenido-fila"><span class="titulo-fila">${perfil?SanitizationService.escapeHtml(perfil.name):"—"}: ${r?SanitizationService.escapeHtml(r.name):"—"}</span>
      <span class="meta-fila">${r?r.cost:0} estrellas · pedido ${new Date(s.requestedAt).toLocaleDateString()}</span></span>
      <span class="acciones-fila">
        <button class="btn btn-chico btn-exito" data-resolver-canje="${s.id}|si">Aprobar</button>
        <button class="btn btn-chico btn-peligro" data-resolver-canje="${s.id}|no">Rechazar</button>
      </span>
    </div>`;
  }

  function seccionPerfiles(){
    const perfiles = ProfileService.listar(true);
    return `<div class="vista-titulo"><h3>Perfiles</h3><button class="btn btn-primario" data-accion-nuevo-perfil>${icono("plus")} Nuevo perfil</button></div>
      <div class="rejilla rejilla-3 mt-8">${perfiles.map(p=>`
        <div class="tarjeta">
          <div class="flex gap-8" style="align-items:center;"><div class="avatar-mini" style="width:44px;height:44px;">${AvatarService.avatarSVG(p.avatar,p.color)}</div>
          <div><strong>${SanitizationService.escapeHtml(p.name)}</strong><br><span class="texto-secundario">${p.age} años ${p.archived?'· archivado':''}</span></div></div>
          <div class="flex gap-8 mt-8" style="flex-wrap:wrap;">
            <button class="btn btn-chico btn-fantasma" data-editar-perfil="${p.id}">Editar</button>
            ${!p.archived?`<button class="btn btn-chico btn-fantasma" data-archivar-perfil="${p.id}">Archivar</button>`:''}
            <button class="btn btn-chico btn-peligro" data-eliminar-perfil="${p.id}">Eliminar</button>
          </div>
        </div>`).join("")}</div>`;
  }

  function seccionTareas(){
    const perfiles = perfilesFiltrados();
    let filas = [];
    perfiles.forEach(p=> TaskService.listar(p.id).forEach(t=>filas.push({t,p})));
    if(filtroSemana){
      const inicio = Utils.startOfWeek(Utils.todayISO(), Store.obtener().appSettings.weekStartsMonday);
      const fin = Utils.addDays(inicio,6);
      filas = filas.filter(f=>f.t.dueDate>=inicio && f.t.dueDate<=fin);
    }
    return `<div class="tarjeta">
      <div class="fila-campos">
        <div class="campo" style="margin-bottom:0;"><label for="pp-filtro-perfil">Perfil</label>${selectorPerfiles("pp-filtro-perfil")}</div>
        <div class="campo" style="margin-bottom:0;"><label for="pp-filtro-semana">Semana</label>
          <select id="pp-filtro-semana" data-filtro-semana-padres><option value="">Todas</option><option value="actual" ${filtroSemana?'selected':''}>Esta semana</option></select>
        </div>
      </div>
    </div>
    <div class="lista-elementos mt-8">${filas.length? filas.map(f=>`
      <div class="fila-elemento ${f.t.status==='terminada'?'terminada':''}">
        <span class="contenido-fila"><span class="titulo-fila">${SanitizationService.escapeHtml(f.p.name)}: ${SanitizationService.escapeHtml(f.t.title)}</span>
        <span class="meta-fila">${f.t.dueDate?Utils.formatFechaCorta(f.t.dueDate):'Sin fecha'} · <span class="etiqueta-chip">${TareasView.etiquetaEstadoTarea(f.t.status)}</span></span></span>
      </div>`).join("") : `<p class="texto-secundario">No hay tareas registradas todavía.</p>`}</div>`;
  }

  function seccionHabitos(){
    const perfiles = perfilesFiltrados();
    let filas = [];
    perfiles.forEach(p=> HabitService.listar(p.id,true).forEach(h=>filas.push({h,p})));
    return `<div class="lista-elementos">${filas.length? filas.map(f=>{
      const inicioSemana = Utils.startOfWeek(Utils.todayISO(), Store.obtener().appSettings.weekStartsMonday);
      const pct = HabitService.porcentajeCumplimiento(f.h.id, inicioSemana, Utils.addDays(inicioSemana,6));
      return `<div class="fila-elemento"><span class="contenido-fila"><span class="titulo-fila">${SanitizationService.escapeHtml(f.p.name)}: ${SanitizationService.escapeHtml(f.h.name)}</span>
      <span class="meta-fila">${pct}% cumplimiento esta semana ${f.h.status==='archivado'?'· archivado':''}</span></span></div>`;
    }).join("") : `<p class="texto-secundario">No hay hábitos registrados todavía.</p>`}</div>`;
  }

  function seccionRecompensas(){
    const perfil = ProfileService.activo();
    const recompensas = perfil ? RewardService.listar(perfil.id, false) : [];
    return `<div class="vista-titulo"><h3>Recompensas de ${perfil?SanitizationService.escapeHtml(perfil.name):''}</h3><button class="btn btn-primario" data-accion-nueva-recompensa>${icono("plus")} Nueva recompensa</button></div>
    <div class="rejilla rejilla-3 mt-8">${recompensas.map(r=>`
      <div class="tarjeta">
        <div class="flex gap-8" style="align-items:center;">${icono(r.icon)}<strong>${SanitizationService.escapeHtml(r.name)}</strong></div>
        <p class="mt-8 etiqueta-chip">${r.cost} estrellas ${r.active?'':'· inactiva'}</p>
        <div class="flex gap-8 mt-8">
          <button class="btn btn-chico btn-fantasma" data-editar-recompensa="${r.id}">Editar</button>
          <button class="btn btn-chico btn-peligro" data-eliminar-recompensa="${r.id}">Eliminar</button>
        </div>
      </div>`).join("")}</div>`;
  }

  function selectorPerfiles(id){
    const perfiles = ProfileService.listar();
    return `<select id="${id}" data-filtro-perfil-padres><option value="">Todos</option>${perfiles.map(p=>`<option value="${p.id}" ${filtroPerfil===p.id?'selected':''}>${SanitizationService.escapeHtml(p.name)}</option>`).join("")}</select>`;
  }

  function cambiarSeccion(s){ seccionActiva = s; UI.renderVista("padres"); }

  function abrirFormularioPerfil(perfilId){
    const p = perfilId ? ProfileService.obtener(perfilId) : null;
    let avatar = p ? p.avatar : AvatarService.avatarAleatorio(DEFAULTS.coloresPerfil[0]);

      titulo: p?"Editar perfil":"Nuevo perfil",
      html:`<div class="encabezado-modal"><h2>${p?"Editar perfil":"Nuevo perfil"}</h2><button class="btn btn-icono btn-fantasma" data-cerrar-modal aria-label="Cerrar">${ICONS.close}</button></div>

        <div class="campo"><label for="pp-nombre">Nombre o apodo</label><input id="pp-nombre" type="text" maxlength="30" value="${p?SanitizationService.escapeHtml(p.name):''}" data-autofoco></div>
        <div class="campo"><label for="pp-edad">Edad</label><select id="pp-edad">${[7,8,9,10,11,12].map(e=>`<option value="${e}" ${p&&p.age===e?'selected':''}>${e} años</option>`).join("")}</select></div>
        <div class="campo"><label>Color favorito</label><div class="selector-color" data-selector-color-padres>${DEFAULTS.coloresPerfil.map(c=>`<button type="button" class="bola-color" style="background:${c}" data-color-pp="${c}" aria-pressed="${color===c}"></button>`).join("")}</div></div>

        <div class="campo"><label for="pp-tema">Tema visual</label><select id="pp-tema"><option value="auto" ${(!p||p.theme==='auto')?'selected':''}>Automático</option><option value="light" ${p&&p.theme==='light'?'selected':''}>Claro</option><option value="dark" ${p&&p.theme==='dark'?'selected':''}>Oscuro</option></select></div>
        <div class="campo"><label>Días escolares</label><div class="grupo-opciones" data-dias-padres>${DEFAULTS.diasSemana.map(d=>`<button type="button" class="opcion-pastilla" data-dia-pp="${d.v}" aria-pressed="${p?p.schoolDays.includes(d.v):[1,2,3,4,5].includes(d.v)}">${d.l}</button>`).join("")}</div></div>

        <div class="campo"><label>Icono</label><div class="grupo-opciones" data-icono-recompensa>${iconosDisponibles.map(i=>`<button type="button" class="btn btn-icono ${((r&&r.icon)||'gift')===i?'btn-primario':'btn-fantasma'}" data-icono-rec-opcion="${i}">${icono(i)}</button>`).join("")}</div></div>
        <div class="campo"><label><input type="checkbox" id="rec-activa" ${!r||r.active?'checked':''} style="width:auto;"> Recompensa activa</label></div>
        <div class="pie-modal">
          ${r?`<button type="button" class="btn btn-peligro" data-eliminar-recompensa-form="${r.id}">${icono("trash")} Eliminar</button>`:''}
          <button type="button" class="btn btn-fantasma" data-cerrar-modal>Cancelar</button>
          <button type="submit" class="btn btn-primario">Guardar</button>
        </div>
      </form>`
    });
    let iconoElegido = (r && r.icon) || "gift";
    modal.querySelectorAll("[data-icono-rec-opcion]").forEach(btn=>btn.addEventListener("click",()=>{
      iconoElegido = btn.getAttribute("data-icono-rec-opcion");
      modal.querySelectorAll("[data-icono-rec-opcion]").forEach(b=>{ b.classList.toggle("btn-primario", b===btn); b.classList.toggle("btn-fantasma", b!==btn); });
    }));
    modal.querySelector("[data-form-recompensa-padres]").addEventListener("submit",(e)=>{

      const campos = { name:nombre, description:document.getElementById("rec-desc").value, cost:document.getElementById("rec-costo").value,

      ModalManager.cerrar();
      ToastManager.mostrar(r?"Recompensa actualizada.":"Recompensa creada.","exito");
      UI.renderVista("padres");

/* ===================== BackupService ===================== */
const BackupService = (function(){
  function nombreArchivo(sufijo){
    return "mi-dia-genial-respaldo-"+Utils.todayISO()+(sufijo?"-"+sufijo:"")+".json";
  }
  function descargarJSON(objeto, nombre){
    const blob = new Blob([JSON.stringify(objeto,null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = nombre;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
  }
  function exportarTodo(){
    const datos = Store.obtener();
    const paquete = { appName:"Bookfluence Kids — Mi Día Genial", exportedAt: new Date().toISOString(), schemaVersion: datos.schemaVersion, data: datos };
    descargarJSON(paquete, nombreArchivo());
    ToastManager.mostrar("Respaldo exportado.","exito");
  }
  function exportarPorPerfil(profileId){
    const datos = Store.obtener();
    const perfil = Utils.byId(datos.profiles, profileId);
    if(!perfil) return;
    const filtrar = arr => arr.filter(x=>x.profileId===profileId);
    const recorte = {
      schemaVersion: datos.schemaVersion, appSettings: datos.appSettings, parentSettings: {adultName: datos.parentSettings.adultName},
      profiles: [perfil], subjects: filtrar(datos.subjects), tasks: filtrar(datos.tasks), events: filtrar(datos.events),
      habits: filtrar(datos.habits), habitLogs: filtrar(datos.habitLogs), studySessions: filtrar(datos.studySessions),
      books: filtrar(datos.books), readingSessions: filtrar(datos.readingSessions), reviews: filtrar(datos.reviews),
      goals: filtrar(datos.goals), goalSteps: datos.goalSteps.filter(s=>filtrar(datos.goals).some(g=>g.id===s.goalId)),
      emotionLogs: filtrar(datos.emotionLogs), gratitudeLogs: filtrar(datos.gratitudeLogs), rewards: filtrar(datos.rewards),
      rewardRedemptions: filtrar(datos.rewardRedemptions), starTransactions: filtrar(datos.starTransactions)
    };
    const paquete = { appName:"Bookfluence Kids — Mi Día Genial", exportedAt: new Date().toISOString(), schemaVersion: datos.schemaVersion, profileOnly:true, data: recorte };
    descargarJSON(paquete, nombreArchivo(SanitizationService.cleanText(perfil.name,20).toLowerCase().replace(/\s+/g,"-")||"perfil"));
    ToastManager.mostrar("Respaldo del perfil exportado.","exito");
  }
  function validarArchivo(texto){
    let json;
    try{ json = JSON.parse(texto); }
    catch(err){ return { ok:false, error:"Este archivo no tiene un formato válido. Elige un archivo de respaldo (.json) que hayas exportado antes." }; }
    const contenido = json && json.data ? json.data : json;
    if(!contenido || typeof contenido !== "object" || !Array.isArray(contenido.profiles)){
      return { ok:false, error:"Este archivo no parece ser un respaldo de Mi Día Genial." };
    }
    const migrado = MigrationService.migrar(JSON.parse(JSON.stringify(contenido)));
    const resumen = {
      perfiles: migrado.profiles.length, tareas: migrado.tasks.length, habitos: migrado.habits.length,
      libros: migrado.books.length, metas: migrado.goals.length, eventos: migrado.events.length
    };
    return { ok:true, datos: migrado, resumen };
  }
  function respaldoPrevioAutomatico(){
    try{ localStorage.setItem(Store.CLAVE+"_previo_"+Date.now(), JSON.stringify(Store.obtener())); }catch(e){ /* si no hay espacio, se omite silenciosamente */ }
  }
  function aplicarImportacion(datosMigrados){
    respaldoPrevioAutomatico();
    Store.reemplazar(datosMigrados);
  }
  return { exportarTodo, exportarPorPerfil, validarArchivo, aplicarImportacion, descargarJSON, nombreArchivo };
})();

Acciones["data-accion-importar-respaldo"] = function(){

  input.type = "file"; input.accept = "application/json,.json";
  input.addEventListener("change", ()=>{

    const lector = new FileReader();
    lector.onload = ()=>{

      const modal = ModalManager.abrir({

        AuthService.pedirPin({
