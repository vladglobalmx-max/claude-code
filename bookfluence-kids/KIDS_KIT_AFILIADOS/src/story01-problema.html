<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
:root{ --azul:#4C8DFF; --turquesa:#34C1BC; --violeta:#8A7CF5; --amarillo:#F6C84C; --ink-soft:#C7CEE0; }
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1080px;height:1920px;overflow:hidden;font-family:'Work Sans',sans-serif;}
.canvas{width:1080px;height:1920px;position:relative; background:linear-gradient(180deg,#1C2340 0%, #141A33 100%);}
.safe{position:absolute; top:250px; left:90px; right:90px; bottom:250px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;}
.logo{position:absolute; top:300px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:12px;}
.badge{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#4C8DFF,#8A7CF5);display:flex;align-items:center;justify-content:center;font-size:22px;}
.wordmark{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.7rem;color:#fff;}

.headline{margin-top:120px; font-family:'Fredoka',sans-serif; font-size:56px; line-height:1.32; font-weight:600; color:#fff;}
.headline em{font-style:normal; color:var(--turquesa);}
.subtext{margin-top:48px; font-size:28px; line-height:1.55; color:var(--ink-soft); max-width:760px;}
.linea{width:70px; height:3px; background:var(--amarillo); margin-top:48px;}
</style></head><body>
<div class="canvas">
  <div class="logo"><span class="badge">📖</span><span class="wordmark">Bookfluence Kids</span></div>
  <div class="safe">
    <div class="headline">¿Pantallas que <em>distraen</em>,<br>en vez de ayudar<br>a organizar?</div>
    <div class="linea"></div>
    <div class="subtext">Mi Día Genial es diferente: sin anuncios, sin compras, sin scroll infinito.</div>
  </div>
</div>
</body></html>
