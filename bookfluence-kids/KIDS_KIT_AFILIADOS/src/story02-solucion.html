<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --azul:#4C8DFF; --turquesa:#34C1BC; --violeta:#8A7CF5; --amarillo:#F6C84C;
  --ink:#253047; --ink-soft:#5A6478; --bg:#F7F9FD; --borde:#E1E7F5;
  --grad-marca:linear-gradient(135deg,#4C8DFF 0%,#34C1BC 50%,#8A7CF5 100%);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1080px;height:1920px;overflow:hidden;font-family:'Work Sans',sans-serif;}
.canvas{width:1080px;height:1920px;position:relative;background:var(--bg);}
.logo{position:absolute; top:300px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:12px;}
.badge{width:46px;height:46px;border-radius:14px;background:var(--grad-marca);display:flex;align-items:center;justify-content:center;font-size:21px;}
.wordmark{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.6rem;color:var(--ink);}

.pill{position:absolute; top:410px; left:50%; transform:translateX(-50%);}
.pill span{display:inline-block; background:#EFF0FE; color:var(--violeta); font-size:17px; font-weight:700; padding:9px 22px; border-radius:30px; white-space:nowrap;}

.headline{position:absolute; top:466px; left:90px; right:90px; text-align:center; font-family:'Fredoka',sans-serif; font-size:54px; line-height:1.22; font-weight:600; color:var(--ink);}
.subtext{position:absolute; top:710px; left:130px; right:130px; text-align:center; font-size:27px; line-height:1.55; color:var(--ink-soft);}

.mockup{position:absolute; top:850px; left:50px; width:980px; height:502px; border-radius:22px; overflow:hidden; box-shadow:0 36px 80px rgba(76,141,255,0.2); border:1px solid var(--borde); background:#fff;}
.mockup img{width:100%; display:block; margin-top:-24px;}
</style></head><body>
<div class="canvas">
  <div class="logo"><span class="badge">📖</span><span class="wordmark">Bookfluence Kids</span></div>
  <div class="pill"><span>Para niñas y niños de 7 a 12 años</span></div>
  <div class="headline">Un día organizado<br>empieza por<br>ellos mismos.</div>
  <div class="subtext">Organiza su día, crea hábitos y celebra sus logros con estrellas.</div>
  <div class="mockup"><img src="kids-dashboard.png" alt=""></div>
</div>
</body></html>
