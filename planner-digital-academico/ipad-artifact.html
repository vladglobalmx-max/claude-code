/* ===================== ImportService ===================== */
const ImportService = (() => {
  function normalizeHeader(h){ return h.trim().toLowerCase().replace(/[^a-z0-9]/g,""); }
  const HEADER_MAP = {
    name:"name", nombre:"name",
    listnumber:"listNumber", numero:"listNumber", numerodelista:"listNumber", no:"listNumber",
    email:"email", correo:"email",
    guardianname:"guardianName", tutor:"guardianName", nombretutor:"guardianName",
    guardiancontact:"guardianContact", contactotutor:"guardianContact", telefonotutor:"guardianContact"
  };

  function openPasteListModal(groupId){
    ModalManager.open({
      title:"Pegar lista de estudiantes",
      size:"lg",
      bodyHtml:`
        <p class="text-sm text-sec">Pega una lista con un estudiante por línea. Puedes usar "Nombre" o "Nombre, número de lista".</p>
        <div class="field"><label for="paste-group">Grupo destino</label><select id="paste-group">${Store.list("groups").map(g=>`<option value="${g.id}" ${g.id===groupId?"selected":""}>${Utils.escapeHtml(g.name)}</option>`).join("")}</select></div>
        <div class="field"><label for="paste-area">Lista de estudiantes</label><textarea id="paste-area" rows="8" placeholder="Ana Torres, 1&#10;Luis Pérez, 2&#10;..."></textarea></div>
        <div id="paste-preview"></div>`,
      footerHtml:`<button class="btn" id="paste-cancel">Cancelar</button><button class="btn btn-primary" id="paste-import">Importar</button>`,
      onMount(root){
        root.querySelector("#paste-cancel").addEventListener("click", ModalManager.close);
        root.querySelector("#paste-import").addEventListener("click", ()=>{
          const gId = root.querySelector("#paste-group").value;
          const lines = root.querySelector("#paste-area").value.split("\n").map(l=>l.trim()).filter(Boolean);
          if(!gId){ ToastManager.show("Selecciona un grupo destino.", "warning"); return; }
          if(!lines.length){ ToastManager.show("Pega al menos un estudiante.", "warning"); return; }
          let count=0;
          lines.forEach((line,i)=>{
            const parts = line.split(",").map(p=>p.trim());
            const name = SanitizationService.clean(parts[0]);
            if(!name) return;
            const listNumber = parts[1] && !isNaN(Number(parts[1])) ? Number(parts[1]) : i+1;
            Store.insert("students", {name, listNumber, groupId:gId, status:"activo"});
            count++;
          });
          ModalManager.close();
          ToastManager.show(`${count} estudiante(s) importados.`, "success");
        });
      }
    });
  }

  function openCsvImportModal(groupId){
    ModalManager.open({
      title:"Importar estudiantes desde CSV",
      size:"lg",
      bodyHtml:`
        <p class="text-sm text-sec">Columnas admitidas: <code>name, listNumber, email, guardianName, guardianContact</code>. Se mostrará una vista previa antes de importar.</p>
        <div class="field"><label for="csv-group">Grupo destino</label><select id="csv-group">${Store.list("groups").map(g=>`<option value="${g.id}" ${g.id===groupId?"selected":""}>${Utils.escapeHtml(g.name)}</option>`).join("")}</select></div>
        <div class="field"><label for="csv-file">Archivo CSV</label><input type="file" id="csv-file" accept=".csv,text/csv"></div>
        <div id="csv-import-result"></div>`,
      footerHtml:`<button class="btn" id="csv-cancel">Cancelar</button><button class="btn btn-primary" id="csv-preview-btn" disabled>Vista previa</button>`,
      onMount(root){
        let parsedRows = null;
        root.querySelector("#csv-cancel").addEventListener("click", ModalManager.close);
        const previewBtn = root.querySelector("#csv-preview-btn");
        root.querySelector("#csv-file").addEventListener("change", (e)=>{
          const file = e.target.files[0];
          if(!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try{
              const rows = Utils.parseCSV(reader.result);
              if(!rows.length){ ToastManager.show("El archivo está vacío.", "error"); return; }
              parsedRows = rows;
              previewBtn.disabled = false;
              ToastManager.show("Archivo cargado. Genera la vista previa.", "success");
            }catch(err){ ToastManager.show("No se pudo leer el archivo CSV.", "error"); }
          };
          reader.readAsText(file, "UTF-8");
        });
        previewBtn.addEventListener("click", ()=>{
          if(!parsedRows) return;
          const headerRow = parsedRows[0].map(normalizeHeader);
          const mapped = headerRow.map(h=>HEADER_MAP[h]||null);
          const dataRows = parsedRows.slice(1);
          const seen = new Set();
          const preview = dataRows.map((row,idx)=>{
            const rec = {};
            mapped.forEach((field,i)=>{ if(field) rec[field] = (row[i]||"").trim(); });
            const issues = [];
            if(!rec.name) issues.push("sin nombre");
            if(row.every(c=>!c || !c.trim())) issues.push("fila vacía");
            const dupKey = (rec.name||"").toLowerCase()+"|"+(rec.listNumber||"");
            if(rec.name && seen.has(dupKey)) issues.push("posible duplicado");
            seen.add(dupKey);
            return {rec, issues, rowIndex:idx};
          });
          const unknownCols = headerRow.filter(h=>!HEADER_MAP[h]);
          const valid = preview.filter(p=>!p.issues.includes("sin nombre") && !p.issues.includes("fila vacía"));
          root.querySelector("#csv-import-result").innerHTML = `
            <div class="help-box" style="margin:10px 0">
              Se detectaron ${dataRows.length} fila(s). Válidas para importar: <strong>${valid.length}</strong>.
              ${unknownCols.length?`<br>Columnas no reconocidas (se ignorarán): ${unknownCols.join(", ")}`:""}
            </div>
            <div class="table-wrap" style="max-height:260px;overflow-y:auto">
              <table><thead><tr><th>Nombre</th><th>N.º</th><th>Correo</th><th>Tutor</th><th>Estado</th></tr></thead>
              <tbody>${preview.slice(0,200).map(p=>`<tr>
                <td>${Utils.escapeHtml(p.rec.name||"—")}</td><td>${Utils.escapeHtml(p.rec.listNumber||"")}</td>
                <td>${Utils.escapeHtml(p.rec.email||"")}</td><td>${Utils.escapeHtml(p.rec.guardianName||"")}</td>
                <td>${p.issues.length?`<span class="pill warning">${p.issues.join(", ")}</span>`:`<span class="pill success">Lista</span>`}</td>
              </tr>`).join("")}</tbody></table>
            </div>
            <button class="btn btn-primary" id="csv-confirm-import" style="margin-top:12px">Importar ${valid.length} estudiante(s)</button>`;
          root.querySelector("#csv-confirm-import").addEventListener("click", ()=>{
            const gId = root.querySelector("#csv-group").value;
            if(!gId){ ToastManager.show("Selecciona un grupo destino.", "warning"); return; }
            valid.forEach(p=>{
              Store.insert("students", {name:SanitizationService.clean(p.rec.name), listNumber:p.rec.listNumber?Number(p.rec.listNumber)||"":"",
                email:p.rec.email||"", guardianName:p.rec.guardianName||"", guardianContact:p.rec.guardianContact||"", groupId:gId, status:"activo"});
            });
            ModalManager.close();
            ToastManager.show(`${valid.length} estudiante(s) importados correctamente.`, "success");
          });
        });
      }
    });
  }

  function openFullRestoreModal(){
    ModalManager.open({
      title:"Restaurar respaldo",
      bodyHtml:`
        <p class="text-sm text-sec">Selecciona un archivo de respaldo (.json) exportado previamente por Planner Digital Académico 2026.</p>
        <div class="field"><label for="restore-file">Archivo de respaldo</label><input type="file" id="restore-file" accept=".json,application/json"></div>
        <div id="restore-result"></div>`,
      footerHtml:`<button class="btn" id="restore-cancel">Cancelar</button>`,
      onMount(root){
        root.querySelector("#restore-cancel").addEventListener("click", ModalManager.close);
        root.querySelector("#restore-file").addEventListener("change", (e)=>{
          const file = e.target.files[0]; if(!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            let payload;
            try{ payload = JSON.parse(reader.result); }
            catch(err){ root.querySelector("#restore-result").innerHTML = `<p class="error-msg">El archivo no es un JSON válido.</p>`; return; }
            const incoming = payload.data || payload;
            if(!validateData(incoming)){ root.querySelector("#restore-result").innerHTML = `<p class="error-msg">El archivo no tiene el formato esperado de Planner Digital Académico 2026.</p>`; return; }
            const summary = {
              ciclos:(incoming.schoolYears||[]).length, grupos:(incoming.groups||[]).length,
              estudiantes:(incoming.students||[]).length, planeaciones:(incoming.lessonPlans||[]).length,
              calificaciones:(incoming.grades||[]).length
            };
            root.querySelector("#restore-result").innerHTML = `
              <div class="help-box">Este respaldo contiene: ${summary.ciclos} ciclo(s), ${summary.grupos} grupo(s), ${summary.estudiantes} estudiante(s), ${summary.planeaciones} planeación(es), ${summary.calificaciones} calificación(es).<br>Versión de esquema: ${incoming.schemaVersion||"desconocida"}.</div>
              <p style="margin-top:10px"><strong>Al restaurar se reemplazarán todos los datos actuales.</strong> Se creará un respaldo de seguridad antes de continuar.</p>
              <div class="field"><label class="checkbox-row"><input type="checkbox" id="restore-confirm-check"><span>Confirmo que quiero reemplazar mi información actual</span></label></div>
              <button class="btn btn-danger" id="restore-confirm-btn">Restaurar respaldo</button>`;
            root.querySelector("#restore-confirm-btn").addEventListener("click", async ()=>{
              if(!root.querySelector("#restore-confirm-check").checked){ ToastManager.show("Marca la casilla de confirmación.", "warning"); return; }
              const ok = await AuthService.verifyPinPrompt();
              if(!ok) return;
              Store.backupSnapshot("antes de restaurar");
              const merged = migrateData(incoming);
              Object.keys(merged).forEach(k=>{ Store.data[k]=merged[k]; });
              Store.save(true);
              ModalManager.close();
              ToastManager.show("Respaldo restaurado correctamente. Recargando…", "success");
              setTimeout(()=>window.location.reload(), 1200);
            });
          };
          reader.readAsText(file, "UTF-8");
        });
      }
    });
  }

  return {openPasteListModal, openCsvImportModal, openFullRestoreModal};
})();

const App = (() => {
  function startMainApp(){
    document.getElementById("app-root").hidden = false;
    UI.renderSidebar();
    UI.renderBottomNav();
    UI.renderTopbarSelectors();
    UI.applyTheme();
    Store.onChange(()=>{ UI.refreshChrome(); });
    wireGlobalActions();
    AuthService.resetLockTimer();
    Router.handle();
  }
  function wireGlobalActions(){
    document.getElementById("btn-mobile-menu").addEventListener("click", ()=>{
      const rest = UI.NAV_ITEMS;
      ModalManager.open({
        title:"Menú",
        bodyHtml:`<div class="grid-cards">${rest.map(it=>`<button class="btn btn-block" data-path="${it.path}" data-nav="1" style="justify-content:flex-start">${Icons[it.icon]} ${it.label}</button>`).join("")}</div>`,
        onMount(r){ r.addEventListener("click",(e)=>{ const b=e.target.closest("[data-nav]"); if(!b) return; ModalManager.close(); Router.navigate(b.dataset.path); }); }
      });
    });
    document.getElementById("btn-lock").addEventListener("click", ()=>{
      if(!AuthService.isPinEnabled()){ ToastManager.show("Activa un PIN en Configuración para poder bloquear la app.", "warning"); return; }
      AuthService.lock();
    });
    document.getElementById("btn-help").addEventListener("click", ()=>Router.navigate("/ayuda"));
  }
  function init(){
    Store.load();
    UI.applyTheme();
    if(PrivacyGate.needed()){
      PrivacyGate.render(afterPrivacy);
    } else afterPrivacy();
  }
  function afterPrivacy(){
    if(OnboardingController.needed()){
      OnboardingController.start();
    } else {
      startMainApp();
    }
  }
  return {init, startMainApp};
})();

/* ===================== ScheduleService + ScheduleView (#/horario) ===================== */
const ScheduleService = (() => {
  function overlap(aStart,aEnd,bStart,bEnd){ return aStart<bEnd && bStart<aEnd; }
  function findConflicts(block, excludeId){
    return Store.list("schedules").filter(b=>b.id!==excludeId && b.day===block.day && overlap(block.start,block.end,b.start,b.end));
  }
  function suspend(blockId, dateISO){
    const b = Store.get("schedules", blockId); if(!b) return;
    const dates = new Set(b.suspendedDates||[]); dates.add(dateISO);
    Store.update("schedules", blockId, {suspendedDates:[...dates]});
  }
  function duplicateAll(){
    const all = Store.list("schedules");
    all.forEach(b=>Store.insert("schedules", {...b, id:undefined, createdAt:undefined, suspendedDates:[]}));
    ToastManager.show("Horario duplicado como punto de partida.", "success");
  }
  return {overlap, findConflicts, suspend, duplicateAll};
})();

const ScheduleView = (() => {
  let mode = "semana"; // semana | dia | grupo | materia
  let filterVal = "";
  let dayFocus = String(Utils.weekdayIndex(Utils.todayISO()));

  function openBlockForm(block){
    const isNew = !block;
    ModalManager.open({
      title: isNew? "Nuevo bloque de horario" : "Editar bloque de horario",
      bodyHtml:`<form id="sched-form" class="form-grid">
        <div class="field"><label for="sf-day">Día</label><select id="sf-day">${SchoolYearService.DIAS_SEMANA.map(d=>`<option value="${d.value}" ${block&&block.day===d.value?"selected":""}>${d.label}</option>`).join("")}</select></div>
        <div class="field"><label for="sf-group">Grupo</label><select id="sf-group" required>${groupOptions().map(o=>`<option value="${o.value}" ${block&&block.groupId===o.value?"selected":""}>${Utils.escapeHtml(o.label)}</option>`).join("")}</select></div>
        <div class="field"><label for="sf-subject">Materia</label><select id="sf-subject">${subjectOptions().map(o=>`<option value="${o.value}" ${block&&block.subjectId===o.value?"selected":""}>${Utils.escapeHtml(o.label)}</option>`).join("")}</select></div>
        <div class="field"><label for="sf-room">Aula</label><input type="text" id="sf-room" value="${block?Utils.escapeHtml(block.room||""):""}"></div>
        <div class="field"><label for="sf-start">Hora inicial</label><input type="time" id="sf-start" required value="${block?block.start:""}"></div>
        <div class="field"><label for="sf-end">Hora final</label><input type="time" id="sf-end" required value="${block?block.end:""}"></div>
        <div class="field full"><label for="sf-notes">Notas</label><textarea id="sf-notes">${block?Utils.escapeHtml(block.notes||""):""}</textarea></div>
        <p class="error-msg" id="sf-error" hidden></p>
      </form>`,
      footerHtml:`<button class="btn" id="sf-cancel">Cancelar</button><button class="btn btn-primary" id="sf-save">${isNew?"Crear":"Guardar"}</button>`,
      onMount(root){
        root.querySelector("#sf-cancel").addEventListener("click", ModalManager.close);
        function trySave(force){
          const data = {
            day: root.querySelector("#sf-day").value, groupId: root.querySelector("#sf-group").value,
            subjectId: root.querySelector("#sf-subject").value, room: root.querySelector("#sf-room").value,
            start: root.querySelector("#sf-start").value, end: root.querySelector("#sf-end").value,
            notes: SanitizationService.clean(root.querySelector("#sf-notes").value)
          };
          const err = root.querySelector("#sf-error");
          if(!data.groupId){ err.hidden=false; err.textContent="Selecciona un grupo."; return; }
          if(!data.start || !data.end || data.end<=data.start){ err.hidden=false; err.textContent="La hora final debe ser posterior a la inicial."; return; }
          const conflicts = ScheduleService.findConflicts(data, block?block.id:null);
          if(conflicts.length && !force){
            err.hidden=false;
            err.innerHTML = `Este horario se cruza con ${conflicts.length} bloque(s) existentes. <button class="btn btn-sm btn-danger" id="sf-force" type="button" style="margin-top:6px">Guardar de todos modos</button>`;
            root.querySelector("#sf-force").addEventListener("click", ()=>trySave(true));
            return;
          }
          const g = Store.get("groups", data.groupId);
          data.color = g ? g.color : "#3976D9";
          if(isNew) Store.insert("schedules", data); else Store.update("schedules", block.id, data);
          ModalManager.close(); ToastManager.show("Bloque de horario guardado.", "success"); draw();
        }
        root.querySelector("#sf-save").addEventListener("click", ()=>trySave(false));
      }
    });
  }

  function container(){ return document.getElementById("view-root"); }

  function draw(){
    const c = container();
    const workingDays = (SchoolYearService.activeYear()||{}).workingDays || ["1","2","3","4","5"];
    const days = SchoolYearService.DIAS_SEMANA.filter(d=>workingDays.includes(d.value)).sort((a,b)=>{
      const order = Store.data.settings.firstDayOfWeek===0 ? ["0","1","2","3","4","5","6"] : ["1","2","3","4","5","6","0"];
      return order.indexOf(a.value)-order.indexOf(b.value);
    });
    let blocks = Store.list("schedules");
    if(mode==="grupo" && filterVal) blocks = blocks.filter(b=>b.groupId===filterVal);
    if(mode==="materia" && filterVal) blocks = blocks.filter(b=>b.subjectId===filterVal);
    const hours = [];
    for(let h=6; h<=20; h++) hours.push(Utils.pad(h)+":00");

    c.innerHTML = `
      <div class="card-header">
        <h2 style="margin:0">Horario</h2>
        <div class="btn-group no-print">
          <button class="btn btn-secondary btn-sm" id="sc-new">${Icons.plus} Nuevo bloque</button>
          <button class="btn btn-secondary btn-sm" id="sc-dup">${Icons.copy} Duplicar horario</button>
          <button class="btn btn-secondary btn-sm" id="sc-print">${Icons.print} Imprimir</button>
        </div>
      </div>
      <div class="tabs no-print">
        ${["semana","dia","grupo","materia"].map(m=>`<button class="tab-btn ${mode===m?'active':''}" data-mode="${m}">${m==='semana'?'Semana completa':m==='dia'?'Un día':m==='grupo'?'Por grupo':'Por materia'}</button>`).join("")}
      </div>
      ${mode==="grupo"?`<div class="field" style="max-width:260px"><select id="sc-filter"><option value="">Todos los grupos</option>${groupOptions().map(o=>`<option value="${o.value}" ${filterVal===o.value?"selected":""}>${Utils.escapeHtml(o.label)}</option>`).join("")}</select></div>`:""}
      ${mode==="materia"?`<div class="field" style="max-width:260px"><select id="sc-filter"><option value="">Todas las materias</option>${subjectOptions().map(o=>`<option value="${o.value}" ${filterVal===o.value?"selected":""}>${Utils.escapeHtml(o.label)}</option>`).join("")}</select></div>`:""}
      ${mode==="dia"?`<div class="field" style="max-width:260px"><select id="sc-day">${days.map(d=>`<option value="${d.value}" ${dayFocus===d.value?"selected":""}>${d.label}</option>`).join("")}</select></div>`:""}
      <div class="card" id="sched-grid-holder"></div>
    `;
    renderGrid(mode==="dia" ? days.filter(d=>d.value===dayFocus) : days, blocks);
    c.querySelector("#sc-new").addEventListener("click", ()=>openBlockForm(null));
    c.querySelector("#sc-dup").addEventListener("click", ()=>ModalManager.confirmDialog({title:"Duplicar horario", message:"Se copiarán todos los bloques actuales como punto de partida. ¿Continuar?", confirmLabel:"Duplicar", onConfirm:()=>{ ScheduleService.duplicateAll(); draw(); }}));
    c.querySelector("#sc-print").addEventListener("click", ()=>ReportService.printSchedule(blocks, days));
    c.querySelectorAll(".tab-btn").forEach(b=>b.addEventListener("click", ()=>{ mode=b.dataset.mode; draw(); }));
    const filt = c.querySelector("#sc-filter"); if(filt) filt.addEventListener("change", e=>{ filterVal=e.target.value; draw(); });
    const dsel = c.querySelector("#sc-day"); if(dsel) dsel.addEventListener("change", e=>{ dayFocus=e.target.value; draw(); });
  }

  function renderGrid(days, blocks){
    const holder = document.getElementById("sched-grid-holder");
    const hours = []; for(let h=6; h<=20; h++) hours.push(Utils.pad(h)+":00");
    function toMinutes(t){ const [h,m]=t.split(":").map(Number); return h*60+m; }
    holder.innerHTML = `<div class="sched-grid"><table class="sched-table"><thead><tr><th style="width:60px">Hora</th>${days.map(d=>`<th>${d.label}</th>`).join("")}</tr></thead>
      <tbody>${hours.map(h=>{
        const hMin = toMinutes(h);
        return `<tr><td>${h}</td>${days.map(d=>{
          const here = blocks.filter(b=>b.day===d.value && toMinutes(b.start)<=hMin && toMinutes(b.end)>hMin && toMinutes(b.start)>=hMin-45+45 ) ;
          const startingHere = blocks.filter(b=>b.day===d.value && Math.floor(toMinutes(b.start)/60)*60===hMin);
          return `<td>${startingHere.map(b=>{
            const g=Store.get("groups",b.groupId), s=Store.get("subjects",b.subjectId);
            return `<div class="sched-block" style="background:${b.color||'#3976D9'}33;border-left:4px solid ${b.color||'#3976D9'}" data-block="${b.id}">${Utils.fmtTime(b.start)}-${Utils.fmtTime(b.end)}<br>${Utils.escapeHtml(g?g.name:"")}${s?" · "+Utils.escapeHtml(s.name):""}</div>`;
          }).join("")}</td>`;
        }).join("")}</tr>`;
      }).join("")}</tbody></table></div>`;
    holder.addEventListener("click", (e)=>{
      const b = e.target.closest("[data-block]"); if(!b) return;
      const block = Store.get("schedules", b.dataset.block);
      openBlockActionsMenu(block);
    });
  }

  function openBlockActionsMenu(block){
    const g = Store.get("groups", block.groupId);
    ModalManager.open({title:g?g.name:"Bloque", bodyHtml:`<p class="text-sm">${Utils.fmtTime(block.start)} - ${Utils.fmtTime(block.end)}${block.room?" · Aula "+Utils.escapeHtml(block.room):""}</p>${block.notes?`<p class="text-sm">${Utils.escapeHtml(block.notes)}</p>`:""}`,
      footerHtml:`<button class="btn" id="bm-suspend">Suspender fecha</button><button class="btn" id="bm-edit">Editar</button><button class="btn btn-danger" id="bm-delete">Eliminar</button>`,
      onMount(r){
        r.querySelector("#bm-edit").addEventListener("click", ()=>{ ModalManager.close(); openBlockForm(block); });
        r.querySelector("#bm-delete").addEventListener("click", ()=>{ ModalManager.close(); ModalManager.confirmDialog({title:"Eliminar bloque", message:"¿Eliminar este bloque de horario?", danger:true, confirmLabel:"Eliminar", onConfirm:()=>{ Store.remove("schedules", block.id); draw(); }}); });
        r.querySelector("#bm-suspend").addEventListener("click", ()=>{
          ModalManager.close();
          ModalManager.open({title:"Suspender clase en una fecha", bodyHtml:`<div class="field"><label for="susp-date">Fecha a suspender</label><input type="date" id="susp-date" value="${Utils.todayISO()}"></div>`,
            footerHtml:`<button class="btn" id="susp-cancel">Cancelar</button><button class="btn btn-primary" id="susp-ok">Suspender</button>`,
            onMount(r2){ r2.querySelector("#susp-cancel").addEventListener("click", ModalManager.close);
              r2.querySelector("#susp-ok").addEventListener("click", ()=>{ ScheduleService.suspend(block.id, r2.querySelector("#susp-date").value); ModalManager.close(); ToastManager.show("Clase suspendida para esa fecha.","success"); }); }
          });
        });
      }
    });
  }

  function render(container){ draw(); }
  Router.register("/horario", render);
  return {render};
})();

const EVENT_TYPES = [
  {value:"clase",label:"Clase",color:"#3976D9"},{value:"examen",label:"Examen",color:"#C94A4A"},
  {value:"entrega",label:"Entrega",color:"#D99021"},{value:"reunion",label:"Reunión",color:"#8B5CF6"},
  {value:"consejo-tecnico",label:"Consejo técnico",color:"#1F365C"},{value:"capacitacion",label:"Capacitación",color:"#2CB7A3"},
  {value:"dia-inhabil",label:"Día inhábil",color:"#667085"},{value:"vacaciones",label:"Vacaciones",color:"#F2C14E"},
  {value:"evento-escolar",label:"Evento escolar",color:"#F27D72"},{value:"personal",label:"Personal",color:"#0EA5E9"},
  {value:"otro",label:"Otro",color:"#94A3B8"}
];
function typeColor(t){ return (EVENT_TYPES.find(e=>e.value===t)||{}).color || "#3976D9"; }
function typeLabel(t){ return (EVENT_TYPES.find(e=>e.value===t)||{}).label || t; }

const CalendarService = (() => {
  function occurrencesInRange(startISO, endISO){
    const out = [];
    Store.list("events").forEach(e=>{
      if(!e.repeat || e.repeat==="none"){
        if(e.startDate<=endISO && (e.endDate||e.startDate)>=startISO) out.push({...e, occDate:e.startDate});
        return;
      }
      let cursor = e.startDate;
      const until = e.repeatUntil && e.repeatUntil<endISO ? e.repeatUntil : endISO;
      const step = e.repeat==="diaria" ? 1 : 7;
      let guard=0;
      while(cursor<=until && guard<400){
        if(cursor>=startISO) out.push({...e, occDate:cursor});
        cursor = Utils.addDays(cursor, step);
        guard++;
      }
    });
    return out.sort((a,b)=> (a.occDate+((a.time)||"")).localeCompare(b.occDate+((b.time)||"")));
  }
  return {occurrencesInRange};
})();

const CalendarView = (() => {
  let mode = "mes"; // dia|semana|mes|agenda|ciclo
  let focusDate = Utils.todayISO();

  function eventForm(prefillDate, ev){
    const isNew = !ev;
    ModalManager.open({
      title: isNew? "Nuevo evento" : "Editar evento", size:"lg",
      bodyHtml:`<form id="ev-form" class="form-grid">
        <div class="field full"><label for="ev-title">Título</label><input type="text" id="ev-title" required value="${ev?Utils.escapeHtml(ev.title):""}"></div>
        <div class="field"><label for="ev-type">Tipo</label><select id="ev-type">${EVENT_TYPES.map(t=>`<option value="${t.value}" ${ev&&ev.type===t.value?"selected":""}>${t.label}</option>`).join("")}</select></div>
        <div class="field"><label class="checkbox-row" style="margin-top:26px"><input type="checkbox" id="ev-allday" ${ev&&ev.allDay?"checked":""}><span>Todo el día</span></label></div>
        <div class="field"><label for="ev-start">Fecha inicial</label><input type="date" id="ev-start" required value="${ev?ev.startDate:(prefillDate||Utils.todayISO())}"></div>
        <div class="field"><label for="ev-end">Fecha final</label><input type="date" id="ev-end" value="${ev?ev.endDate||"":""}"></div>
        <div class="field" id="ev-time-wrap" ${ev&&ev.allDay?"hidden":""}><label for="ev-time">Hora</label><input type="time" id="ev-time" value="${ev?ev.time||"":""}"></div>
        <div class="field"><label for="ev-group">Grupo (opcional)</label><select id="ev-group"><option value="">—</option>${groupOptions().map(o=>`<option value="${o.value}" ${ev&&ev.groupId===o.value?"selected":""}>${Utils.escapeHtml(o.label)}</option>`).join("")}</select></div>
        <div class="field"><label for="ev-subject">Materia (opcional)</label><select id="ev-subject"><option value="">—</option>${subjectOptions().map(o=>`<option value="${o.value}" ${ev&&ev.subjectId===o.value?"selected":""}>${Utils.escapeHtml(o.label)}</option>`).join("")}</select></div>
        <div class="field"><label for="ev-location">Ubicación</label><input type="text" id="ev-location" value="${ev?Utils.escapeHtml(ev.location||""):""}"></div>
        <div class="field"><label for="ev-repeat">Repetición</label><select id="ev-repeat"><option value="none">Sin repetición</option><option value="diaria" ${ev&&ev.repeat==="diaria"?"selected":""}>Diaria</option><option value="semanal" ${ev&&ev.repeat==="semanal"?"selected":""}>Semanal</option></select></div>
        <div class="field" id="ev-repeat-until-wrap" ${!(ev&&ev.repeat&&ev.repeat!=="none")?"hidden":""}><label for="ev-repeat-until">Repetir hasta</label><input type="date" id="ev-repeat-until" value="${ev?ev.repeatUntil||"":""}"></div>
        <div class="field full"><label for="ev-desc">Descripción</label><textarea id="ev-desc">${ev?Utils.escapeHtml(ev.description||""):""}</textarea></div>
        <div class="field full"><label class="checkbox-row"><input type="checkbox" id="ev-reminder" ${ev&&ev.reminder?"checked":""}><span>Mostrar recordatorio visual en el panel</span></label></div>
        <p class="error-msg" id="ev-error" hidden></p>
      </form>`,
      footerHtml:`<button class="btn" id="ev-cancel">Cancelar</button>${!isNew?`<button class="btn btn-danger" id="ev-delete">Eliminar</button>`:""}<button class="btn btn-primary" id="ev-save">${isNew?"Crear":"Guardar"}</button>`,
      onMount(root){
        root.querySelector("#ev-allday").addEventListener("change", e=>root.querySelector("#ev-time-wrap").hidden = e.target.checked);
        root.querySelector("#ev-repeat").addEventListener("change", e=>root.querySelector("#ev-repeat-until-wrap").hidden = e.target.value==="none");
        root.querySelector("#ev-cancel").addEventListener("click", ModalManager.close);
        if(!isNew) root.querySelector("#ev-delete").addEventListener("click", ()=>ModalManager.confirmDialog({title:"Eliminar evento", message:"¿Eliminar este evento?", danger:true, confirmLabel:"Eliminar", onConfirm:()=>{ Store.remove("events", ev.id); ModalManager.close(); draw(); }}));
        root.querySelector("#ev-save").addEventListener("click", ()=>{
          const data = {
            title: SanitizationService.clean(root.querySelector("#ev-title").value.trim()),
            type: root.querySelector("#ev-type").value, allDay: root.querySelector("#ev-allday").checked,
            startDate: root.querySelector("#ev-start").value, endDate: root.querySelector("#ev-end").value,
            time: root.querySelector("#ev-time").value, groupId: root.querySelector("#ev-group").value,
            subjectId: root.querySelector("#ev-subject").value, location: SanitizationService.clean(root.querySelector("#ev-location").value),
            repeat: root.querySelector("#ev-repeat").value, repeatUntil: root.querySelector("#ev-repeat-until").value,
            description: SanitizationService.clean(root.querySelector("#ev-desc").value), reminder: root.querySelector("#ev-reminder").checked,
            color: typeColor(root.querySelector("#ev-type").value), schoolYearId: Store.data.settings.activeSchoolYearId
          };
          const err = root.querySelector("#ev-error");
          if(!data.title){ err.hidden=false; err.textContent="El título es obligatorio."; return; }
          if(!data.startDate){ err.hidden=false; err.textContent="La fecha inicial es obligatoria."; return; }
          if(isNew) Store.insert("events", data); else Store.update("events", ev.id, data);
          ModalManager.close(); ToastManager.show("Evento guardado.", "success"); draw();
        });
      }
    });
  }

  function draw(){
    const c = document.getElementById("view-root");
    c.innerHTML = `
      <div class="card-header">
        <h2 style="margin:0">Calendario</h2>
        <div class="btn-group no-print">
          <button class="btn btn-secondary btn-sm" id="cal-today">Hoy</button>
          <button class="btn btn-secondary btn-sm" id="cal-prev">←</button>
          <button class="btn btn-secondary btn-sm" id="cal-next">→</button>
          <button class="btn btn-primary btn-sm" id="cal-new">${Icons.plus} Nuevo evento</button>
          <button class="btn btn-secondary btn-sm" id="cal-print">${Icons.print} Imprimir</button>
        </div>
      </div>
      <div class="tabs no-print">${["dia","semana","mes","agenda","ciclo"].map(m=>`<button class="tab-btn ${mode===m?'active':''}" data-mode="${m}">${({dia:"Día",semana:"Semana",mes:"Mes",agenda:"Agenda",ciclo:"Ciclo escolar"})[m]}</button>`).join("")}</div>
      <div class="card" id="cal-body"></div>`;
    c.querySelector("#cal-today").addEventListener("click", ()=>{ focusDate=Utils.todayISO(); draw(); });
    c.querySelector("#cal-prev").addEventListener("click", ()=>{ shift(-1); draw(); });
    c.querySelector("#cal-next").addEventListener("click", ()=>{ shift(1); draw(); });
    c.querySelector("#cal-new").addEventListener("click", ()=>eventForm(focusDate, null));
    c.querySelector("#cal-print").addEventListener("click", ()=>ReportService.printCalendar(mode, focusDate));
    c.querySelectorAll(".tab-btn").forEach(b=>b.addEventListener("click", ()=>{ mode=b.dataset.mode; draw(); }));
    renderBody();
  }
  function shift(dir){
    if(mode==="dia") focusDate = Utils.addDays(focusDate, dir);
    else if(mode==="semana") focusDate = Utils.addDays(focusDate, dir*7);
    else { const d=Utils.parseISODate(focusDate); d.setMonth(d.getMonth()+dir); focusDate=Utils.isoOf(d); }
  }
  function dayCellEvents(dateISO){
    return CalendarService.occurrencesInRange(dateISO, dateISO);
  }
  function renderBody(){
    const holder = document.getElementById("cal-body");
    if(mode==="mes") return renderMonth(holder);
    if(mode==="semana") return renderWeek(holder);
    if(mode==="dia") return renderDay(holder);
    if(mode==="agenda") return renderAgenda(holder);
    if(mode==="ciclo") return renderYear(holder);
  }
  function renderMonth(holder){
    const d = Utils.parseISODate(focusDate);
    const first = new Date(d.getFullYear(), d.getMonth(), 1);
    const firstDow = Store.data.settings.firstDayOfWeek||1;
    let startOffset = (first.getDay()-firstDow+7)%7;
    const gridStart = new Date(first); gridStart.setDate(gridStart.getDate()-startOffset);
    const weekdays = Array.from({length:7}).map((_,i)=>Utils.DIAS_CORTO[(firstDow+i)%7]);
    let cells = "";
    for(let i=0;i<42;i++){
      const cur = new Date(gridStart); cur.setDate(cur.getDate()+i);
      const iso = Utils.isoOf(cur);
      const evts = dayCellEvents(iso);
      const isToday = iso===Utils.todayISO();
      const otherMonth = cur.getMonth()!==d.getMonth();
      cells += `<div class="cal-daycell ${otherMonth?'other-month':''} ${isToday?'today':''}" data-date="${iso}">
        <div class="cal-daynum">${cur.getDate()}</div>
        ${evts.slice(0,3).map(e=>`<div class="cal-evt" style="background:${e.color}55;color:#1a2333" data-evid="${e.id}">${Utils.escapeHtml(e.title)}</div>`).join("")}
        ${evts.length>3?`<div class="text-xs text-sec">+${evts.length-3} más</div>`:""}
      </div>`;
    }
    holder.innerHTML = `<h3 style="text-transform:capitalize">${d.toLocaleDateString("es-MX",{month:"long",year:"numeric"})}</h3>
      <div class="cal-grid" style="margin-bottom:6px">${weekdays.map(w=>`<div class="cal-weekday-hd">${w}</div>`).join("")}</div>
      <div class="cal-grid">${cells}</div>`;
    wireCellClicks(holder);
  }
  function renderWeek(holder){
    const start = Utils.startOfWeek(focusDate);
    const days = Array.from({length:7}).map((_,i)=>Utils.addDays(start,i));
    holder.innerHTML = `<div class="cal-grid">${days.map(iso=>{
      const evts = dayCellEvents(iso);
      const d = Utils.parseISODate(iso);
      return `<div class="cal-daycell ${iso===Utils.todayISO()?'today':''}" data-date="${iso}" style="min-height:180px">
        <div class="cal-daynum">${Utils.DIAS_CORTO[d.getDay()]} ${d.getDate()}</div>
        ${evts.map(e=>`<div class="cal-evt" style="background:${e.color}55" data-evid="${e.id}">${e.time?Utils.fmtTime(e.time)+" ":""}${Utils.escapeHtml(e.title)}</div>`).join("")}
      </div>`;
    }).join("")}</div>`;
    wireCellClicks(holder);
  }
  function renderDay(holder){

const ATTN_STATUS = [
  {value:"presente",label:"Presente",color:"success"},{value:"ausente",label:"Ausente",color:"error"},
  {value:"retardo",label:"Retardo",color:"warning"},{value:"justificado",label:"Justificado",color:"neutral"},
  {value:"salida-anticipada",label:"Salida anticipada",color:"warning"},{value:"sin-clase",label:"Sin clase",color:"neutral"}
];
const AttendanceService = (() => {
  function recordsFor(groupId, date){ return Store.list("attendanceRecords").filter(r=>r.groupId===groupId && r.date===date); }
  function markAllPresent(groupId, date, studentIds){
    return studentIds.map(sid=>({studentId:sid, status:"presente", note:""}));
  }
  function saveDay(groupId, date, entries){
    Store.backupSnapshot("asistencia");
    Store.data.attendanceRecords = Store.data.attendanceRecords.filter(r=>!(r.groupId===groupId && r.date===date));
    entries.forEach(e=>{ Store.insert("attendanceRecords", {groupId, date, studentId:e.studentId, status:e.status, note:e.note||""}); });
  }
  function studentSummary(studentId){
    const recs = Store.list("attendanceRecords").filter(r=>r.studentId===studentId).sort((a,b)=>a.date.localeCompare(b.date));
    const counted = recs.filter(r=>r.status!=="sin-clase");
    const present = counted.filter(r=>["presente","retardo","salida-anticipada"].includes(r.status)).length;
    const pct = counted.length ? Utils.roundTo(100*present/counted.length,0) : null;
    const ausencias = recs.filter(r=>r.status==="ausente").length;
    const retardos = recs.filter(r=>r.status==="retardo").length;
    let maxConsec=0, cur=0;
    recs.forEach(r=>{ if(r.status==="ausente"){ cur++; maxConsec=Math.max(maxConsec,cur); } else if(r.status!=="justificado") cur=0; });
    return {pct, ausencias, retardos, maxConsec, total:recs.length};
  }
  return {recordsFor, markAllPresent, saveDay, studentSummary};
})();

const CATEGORY_PRESETS = [{value:"tareas",label:"Tareas"},{value:"participacion",label:"Participación"},{value:"proyectos",label:"Proyectos"},{value:"examenes",label:"Exámenes"},{value:"practicas",label:"Prácticas"},{value:"lectura",label:"Lectura"},{value:"portafolio",label:"Portafolio"},{value:"otra",label:"Otra"}];
const GRADE_STATES = [{value:"normal",label:"Calificado"},{value:"pendiente",label:"Sin calificar"},{value:"ausente",label:"Ausente"},{value:"exento",label:"Exento"}];

function categoriesForGroup(groupId){ return Store.list("assessmentCategories").filter(c=>c.groupId===groupId && c.active!==false); }
function categoryWeightSum(groupId){ return categoriesForGroup(groupId).reduce((a,c)=>a+(Number(c.weight)||0),0); }

const GradeService = (() => {
  function roundWithMode(value, decimals, mode){
    const f = Math.pow(10, decimals||0);
    if(mode==="arriba") return Math.ceil(value*f)/f;
    if(mode==="abajo") return Math.floor(value*f)/f;
    return Utils.roundTo(value, decimals);
  }
  function convertScale(pct, opts){
    const {scale, decimals, rounding, minGrade} = opts;
    if(pct===null) return null;
    if(scale==="0-100") return roundWithMode(pct, decimals, rounding);
    if(scale==="letras"){
      if(pct>=90) return "A"; if(pct>=80) return "B"; if(pct>=70) return "C"; if(pct>=60) return "D"; return "F";
    }
    if(scale==="niveles"){
      if(pct>=90) return "Sobresaliente"; if(pct>=75) return "Satisfactorio"; if(pct>=60) return "En desarrollo"; return "Inicial";
    }
    if(scale==="acreditado"){
      const thresholdPct = (Number(minGrade)||6)<=10 ? (Number(minGrade)||6)*10 : (Number(minGrade)||60);
      return pct>=thresholdPct ? "Acreditado" : "No acreditado";
    }
    return roundWithMode(pct/10, decimals, rounding); // 0-10 default
  }
  function assessmentResult(assessmentId, studentId){
    const g = Store.list("grades").find(gr=>gr.assessmentId===assessmentId && gr.studentId===studentId);
    if(!g || g.state==="pendiente" || g.points===null || g.points===undefined || g.points==="") return null;
    if(g.state==="ausente" || g.state==="exento") return null;
    const a = Store.get("assessments", assessmentId);
    if(!a || !a.maxScore) return null;
    return Utils.clamp(g.points / a.maxScore, 0, 999);
  }
  function categoryAverage(groupId, termId, categoryId, studentId){
    return categoryStatus(groupId, termId, categoryId, studentId).avg;
  }
  // Distingue tres situaciones para una categoría y un estudiante:
  //  - sin evaluaciones creadas todavía (hasAssessments=false) -> bloquea el resultado final (pendiente)
  //  - el estudiante está exento de TODAS las evaluaciones de la categoría -> se excluye del cálculo (no bloquea)
  //  - hay evaluaciones sin calificar/ausentes -> bloquea el resultado final (pendiente), no se asume cero
  function categoryStatus(groupId, termId, categoryId, studentId){
    const assessments = Store.list("assessments").filter(a=>a.groupId===groupId && a.categoryId===categoryId && (!termId || a.termId===termId));
    if(!assessments.length) return {avg:null, hasAssessments:false, allExempt:false};
    let numer=0, denom=0, any=false, exemptCount=0;
    assessments.forEach(a=>{
      const g = Store.list("grades").find(gr=>gr.assessmentId===a.id && gr.studentId===studentId);
      if(g && g.state==="exento"){ exemptCount++; return; }
      const res = assessmentResult(a.id, studentId);
      if(res===null) return;
      const w = Number(a.weightInCategory)||1;
      numer += res*w; denom += w; any = true;
    });
    const allExempt = exemptCount===assessments.length;
    return {avg: any ? numer/denom : null, hasAssessments:true, allExempt};
  }
  function finalGrade(groupId, termId, studentId){
    const cats = categoriesForGroup(groupId);
    const sumWeights = cats.reduce((a,c)=>a+(Number(c.weight)||0),0);
    if(!cats.length || sumWeights!==100) return {status:"config", pct:null};
    let total=0, weightUsed=0, missing=[];
    cats.forEach(c=>{
      const w = Number(c.weight)||0;
      const st = categoryStatus(groupId, termId, c.id, studentId);
      if(!st.hasAssessments){ if(w>0) missing.push(c.name); return; }
      if(st.allExempt) return; // categoría no aplica a este estudiante: se excluye y se redistribuye el peso restante
      if(st.avg===null){ if(w>0) missing.push(c.name); return; }
      total += st.avg*(w/100); weightUsed += w;
    });
    if(missing.length) return {status:"pending", pct:null, missing};
    if(weightUsed===0) return {status:"exempt", pct:null};
    const pct = Utils.roundTo((total/(weightUsed/100))*100, 4);
    return {status:"ok", pct};
  }
  function studentDisplayGrade(groupId, termId, studentId){
    const res = finalGrade(groupId, termId, studentId);
    const settings = Store.data.settings;
    if(res.status==="config") return {label:"Configura categorías", value:null};
    if(res.status==="pending") return {label:"Pendiente", value:null};
    if(res.status==="exempt") return {label:"Exento", value:null};
    const converted = convertScale(res.pct, {scale:settings.defaultScale, decimals:settings.defaultDecimals, rounding:settings.defaultRounding, minGrade:settings.evalMinGrade||6});
    return {label:String(converted), value:converted, pct:res.pct};
  }
  function groupAverage(groupId){
    const students = Store.list("students").filter(s=>s.groupId===groupId && s.status==="activo");
    const termId = Store.data.settings.activePeriodId;
    const vals = students.map(s=>finalGrade(groupId, termId, s.id)).filter(r=>r.status==="ok").map(r=>r.pct);
    if(!vals.length) return null;
    const avgPct = vals.reduce((a,b)=>a+b,0)/vals.length;
    return convertScale(avgPct, {scale:Store.data.settings.defaultScale, decimals:Store.data.settings.defaultDecimals, rounding:Store.data.settings.defaultRounding});
  }
  return {convertScale, roundWithMode, assessmentResult, categoryAverage, finalGrade, studentDisplayGrade, groupAverage};
})();

  function drawCalificaciones(){
    const holder = document.getElementById("ev-body");
    const assessments = Store.list("assessments");
    holder.innerHTML = `<div class="filters-bar"><div class="field" style="min-width:260px"><label for="grd-assessment">Evaluación</label><select id="grd-assessment"><option value="">Selecciona una evaluación</option>${assessments.map(a=>{const g=Store.get("groups",a.groupId);return `<option value="${a.id}">${Utils.escapeHtml(a.title)} · ${g?Utils.escapeHtml(g.name):""} (${Utils.fmtDate(a.date)})</option>`;}).join("")}</select></div></div><div id="grd-table"></div>`;
    holder.querySelector("#grd-assessment").addEventListener("change", e=>renderGradeTable(e.target.value));
    function renderGradeTable(assessmentId){
      const target = document.getElementById("grd-table");
      if(!assessmentId){ target.innerHTML = EntityEngine.emptyStateHtml("Selecciona una evaluación","Elige una evaluación para capturar calificaciones."); return; }
      const a = Store.get("assessments", assessmentId);
      const students = Store.list("students").filter(s=>s.groupId===a.groupId && s.status==="activo").sort((x,y)=>(x.listNumber||0)-(y.listNumber||0));
      target.innerHTML = `<h3 style="margin-top:14px">${Utils.escapeHtml(a.title)} · Puntaje máximo: ${a.maxScore}</h3>
        <div class="table-wrap"><table><thead><tr><th>N.º</th><th>Estudiante</th><th>Estado</th><th>Puntos</th><th>%</th><th>Retroalimentación</th></tr></thead><tbody>
        ${students.map(s=>{
          const g = Store.list("grades").find(gr=>gr.assessmentId===assessmentId && gr.studentId===s.id) || {state:"pendiente", points:"", feedback:""};
          const pct = (g.state==="normal" && g.points!=="" && g.points!==null && g.points!==undefined) ? Utils.roundTo(100*g.points/a.maxScore,1)+"%" : "—";
          return `<tr data-grow="${s.id}">
            <td>${s.listNumber||""}</td><td>${Utils.escapeHtml(s.name)}</td>
            <td><select data-gf="state">${GRADE_STATES.map(st=>`<option value="${st.value}" ${g.state===st.value?"selected":""}>${st.label}</option>`).join("")}</select></td>
            <td><input type="number" data-gf="points" min="0" max="${a.maxScore}" value="${g.points===undefined||g.points===null?"":g.points}" style="width:90px" ${g.state!=="normal"?"disabled":""}></td>
            <td data-pct>${pct}</td>
            <td><input type="text" data-gf="feedback" value="${Utils.escapeHtml(g.feedback||"")}"></td>
          </tr>`;
        }).join("")}
        </tbody></table></div>
        <button class="btn btn-primary" id="grd-save" style="margin-top:12px">Guardar calificaciones</button>`;
      target.querySelectorAll("[data-grow]").forEach(row=>{
        const stateSel = row.querySelector('[data-gf="state"]');
        const pointsInp = row.querySelector('[data-gf="points"]');
        stateSel.addEventListener("change", ()=>{
          pointsInp.disabled = stateSel.value!=="normal";
          if(stateSel.value!=="normal") pointsInp.value="";
          updatePct(row);
        });
        pointsInp.addEventListener("input", ()=>updatePct(row));
      });
      function updatePct(row){
        const state = row.querySelector('[data-gf="state"]').value;
        const pts = row.querySelector('[data-gf="points"]').value;
        row.querySelector("[data-pct]").textContent = (state==="normal" && pts!=="") ? Utils.roundTo(100*Number(pts)/a.maxScore,1)+"%" : "—";
      }
      target.querySelector("#grd-save").addEventListener("click", ()=>{
        let hasError = false;
        students.forEach(s=>{
          const row = target.querySelector(`[data-grow="${s.id}"]`);
          const state = row.querySelector('[data-gf="state"]').value;
          const ptsRaw = row.querySelector('[data-gf="points"]').value;
          if(state==="normal" && ptsRaw!=="" && Number(ptsRaw)>a.maxScore) hasError = true;
        });
        if(hasError){ ToastManager.show("Hay puntos que superan el puntaje máximo. Corrige antes de guardar.", "error"); return; }
        students.forEach(s=>{
          const row = target.querySelector(`[data-grow="${s.id}"]`);
          const state = row.querySelector('[data-gf="state"]').value;
          const ptsRaw = row.querySelector('[data-gf="points"]').value;
          const feedback = SanitizationService.clean(row.querySelector('[data-gf="feedback"]').value);
          const points = state==="normal" ? (ptsRaw===""?null:Number(ptsRaw)) : null;
          const finalState = state==="normal" && points===null ? "pendiente" : state;
          const existing = Store.list("grades").find(gr=>gr.assessmentId===assessmentId && gr.studentId===s.id);
          if(existing) Store.update("grades", existing.id, {state:finalState, points, feedback});
          else Store.insert("grades", {assessmentId, studentId:s.id, state:finalState, points, feedback});
        });
        ToastManager.show("Calificaciones guardadas.", "success");
      });
    }
  }

  function drawResultados(){
    const holder = document.getElementById("ev-body");
    holder.innerHTML = groupPicker() + `<div class="btn-group no-print" style="margin:8px 0"><button class="btn btn-secondary btn-sm" id="res-export">${Icons.download} CSV</button><button class="btn btn-secondary btn-sm" id="res-print">${Icons.print} Imprimir</button></div><div id="res-table"></div>`;
    holder.querySelector("select").addEventListener("change", e=>{ groupId=e.target.value; renderResults(); });
    holder.querySelector("#res-export").addEventListener("click", ()=>{
      const rows = buildRows();
      ExportService.exportRowsCSV("calificaciones", rows, [{label:"Estudiante",value:"name"},{label:"Resultado",value:"label"}]);
    });
    holder.querySelector("#res-print").addEventListener("click", ()=>ReportService.printGrades(groupId));
    renderResults();
    function buildRows(){
      if(!groupId) return [];
      const students = Store.list("students").filter(s=>s.groupId===groupId && s.status==="activo").sort((a,b)=>(a.listNumber||0)-(b.listNumber||0));
      const termId = Store.data.settings.activePeriodId;
      return students.map(s=>({name:s.name, ...GradeService.studentDisplayGrade(groupId, termId, s.id)}));
    }
    function renderResults(){
      const target = document.getElementById("res-table");
      if(!groupId){ target.innerHTML = EntityEngine.emptyStateHtml("Selecciona un grupo","Elige un grupo para ver los resultados calculados."); return; }
      const sum = categoryWeightSum(groupId);
      const rows = buildRows();
      target.innerHTML = `${sum!==100?`<p class="pill warning">Las categorías suman ${sum}%. Ajusta las ponderaciones en la pestaña Categorías antes de calcular el resultado final.</p>`:""}
        <div class="table-wrap"><table><thead><tr><th>Estudiante</th><th>Resultado</th></tr></thead><tbody>
        ${rows.map(r=>`<tr><td>${Utils.escapeHtml(r.name)}</td><td>${r.value===null?`<span class="pill neutral">${r.label}</span>`:`<strong>${Utils.escapeHtml(String(r.label))}</strong>`}</td></tr>`).join("")}
        </tbody></table></div>`;
    }
  }

  function render(container, params){
    const groups = Store.list("groups").filter(g=>g.status==="activo");
    if(!groupId && groups.length===1) groupId = groups[0].id;
    if(params.get("nuevo")) tab="evaluaciones";
    draw();
  }
  Router.register("/evaluaciones", render);
  return {render};
})();

const WeeklyReviewService = (() => {
  function computeAuto(weekStart, weekEnd){
    const scheduled = Store.list("schedules").length; // bloques semanales recurrentes
    const plansInWeek = Store.list("lessonPlans").filter(p=>p.date>=weekStart && p.date<=weekEnd);
    const taught = plansInWeek.filter(p=>p.status==="impartida").length;
    const attendanceCount = Store.list("attendanceRecords").filter(r=>r.date>=weekStart && r.date<=weekEnd).length;
    const assignmentsCreated = Store.list("assignments").filter(a=>(a.createdAt||"").slice(0,10)>=weekStart && (a.createdAt||"").slice(0,10)<=weekEnd).length;
    const assessmentsPending = Store.list("assessments").filter(a=>a.status==="abierta").length;
    const followUpsOpen = Store.list("studentNotes").filter(n=>n.status==="abierto"||n.status==="en-seguimiento").length;
    const comms = Store.list("communications").filter(c=>c.date>=weekStart && c.date<=weekEnd).length;
    const units = Store.list("units").filter(u=>u.status==="en-curso");
    const unitProgress = units.length ? Utils.roundTo(units.reduce((a,u)=>a+UnitService.progress(u),0)/units.length,0) : null;
    return {scheduled, plansInWeek: plansInWeek.length, taught, attendanceCount, assignmentsCreated, assessmentsPending, followUpsOpen, comms, unitProgress};
  }
  return {computeAuto};
})();

      <h2>Horario del día</h2><p>${Utils.escapeHtml(p.scheduleNotes||"—")}</p><h2>Actividades</h2><p>${Utils.escapeHtml(p.activities||"—")}</p>
      <h2>Materiales</h2><p>${Utils.escapeHtml(p.materials||"—")}</p><h2>Reglas del aula</h2><p>${Utils.escapeHtml(p.classroomRules||"—")}</p>
      <h2>Consideraciones importantes</h2><p>${Utils.escapeHtml(p.considerations||"—")}</p>`);
  }
  function printSubstituteReport(id){
    const r = Store.get("substituteReports", id); if(!r) return;
    PrintService.openPrintWindow("Reporte del sustituto", `<p><strong>Fecha:</strong> ${Utils.fmtDate(r.date)} · <strong>Grupo:</strong> ${Utils.escapeHtml((Store.get("groups",r.groupId)||{}).name||"")}</p>
      <h2>Actividades realizadas</h2><p>${Utils.escapeHtml(r.activitiesDone||"—")}</p><h2>Incidentes</h2><p>${Utils.escapeHtml(r.incidents||"—")}</p><h2>Pendientes</h2><p>${Utils.escapeHtml(r.pending||"—")}</p>`);
  }
  function printWeeklyReview(id){
    const r = Store.get("weeklyReviews", id); if(!r) return;
    PrintService.openPrintWindow("Revisión semanal", `<p><strong>Semana:</strong> ${Utils.fmtDate(r.weekStart)} – ${Utils.fmtDate(r.weekEnd)}</p>
      <h2>¿Qué funcionó?</h2><p>${Utils.escapeHtml(r.whatWorked||"—")}</p><h2>¿Qué no funcionó?</h2><p>${Utils.escapeHtml(r.whatDidntWork||"—")}</p>
      <h2>Prioridad de la próxima semana</h2><p>${Utils.escapeHtml(r.priority||"—")}</p>`);
  }
  function printUnitProgress(groupId){
    const units = Store.list("units").filter(u=>!groupId||u.groupId===groupId);
    const rows = units.map(u=>`<tr><td>${Utils.escapeHtml(u.name)}</td><td>${Utils.escapeHtml(u.status)}</td><td>${UnitService.progress(u)}%</td></tr>`).join("");
    PrintService.openPrintWindow("Avance de unidades", tbl(["Unidad","Estado","Avance"], rows));
  }
  function printPeriodReport(groupId){
    const g = Store.get("groups", groupId); if(!g) return;
    const termId = Store.data.settings.activePeriodId;
    const students = Store.list("students").filter(s=>s.groupId===groupId && s.status==="activo");
    const rows = students.map(s=>{ const d=GradeService.studentDisplayGrade(groupId,termId,s.id); const at=AttendanceService.studentSummary(s.id); return `<tr><td>${Utils.escapeHtml(s.name)}</td><td>${Utils.escapeHtml(String(d.label))}</td><td>${at.pct===null?"—":at.pct+"%"}</td></tr>`; }).join("");
    PrintService.openPrintWindow(`Informe por periodo — ${Utils.escapeHtml(g.name)}`, tbl(["Estudiante","Calificación","% Asistencia"], rows));
  }
  return {printGroupRoster, printUnit, printLessonPlan, printSchedule, printCalendar, printAttendanceSummary, printGrades,
    printCommunication, printMeeting, printSubstitutePlan, printSubstituteReport, printWeeklyReview, printUnitProgress, printPeriodReport};
})();

      <button class="btn btn-secondary btn-block" data-runreport="${r.key}">${Icons.print} Generar</button></div>`).join("");

        <div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Inicio</th><th>Fin</th><th></th></tr></thead><tbody>
        ${SchoolYearService.holidaysOf(y.id).map(h=>`<tr><td>${Utils.escapeHtml(h.name)}</td><td>${Utils.fmtDate(h.startDate)}</td><td>${Utils.fmtDate(h.endDate||h.startDate)}</td><td><button class="btn btn-icon btn-sm btn-ghost" data-hdel="${h.id}">${Icons.trash}</button></td></tr>`).join("")}
        </tbody></table></div>
        <button class="btn btn-sm btn-secondary" data-yact="addholiday" style="margin-top:8px">${Icons.plus} Día inhábil / vacaciones</button>

        if(act){
          const kind = act.dataset.yact;
          if(kind==="activate"){ const hadOther=SchoolYearService.setActive(yid); ToastManager.show(hadOther?"Ciclo activado. El ciclo anterior pasó a Próximo.":"Ciclo activado.", "success"); render(document.getElementById("view-root")); }

          else if(kind==="archive"){ SchoolYearService.archive(yid); render(document.getElementById("view-root")); }
          else if(kind==="duplicate"){ SchoolYearService.duplicate(yid); ToastManager.show("Ciclo duplicado.","success"); render(document.getElementById("view-root")); }

          else if(kind==="delete"){
            const count = SchoolYearService.relatedCount(yid);
            ModalManager.open({title:"Eliminar ciclo escolar", bodyHtml:`<p>Este ciclo tiene ${count} registro(s) relacionados (grupos, eventos). ¿Confirmas eliminarlo? Esta acción no se puede deshacer.</p><div class="field"><label for="del-year-text">Escribe ELIMINAR para confirmar</label><input type="text" id="del-year-text" data-autofocus></div>`,

      footerHtml:`<button class="btn" id="sp-cancel">Cancelar</button><button class="btn btn-primary" id="sp-ok">Guardar</button>`,
      onMount(r){
        r.querySelector("#sp-cancel").addEventListener("click", ModalManager.close);
        r.querySelector("#sp-ok").addEventListener("click", async ()=>{
          const err = r.querySelector("#sp-error");
          if(enabled){ const okOld = await AuthService.checkPin(r.querySelector("#sp-old").value.trim()); if(!okOld){ err.hidden=false; err.textContent="El PIN actual no es correcto."; return; } }
          const n = r.querySelector("#sp-new").value.trim(), cf = r.querySelector("#sp-confirm").value.trim();
          if(!/^\d{4,8}$/.test(n)){ err.hidden=false; err.textContent="El PIN debe tener entre 4 y 8 dígitos."; return; }
          if(n!==cf){ err.hidden=false; err.textContent="Los PIN no coinciden."; return; }
          await AuthService.setPin(n);
          ModalManager.close(); ToastManager.show("PIN guardado.", "success"); render(document.getElementById("view-root"));
        });
      }
    });
  }

  function drawRespaldos(body){
    body.innerHTML = `<p class="text-sec text-sm">Crea respaldos periódicos y guárdalos en un lugar seguro (USB, nube personal, correo). Un respaldo es un archivo .json que contiene toda tu información.</p>
      <div class="btn-group">
        <button class="btn btn-primary" id="rb-export">${Icons.download} Exportar respaldo</button>
        <button class="btn btn-secondary" id="rb-import">${Icons.upload} Restaurar respaldo</button>
      </div>
      <div class="divider-label">Exportaciones específicas</div>
      <div class="btn-group">
        <button class="btn btn-secondary btn-sm" id="rb-students">Estudiantes CSV</button>
        <button class="btn btn-secondary btn-sm" id="rb-attendance">Asistencia CSV</button>
        <button class="btn btn-secondary btn-sm" id="rb-grades">Calificaciones CSV</button>
        <button class="btn btn-secondary btn-sm" id="rb-inventory">Inventario CSV</button>
      </div>`;
    body.querySelector("#rb-export").addEventListener("click", ExportService.exportFullBackup);
    body.querySelector("#rb-import").addEventListener("click", ImportService.openFullRestoreModal);
    body.querySelector("#rb-students").addEventListener("click", ()=>ExportService.exportEntityCSV(StudentEntity, Store.list("students")));
    body.querySelector("#rb-attendance").addEventListener("click", ()=>ExportService.exportRowsCSV("asistencia", Store.list("attendanceRecords").map(r=>({fecha:r.date, estudiante:(Store.get("students",r.studentId)||{}).name||"", grupo:(Store.get("groups",r.groupId)||{}).name||"", estado:r.status})), [{label:"Fecha",value:"fecha"},{label:"Estudiante",value:"estudiante"},{label:"Grupo",value:"grupo"},{label:"Estado",value:"estado"}]));
    body.querySelector("#rb-grades").addEventListener("click", ()=>{
      const rows=[]; Store.list("assessments").forEach(a=>{ Store.list("grades").filter(g=>g.assessmentId===a.id).forEach(g=>{ rows.push({evaluacion:a.title, estudiante:(Store.get("students",g.studentId)||{}).name||"", estado:g.state, puntos:g.points===null?"":g.points}); }); });
      ExportService.exportRowsCSV("calificaciones-detalle", rows, [{label:"Evaluación",value:"evaluacion"},{label:"Estudiante",value:"estudiante"},{label:"Estado",value:"estado"},{label:"Puntos",value:"puntos"}]);
    });
    body.querySelector("#rb-inventory").addEventListener("click", ()=>ExportService.exportEntityCSV(InventoryEntity, Store.list("inventoryItems")));
  }

  function drawDemo(body){
    body.innerHTML = `<p class="text-sec text-sm">Los datos de demostración incluyen un ciclo escolar, grupos, estudiantes, planeaciones y evaluaciones de ejemplo para explorar la aplicación.</p>
      <div class="btn-group"><button class="btn btn-secondary" id="dm-load">Cargar datos de demostración</button><button class="btn btn-danger" id="dm-remove">Eliminar datos de demostración</button></div>`;
    body.querySelector("#dm-load").addEventListener("click", ()=>ModalManager.confirmDialog({title:"Cargar datos de demostración", message:"Se añadirán registros de ejemplo a tu información actual. ¿Continuar?", confirmLabel:"Cargar", onConfirm:()=>{ DemoDataService.load(); ToastManager.show("Datos de demostración cargados.","success"); }}));
    body.querySelector("#dm-remove").addEventListener("click", ()=>ModalManager.confirmDialog({title:"Eliminar datos de demostración", message:"Se eliminarán todos los registros marcados como demostración. ¿Continuar?", danger:true, confirmLabel:"Eliminar", onConfirm:()=>{ DemoDataService.remove(); ToastManager.show("Datos de demostración eliminados.","success"); }}));
  }

  function drawBorrar(body){
    body.innerHTML = `<p class="text-sec text-sm">Esta acción elimina permanentemente toda la información guardada en este dispositivo. Se creará un respaldo automático antes de continuar.</p>
      <div class="field"><label class="checkbox-row"><input type="checkbox" id="wipe-check"><span>Entiendo que esta acción no se puede deshacer</span></label></div>
      <button class="btn btn-danger" id="wipe-btn">Borrar toda la información</button>`;
    body.querySelector("#wipe-btn").addEventListener("click", async ()=>{
      if(!body.querySelector("#wipe-check").checked){ ToastManager.show("Marca la casilla de confirmación.", "warning"); return; }
      const ok = await AuthService.verifyPinPrompt(); if(!ok) return;
      ExportService.exportFullBackup();
      Store.backupSnapshot("antes de borrar todo");
      localStorage.removeItem(STORAGE_KEY);
      ToastManager.show("Información eliminada. Recargando…", "success");
      setTimeout(()=>window.location.reload(), 1200);
    });
  }

  Router.register("/configuracion", render);
  return {render};
})();

/* ===================== DemoDataService ===================== */
const DemoDataService = (() => {
  function ins(coll, data){ return Store.insert(coll, {...data, _demo:true}); }
  function load(){
    Store.data.teacherProfile = {name:"Mariana", level:"primaria", country:"México", timezone:"America/Mexico_City"};
    Store.data.settings.privacyAcknowledged = true;
    Store.data.settings.onboardingCompleted = true;

    const year = ins("schoolYears", {name:"Ciclo 2026-2027", startDate:"2026-08-24", endDate:"2027-07-09", workingDays:["1","2","3","4","5"], status:"proximo", periodCount:3, archivedAt:null});
    const termNames = ["Primer trimestre","Segundo trimestre","Tercer trimestre"];
    const terms = termNames.map((n,i)=>ins("terms", {schoolYearId:year.id, name:n, order:i+1, startDate:"", endDate:""}));

    const sciences = ins("subjects", {name:"Ciencias", code:"CN", color:"#2CB7A3", description:"Ciencias naturales"});
    const math = ins("subjects", {name:"Matemáticas", code:"MAT", color:"#3976D9", description:"Matemáticas de primaria"});

    const groupB = ins("groups", {name:"5.º B", grade:"5.º", level:"primaria", schoolYearId:year.id, subjectIds:[sciences.id, math.id], room:"Salón 5B", color:"#F27D72", estimatedStudents:5, status:"activo", evaluationScheme:{}, notes:""});

    const namesA = ["Estudiante Aitana","Estudiante Bruno","Estudiante Camila","Estudiante Dylan","Estudiante Elena"];
    const namesB = ["Estudiante Fabián","Estudiante Gala","Estudiante Hugo","Estudiante Iris","Estudiante Joel"];
    const studentsA = namesA.map((n,i)=>ins("students", {name:n, listNumber:i+1, groupId:groupA.id, status:"activo"}));
    const studentsB = namesB.map((n,i)=>ins("students", {name:n, listNumber:i+1, groupId:groupB.id, status:"activo"}));

    [groupA, groupB].forEach(g=>{
      ["Tareas","Participación","Proyectos","Exámenes"].forEach((name,i)=>{
        ins("assessmentCategories", {groupId:g.id, name, weight:[20,20,20,40][i], color:["#3976D9","#2CB7A3","#F27D72","#F2C14E"][i], active:true});
      });
    });

    const unit1 = ins("units", {name:"Ecosistemas", groupId:groupA.id, subjectId:sciences.id, termId:terms[0].id, startDate:"2026-08-24", endDate:"2026-09-18", purpose:"Comprender las relaciones entre seres vivos y su entorno.", objectives:"Identificar componentes bióticos y abióticos.", topics:"¿Qué es un ecosistema?\nCadenas alimenticias\nHábitats locales", activities:"Observación de un ecosistema cercano", evidences:"Diario de observación", status:"en-curso", manualProgress:40});
    const unit2 = ins("units", {name:"Fracciones", groupId:groupA.id, subjectId:math.id, termId:terms[0].id, startDate:"2026-08-24", endDate:"2026-09-18", purpose:"Comprender fracciones equivalentes.", objectives:"Sumar y restar fracciones simples.", topics:"Fracciones propias\nFracciones equivalentes\nSuma de fracciones", status:"en-curso", manualProgress:25});

    const plan1 = ins("lessonPlans", {title:"Introducción a los ecosistemas", groupId:groupA.id, subjectId:sciences.id, unitId:unit1.id, termId:terms[0].id, date:"2026-08-25", time:"08:00", duration:50, topic:"Ecosistemas", purpose:"Reconocer qué es un ecosistema.", learningOutcomes:"El estudiante identifica ecosistemas cercanos.", opening:"Lluvia de ideas sobre la naturaleza cercana.", development:"Exploración guiada con imágenes.", closing:"Mapa conceptual grupal.", homework:"Dibujar un ecosistema.", status:"impartida", actuallyHappened:{purposeMet:"Sí, la mayoría participó.", whatWorked:"El mapa conceptual grupal.", toAdjust:"Dar más tiempo al cierre.", pending:"Revisar dibujos de tarea.", needsFollowUp:false}});
    ins("lessonPlans", {title:"Método científico", groupId:groupA.id, subjectId:sciences.id, unitId:unit1.id, termId:terms[0].id, date:"2026-09-01", time:"08:00", duration:50, topic:"Método científico", purpose:"Conocer los pasos del método científico.", status:"lista"});
    ins("lessonPlans", {title:"Fracciones equivalentes", groupId:groupA.id, subjectId:math.id, unitId:unit2.id, termId:terms[0].id, date:"2026-09-02", time:"10:00", duration:50, topic:"Fracciones", purpose:"Identificar fracciones equivalentes.", status:"borrador"});

    ins("assignments", {title:"Mapa conceptual de ecosistemas", groupId:groupA.id, subjectId:sciences.id, lessonPlanId:plan1.id, description:"Elaborar un mapa conceptual.", assignedDate:"2026-08-25", dueDate:"2026-09-01", type:"tarea", value:10, status:"asignada"});
    ins("assignments", {title:"Ejercicios de fracciones", groupId:groupA.id, subjectId:math.id, description:"Resolver ejercicios de fracciones equivalentes.", assignedDate:"2026-09-02", dueDate:"2026-09-05", type:"practica", value:10, status:"programada"});
    ins("assignments", {title:"Experimento sencillo", groupId:groupA.id, subjectId:sciences.id, description:"Realizar un experimento sencillo de flotación.", assignedDate:"2026-09-08", dueDate:"2026-09-12", type:"practica", value:10, status:"borrador"});

    ins("schedules", {day:"1", groupId:groupA.id, subjectId:sciences.id, room:"Salón 5A", start:"08:00", end:"08:50", color:groupA.color, notes:""});
    ins("schedules", {day:"3", groupId:groupA.id, subjectId:math.id, room:"Salón 5A", start:"10:00", end:"10:50", color:groupA.color, notes:""});
    ins("schedules", {day:"2", groupId:groupB.id, subjectId:sciences.id, room:"Salón 5B", start:"09:00", end:"09:50", color:groupB.color, notes:""});

    const today = Utils.todayISO();
    studentsA.forEach((s,i)=>ins("attendanceRecords", {groupId:groupA.id, date:Utils.addDays(today,-1), studentId:s.id, status:i===4?"ausente":"presente", note:""}));

    const exam = ins("assessments", {title:"Examen de ecosistemas", groupId:groupA.id, subjectId:sciences.id, termId:terms[0].id, categoryId:Store.list("assessmentCategories").find(c=>c.groupId===groupA.id && c.name==="Exámenes").id, date:"2026-09-15", maxScore:10, status:"abierta"});
    studentsA.forEach((s,i)=>{
      const pts = [9,7,8,10,null][i];
      ins("grades", {assessmentId:exam.id, studentId:s.id, state:pts===null?"pendiente":"normal", points:pts, feedback:""});
    });

    ins("studentNotes", {studentId:studentsA[4].id, date:today, category:"asistencia", observation:"Ausencia registrada, se contactará a la familia.", agreedAction:"Llamar al tutor.", responsible:"Mariana", status:"abierto", visibility:"privado"});
    ins("events", {title:"Consejo técnico escolar", type:"consejo-tecnico", startDate:Utils.addDays(today,5), allDay:true, description:"Reunión mensual de consejo técnico.", color:typeColor("consejo-tecnico")});

    ins("weeklyReviews", {weekStart:Utils.startOfWeek(today), weekEnd:Utils.addDays(Utils.startOfWeek(today),6), whatWorked:"El trabajo colaborativo en ciencias.", whatDidntWork:"El tiempo fue insuficiente en matemáticas.", priority:"Reforzar fracciones equivalentes.", auto:WeeklyReviewService.computeAuto(Utils.startOfWeek(today), Utils.addDays(Utils.startOfWeek(today),6))});

    Store.save(true);
  }
  function remove(){
    Object.keys(Store.data).forEach(k=>{
      if(Array.isArray(Store.data[k])) Store.data[k] = Store.data[k].filter(r=>!r._demo);
    });
    Store.save(true);
  }
  return {load, remove};
})();
