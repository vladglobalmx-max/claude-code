<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --azul:#4C8DFF; --turquesa:#34C1BC; --violeta:#8A7CF5; --amarillo:#F6C84C;
  --ink:#253047; --ink-soft:#5A6478; --bg:#F7F9FD; --borde:#E1E7F5;
  --grad-marca:linear-gradient(135deg,#4C8DFF 0%,#34C1BC 50%,#8A7CF5 100%);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1080px;height:1080px;overflow:hidden;font-family:'Work Sans',sans-serif;}
.canvas{width:1080px;height:1080px;position:relative;background:var(--grad-marca); display:flex; align-items:center; justify-content:center;}
.logo{position:absolute; top:60px; left:64px; display:flex; align-items:center; gap:12px;}
.badge{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center;font-size:20px;}
.wordmark{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.2rem;color:#fff;}

.headline{position:absolute; top:150px; left:90px; right:90px; text-align:center; font-family:'Fredoka',sans-serif; font-size:42px; line-height:1.3; font-weight:600; color:#fff;}

.tarjeta{position:absolute; top:330px; left:190px; width:700px; height:640px; background:#fff; border-radius:28px; box-shadow:0 30px 70px rgba(0,0,0,0.25); display:flex; flex-direction:column; align-items:center; padding-top:48px;}
.pildora{background:#EFF0FE; color:var(--violeta); font-size:15px; letter-spacing:2px; text-transform:uppercase; font-weight:700; padding:8px 20px; border-radius:20px;}
.precio{font-family:'Fredoka',sans-serif; font-size:92px; font-weight:700; color:var(--ink); line-height:1; margin-top:28px; font-variant-numeric:tabular-nums;}
.precio sup{font-size:34px; font-weight:600; vertical-align:top; margin-right:4px;}
.precio .mxn{font-size:28px; font-weight:600; color:var(--ink-soft);}
.precio-nota{font-size:20px; color:var(--ink-soft); margin-top:10px; font-weight:600;}

.lista{margin-top:40px; display:flex; flex-direction:column; gap:16px; align-self:stretch; padding:0 56px;}
.item{display:flex; align-items:center; gap:12px; font-size:23px; color:var(--ink);}
.item .check{color:var(--turquesa); font-weight:700; font-size:22px;}

.cta{margin-top:40px; background:var(--amarillo); color:var(--ink); font-weight:700; font-size:25px; padding:20px 56px; border-radius:40px; box-shadow:0 14px 30px rgba(0,0,0,0.18);}
</style></head><body>
<div class="canvas">
  <div class="logo"><span class="badge">📖</span><span class="wordmark">Bookfluence Kids</span></div>
  <div class="headline">La app que ayuda a tu hijo<br>a organizar su día.</div>
  <div class="tarjeta">
    <div class="pildora">Oferta de lanzamiento</div>
    <div class="precio"><sup>$</sup>299<span class="mxn"> MXN</span></div>
    <div class="precio-nota">IVA incluido · Pago único · Entrega inmediata</div>
    <div class="lista">
      <div class="item"><span class="check">✓</span>Aplicación completa</div>
      <div class="item"><span class="check">✓</span>Panel de padres con PIN</div>
      <div class="item"><span class="check">✓</span>Actualizaciones futuras</div>
    </div>
    <div class="cta">Quiero mi copia</div>
  </div>
</div>
</body></html>
