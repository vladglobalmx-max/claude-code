<title>Planner Digital Académico 2026 · Bookfluence Teachers</title>
<style>
/* =========================================================
   PLANNER DIGITAL ACADÉMICO 2026 — Bookfluence Teachers
   Hoja de estilos única. Sin fuentes remotas, sin CDN.
   ========================================================= */
:root{
  --azul-profundo:#1F365C;
  --azul:#3976D9;
  --turquesa:#2CB7A3;
  --coral:#F27D72;
  --amarillo:#F2C14E;
  --fondo:#F5F7FA;
  --superficie:#FFFFFF;
  --texto:#263244;
  --texto-sec:#667085;
  --exito:#2E9D69;
  --advertencia:#D99021;
  --error:#C94A4A;
  --borde:#E3E8EF;
  --radio:14px;
  --radio-sm:8px;
  --sombra:0 1px 2px rgba(31,54,92,.06), 0 4px 16px rgba(31,54,92,.06);
  --topbar-h:60px;
  --sidebar-w:248px;
  --bottomnav-h:60px;
  --font: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  --tint-turquesa: rgba(44,183,163,.14);
  --tint-coral: rgba(242,125,114,.14);
  --tint-amarillo: rgba(242,193,78,.18);
  --tint-azul: rgba(57,118,217,.12);
  --en-tinte: var(--azul-profundo);
  --escala-texto: 1;
  color-scheme: light;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --fondo:#161B26;
  --superficie:#1F2532;
  --texto:#EDEFF3;
  --texto-sec:#9AA4B2;
  --borde:#2B3242;
  --tint-turquesa: rgba(44,183,163,.20);
  --tint-coral: rgba(242,125,114,.20);
  --tint-amarillo: rgba(242,193,78,.22);
  --tint-azul: rgba(57,118,217,.22);
  --en-tinte: #AFC6ED;
  --sombra:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    color-scheme: dark;
    --fondo:#161B26; --superficie:#1F2532; --texto:#EDEFF3; --texto-sec:#9AA4B2; --borde:#2B3242;
    --tint-turquesa: rgba(44,183,163,.20); --tint-coral: rgba(242,125,114,.20);
    --tint-amarillo: rgba(242,193,78,.22); --tint-azul: rgba(57,118,217,.22);
    --en-tinte: #AFC6ED;
    --sombra:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.35);
  }
}
*,*::before,*::after{box-sizing:border-box}
html{font-size:calc(16px * var(--escala-texto))}
body{margin:0;font-family:var(--font);background:var(--fondo);color:var(--texto);line-height:1.45;-webkit-font-smoothing:antialiased}
img,svg{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--azul)}
.reduced-motion *,.reduced-motion *::before,.reduced-motion *::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
*:focus-visible{outline:3px solid var(--azul);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
hr{border:none;border-top:1px solid var(--borde);margin:16px 0}

/* ---- Botones ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:var(--radio-sm);border:1px solid var(--borde);background:var(--superficie);color:var(--texto);font-weight:600;font-size:.92rem;cursor:pointer;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:var(--azul)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--azul);border-color:var(--azul);color:#fff}
.btn-primary:hover{background:#2f66c2}
.btn-secondary{background:var(--tint-azul);border-color:transparent;color:var(--en-tinte)}
.btn-success{background:var(--exito);border-color:var(--exito);color:#fff}
.btn-danger{background:var(--error);border-color:var(--error);color:#fff}
.btn-ghost{background:transparent;border-color:transparent}
.btn-sm{min-height:36px;padding:6px 12px;font-size:.85rem}
.btn-icon{min-width:44px;padding:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-block{width:100%}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}

/* ---- Formularios ---- */
.field{margin-bottom:14px}
.field label{display:block;font-weight:600;font-size:.85rem;margin-bottom:5px;color:var(--texto)}
.field .hint{font-size:.78rem;color:var(--texto-sec);margin-top:4px}
.field .error-msg{font-size:.78rem;color:var(--error);margin-top:4px;font-weight:600}
.field.has-error input,.field.has-error select,.field.has-error textarea{border-color:var(--error)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=datetime-local],
input[type=email],input[type=tel],input[type=password],input[type=url],select,textarea{
  width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--borde);border-radius:var(--radio-sm);
  background:var(--superficie);color:var(--texto)
}
textarea{min-height:80px;resize:vertical}
select{appearance:none;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%23667085"/></svg>');background-repeat:no-repeat;background-position:right 12px center;padding-right:32px}
input:focus,select:focus,textarea:focus{border-color:var(--azul)}
.checkbox-row{display:flex;align-items:flex-start;gap:10px}
.checkbox-row input[type=checkbox]{width:20px;height:20px;flex:none;margin-top:2px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.form-grid .field.full{grid-column:1/-1}
@media (max-width:640px){.form-grid{grid-template-columns:1fr}}
fieldset{border:1px solid var(--borde);border-radius:var(--radio-sm);padding:12px;margin:0 0 14px}
legend{font-weight:700;padding:0 6px;font-size:.85rem}
.color-swatches{display:flex;flex-wrap:wrap;gap:8px}
.color-swatch{width:32px;height:32px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.color-swatch.selected{border-color:var(--texto)}

/* ---- Layout ---- */
.app-shell{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex:none;background:var(--azul-profundo);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar-brand{padding:18px 16px 8px;display:flex;align-items:center;gap:10px}
.sidebar-brand .app-name{font-weight:800;font-size:1.02rem;line-height:1.1}
.sidebar-brand .brand-name{font-size:.7rem;color:#B9C6E0;text-transform:uppercase;letter-spacing:.05em}
.sidebar nav{flex:1;padding:8px 8px 16px}
.side-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radio-sm);color:#DCE4F5;text-decoration:none;font-weight:600;font-size:.88rem;min-height:44px;cursor:pointer;border:none;background:transparent;width:100%;text-align:left}
.side-link svg{flex:none;width:18px;height:18px}
.side-link:hover{background:rgba(255,255,255,.08);color:#fff}
.side-link.active{background:var(--azul);color:#fff}
.side-section-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:#7C8CB0;padding:14px 12px 4px}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:var(--topbar-h);flex:none;background:var(--superficie);border-bottom:1px solid var(--borde);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:20;gap:10px}
.topbar .selectors{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.topbar select{min-height:36px;padding:4px 28px 4px 10px;font-size:.82rem}
.topbar-actions{display:flex;gap:8px;align-items:center}
.view-container{flex:1;padding:18px;max-width:1400px;width:100%;margin:0 auto}
.mobile-menu-btn{display:none}
.bottom-nav{display:none}
@media (max-width:960px){
  .sidebar{display:none}
  .mobile-menu-btn{display:inline-flex}
  .view-container{padding:12px;padding-bottom:calc(var(--bottomnav-h) + 18px)}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:var(--bottomnav-h);background:var(--superficie);border-top:1px solid var(--borde);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  .bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;color:var(--texto-sec);font-size:.65rem;font-weight:700;min-height:44px;cursor:pointer}
  .bottom-nav button.active{color:var(--azul)}
  .bottom-nav svg{width:20px;height:20px}
}

/* ---- Tarjetas / paneles ---- */
.card{background:var(--superficie);border:1px solid var(--borde);border-radius:var(--radio);padding:16px;box-shadow:var(--sombra)}
.card + .card{margin-top:14px}
.card-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-header h2,.card-header h3{margin:0}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.stat-tile{border-radius:var(--radio);padding:14px;background:var(--tint-azul)}
.stat-tile .stat-num{font-size:1.6rem;font-weight:800;color:var(--en-tinte)}
.stat-tile .stat-label{font-size:.78rem;color:var(--texto-sec);font-weight:600}
.stat-tile.tint-turquesa{background:var(--tint-turquesa)}
.stat-tile.tint-coral{background:var(--tint-coral)}
.stat-tile.tint-amarillo{background:var(--tint-amarillo)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:.74rem;font-weight:700;background:var(--tint-azul);color:var(--en-tinte)}
.pill.success{background:rgba(46,157,105,.15);color:var(--exito)}
.pill.warning{background:rgba(217,144,33,.15);color:var(--advertencia)}
.pill.error{background:rgba(201,74,74,.15);color:var(--error)}
.pill.neutral{background:var(--borde);color:var(--texto-sec)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}

/* ---- Tablas ---- */
.table-wrap{overflow-x:auto;border:1px solid var(--borde);border-radius:var(--radio)}
table{width:100%;border-collapse:collapse;font-size:.88rem;background:var(--superficie)}
thead th{position:sticky;top:0;background:var(--fondo);text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--texto-sec);padding:10px 12px;border-bottom:1px solid var(--borde);white-space:nowrap}
tbody td{padding:10px 12px;border-bottom:1px solid var(--borde);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--fondo)}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.view-toggle{display:flex;border:1px solid var(--borde);border-radius:var(--radio-sm);overflow:hidden}
.view-toggle button{border:none;background:var(--superficie);padding:8px 12px;cursor:pointer;font-weight:700;font-size:.8rem}
.view-toggle button.active{background:var(--azul);color:#fff}
.card-list{display:none;grid-template-columns:1fr;gap:10px}
.card-list.show{display:grid}
.table-wrap.hide{display:none}
.record-card{border:1px solid var(--borde);border-radius:var(--radio-sm);padding:12px;background:var(--superficie)}
.record-card .rc-title{font-weight:700;margin-bottom:4px}
.record-card .rc-meta{font-size:.8rem;color:var(--texto-sec);margin-bottom:8px}
@media (max-width:760px){
  .table-wrap.auto-cards{display:none}
}

/* ---- Filtros ---- */
.filters-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.filters-bar .field{margin-bottom:0;min-width:150px}
.filters-toggle-mobile{display:none}
@media (max-width:760px){
  .filters-bar{display:none}
  .filters-bar.open{display:flex;flex-direction:column;background:var(--superficie);border:1px solid var(--borde);border-radius:var(--radio);padding:12px}
  .filters-toggle-mobile{display:inline-flex}
}

/* ---- Modales ---- */
.modal-backdrop{position:fixed;inset:0;background:rgba(20,26,40,.55);display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:0}
@media (min-width:760px){.modal-backdrop{align-items:center;padding:20px}}
.modal{background:var(--superficie);border-radius:16px 16px 0 0;max-width:640px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.3)}
@media (min-width:760px){.modal{border-radius:16px}}
.modal.modal-lg{max-width:880px}
.modal-header{position:sticky;top:0;background:var(--superficie);display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--borde);z-index:2}
.modal-header h2,.modal-header h3{margin:0;font-size:1.05rem}
.modal-body{padding:18px}
.modal-footer{position:sticky;bottom:0;background:var(--superficie);display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--borde)}
.modal-close{background:none;border:none;cursor:pointer;padding:8px;border-radius:8px;color:var(--texto-sec)}
.modal-close:hover{background:var(--fondo)}

/* ---- Toasts ---- */
#toast-root{position:fixed;bottom:calc(var(--bottomnav-h) + 14px);left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;width:min(420px,92vw)}
@media (min-width:960px){#toast-root{bottom:20px}}
.toast{background:var(--azul-profundo);color:#fff;padding:12px 16px;border-radius:var(--radio-sm);box-shadow:var(--sombra);font-size:.86rem;font-weight:600;display:flex;align-items:center;gap:10px}
.toast.success{background:var(--exito)}
.toast.warning{background:var(--advertencia)}
.toast.error{background:var(--error)}

/* ---- Empty state ---- */
.empty-state{text-align:center;padding:48px 20px;color:var(--texto-sec)}
.empty-state svg{margin:0 auto 14px;opacity:.6}
.empty-state h3{color:var(--texto);margin:0 0 6px}
.empty-state p{margin:0 0 16px}

/* ---- Calendario ---- */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-daycell{border:1px solid var(--borde);border-radius:var(--radio-sm);min-height:92px;padding:6px;background:var(--superficie);font-size:.78rem}
.cal-daycell.other-month{opacity:.4}
.cal-daycell.today{border-color:var(--azul);border-width:2px}
.cal-daynum{font-weight:700;margin-bottom:4px}
.cal-evt{border-radius:6px;padding:2px 6px;margin-bottom:2px;font-size:.7rem;font-weight:700;color:#1a2333;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-weekday-hd{font-size:.7rem;text-transform:uppercase;color:var(--texto-sec);text-align:center;font-weight:700;padding:4px 0}
.agenda-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--borde)}
.agenda-date{flex:none;width:64px;text-align:center}
.agenda-date .d-num{font-size:1.2rem;font-weight:800;color:var(--en-tinte)}
.agenda-date .d-mon{font-size:.68rem;text-transform:uppercase;color:var(--texto-sec)}

/* ---- Horario ---- */
.sched-grid{display:grid;overflow-x:auto}
.sched-table{border-collapse:collapse;width:100%;min-width:640px}
.sched-table th,.sched-table td{border:1px solid var(--borde);padding:4px;font-size:.74rem;vertical-align:top;height:56px}
.sched-table th{background:var(--fondo);font-size:.72rem}
.sched-block{border-radius:6px;padding:4px 6px;height:100%;cursor:pointer;font-weight:700;font-size:.7rem;color:#1a2333}

/* ---- Onboarding ---- */
.onboarding-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--azul-profundo),#264a80);padding:20px}
.onboarding-card{background:var(--superficie);border-radius:20px;max-width:560px;width:100%;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.35);max-height:94vh;overflow-y:auto}
.onboarding-steps{display:flex;gap:6px;margin-bottom:18px}
.onboarding-steps span{flex:1;height:4px;border-radius:2px;background:var(--borde)}
.onboarding-steps span.done{background:var(--turquesa)}
.onboarding-steps span.current{background:var(--azul)}
.brandmark{display:flex;align-items:center;gap:10px;margin-bottom:6px}

/* ---- Login / PIN gate ---- */
.pin-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--azul-profundo);padding:20px}
.pin-dots{display:flex;gap:12px;justify-content:center;margin:18px 0}
.pin-dots span{width:16px;height:16px;border-radius:50%;border:2px solid #fff;background:transparent}
.pin-dots span.filled{background:#fff}
.pin-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto}
.pin-keypad button{min-height:56px;border-radius:12px;font-size:1.2rem;font-weight:700;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.2)}

/* ---- Utilidades ---- */
.text-sec{color:var(--texto-sec)}
.text-sm{font-size:.82rem}
.text-xs{font-size:.72rem}
.mt-0{margin-top:0}.mb-0{margin-bottom:0}
.flex{display:flex}.gap-8{gap:8px}.items-center{align-items:center}.justify-between{justify-content:space-between}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--borde);margin-bottom:14px;overflow-x:auto}
.tab-btn{background:none;border:none;padding:10px 14px;font-weight:700;font-size:.85rem;color:var(--texto-sec);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;min-height:44px}
.tab-btn.active{color:var(--azul);border-color:var(--azul)}
.progress-bar{height:8px;border-radius:4px;background:var(--borde);overflow:hidden}
.progress-bar > div{height:100%;background:var(--turquesa)}
.divider-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--texto-sec);font-weight:700;margin:18px 0 8px}
.kbd{border:1px solid var(--borde);border-radius:4px;padding:1px 6px;font-size:.75rem;background:var(--fondo)}
.help-box{background:var(--tint-amarillo);border-radius:var(--radio-sm);padding:12px 14px;font-size:.85rem}
.privacy-banner{background:var(--tint-turquesa);border:1px solid var(--turquesa);border-radius:var(--radio-sm);padding:12px 14px;font-size:.85rem;display:flex;gap:10px;margin-bottom:14px}
[hidden]{display:none!important}

/* ---- Impresión ---- */
.print-only{display:none}
@media print{
  .sidebar,.topbar,.bottom-nav,#toast-root,.no-print,.modal-backdrop,.filters-bar,.row-actions,.mobile-menu-btn{display:none!important}
  body{background:#fff;color:#000}
  .view-container{padding:0;max-width:none}
  .print-only{display:block}
  .card{box-shadow:none;border:1px solid #999}
  a{color:#000;text-decoration:none}
  table{font-size:11px}
  thead{display:table-header-group}
  tr{page-break-inside:avoid}
  .print-header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #1F365C;padding-bottom:8px;margin-bottom:14px}
  .print-footer{margin-top:18px;font-size:10px;color:#555;border-top:1px solid #ccc;padding-top:6px;display:flex;justify-content:space-between}
  @page{margin:14mm}
}
</style>

<div id="privacy-gate"></div>
<div id="onboarding-root" hidden></div>
<div id="pin-gate-root" hidden></div>
<div id="app-root" hidden>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-col">
      <header class="topbar">
        <div class="flex items-center gap-8">
          <button class="btn btn-icon mobile-menu-btn no-print" id="btn-mobile-menu" aria-label="Abrir menú" aria-expanded="false">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </button>
          <div class="selectors no-print" id="topbar-selectors"></div>
        </div>
        <div class="topbar-actions no-print">
          <button class="btn btn-icon btn-ghost" id="btn-lock" aria-label="Bloquear aplicación" title="Bloquear">

          </button>
          <button class="btn btn-icon btn-ghost" id="btn-help" aria-label="Ayuda" title="Ayuda">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 115 .5c0 1.5-2 1.7-2 3.3M12 17h.01"/></svg>
          </button>

      <main class="view-container" id="view-root" tabindex="-1"></main>

</div>

<script>
"use strict";
/* =========================================================
   PLANNER DIGITAL ACADÉMICO 2026
   Bookfluence Teachers
   Módulo único (sin frameworks). Namespacing manual.
   ========================================================= */

/* ===================== Utils ===================== */
const Utils = (() => {
  function uid(prefix){
    return (prefix?prefix+"_":"") + Date.now().toString(36) + Math.random().toString(36).slice(2,9);
  }
  function pad(n){ return String(n).padStart(2,"0"); }
  function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function nowISO(){ return new Date().toISOString(); }
  function parseISODate(s){ if(!s) return null; const parts=s.split("-"); if(parts.length<3) return null; return new Date(+parts[0], +parts[1]-1, +parts[2]); }
  function fmtDate(s, fmt){
    if(!s) return "";
    const d = typeof s==="string" ? parseISODate(s.slice(0,10)) : s;
    if(!d || isNaN(d.getTime())) return "";
    fmt = fmt || (Store.data.settings.dateFormat || "DD/MM/AAAA");
    const dd=pad(d.getDate()), mm=pad(d.getMonth()+1), yyyy=d.getFullYear();
    if(fmt==="AAAA-MM-DD") return `${yyyy}-${mm}-${dd}`;
    if(fmt==="MM/DD/AAAA") return `${mm}/${dd}/${yyyy}`;
    return `${dd}/${mm}/${yyyy}`;
  }
  function fmtDateLong(s){
    const d = parseISODate((s||"").slice(0,10));
    if(!d) return "";
    const meses=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
    return `${d.getDate()} de ${meses[d.getMonth()]} de ${d.getFullYear()}`;
  }
  function fmtTime(t){
    if(!t) return "";
    if((Store.data.settings.timeFormat||"24h")==="24h") return t;
    const [h,m] = t.split(":").map(Number);
    const h12 = ((h+11)%12)+1;
    return `${h12}:${pad(m)} ${h<12?"a. m.":"p. m."}`;
  }
  function debounce(fn, wait){
    let t=null;
    return function(...args){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,args), wait); };
  }
  function escapeHtml(str){
    if(str===null||str===undefined) return "";
    return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function roundTo(num, decimals){
    const f = Math.pow(10, decimals||0);
    return Math.round((num + Number.EPSILON) * f) / f;
  }
  function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
  function weekdayIndex(dateStr){ const d=parseISODate(dateStr); return d?d.getDay():null; } // 0=Dom
  const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  const DIAS_CORTO = ["dom","lun","mar","mié","jue","vie","sáb"];
  function addDays(dateStr, n){
    const d = parseISODate(dateStr); d.setDate(d.getDate()+n);
    return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  }
  function isoOf(date){ return date.getFullYear()+"-"+pad(date.getMonth()+1)+"-"+pad(date.getDate()); }
  function startOfWeek(dateStr, firstDay){
    firstDay = firstDay===undefined? (Store.data.settings.firstDayOfWeek ?? 1) : firstDay;
    const d = parseISODate(dateStr);
    let diff = (d.getDay() - firstDay + 7) % 7;
    d.setDate(d.getDate()-diff);
    return isoOf(d);
  }
  function daysBetween(a,b){
    const da=parseISODate(a), db=parseISODate(b);
    return Math.round((db-da)/86400000);
  }
  function csvEscapeCell(val){
    let s = (val===null||val===undefined) ? "" : String(val);
    if(/^[=+\-@]/.test(s)) s = "'" + s;
    if(/[",\n;]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
    return s;
  }
  function toCSV(rows, headers){
    const lines = [headers.map(h=>csvEscapeCell(h.label)).join(",")];
    rows.forEach(r=>{ lines.push(headers.map(h=>csvEscapeCell(typeof h.value==="function"?h.value(r):r[h.value])).join(",")); });
    return "﻿" + lines.join("\r\n");
  }
  function parseCSV(text){
    text = text.replace(/^﻿/, "").replace(/\r\n/g,"\n").replace(/\r/g,"\n");
    const rows=[]; let row=[]; let field=""; let inQuotes=false;
    for(let i=0;i<text.length;i++){
      const c = text[i];
      if(inQuotes){
        if(c === '"'){
          if(text[i+1]==='"'){ field+='"'; i++; } else { inQuotes=false; }
        } else field += c;
      } else {
        if(c==='"') inQuotes = true;
        else if(c===','){ row.push(field); field=""; }
        else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=""; }
        else field += c;
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(r => !(r.length===1 && r[0]===""));
  }
  function downloadFile(filename, content, mime){
    const blob = new Blob([content], {type: mime||"application/octet-stream"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }
  function announce(msg){
    const el = document.getElementById("sr-announcer");
    if(el){ el.textContent=""; setTimeout(()=>{el.textContent=msg;},50); }
  }
  return {uid,pad,todayISO,nowISO,parseISODate,fmtDate,fmtDateLong,fmtTime,debounce,escapeHtml,roundTo,clamp,
    weekdayIndex,DIAS,DIAS_CORTO,addDays,isoOf,startOfWeek,daysBetween,toCSV,parseCSV,csvEscapeCell,downloadFile,announce};
})();

/* ===================== Sanitization ===================== */
const SanitizationService = (() => {
  function clean(str){
    if(str===null||str===undefined) return "";
    return String(str).replace(/<script/gi,"&lt;script").trim();
  }
  function cleanObject(obj, fields){
    const out = {...obj};
    fields.forEach(f=>{ if(typeof out[f]==="string") out[f]=clean(out[f]); });
    return out;
  }
  return {clean, cleanObject};
})();

/* ===================== Schema / Migration ===================== */
const SCHEMA_VERSION = 1;
const APP_VERSION = "1.0.0";
const STORAGE_KEY = "aulaClaraData";

function emptyData(){
  return {
    schemaVersion: SCHEMA_VERSION,
    appVersion: APP_VERSION,
    createdAt: Utils.nowISO(),
    settings: {
      theme:"auto", textScale:1, reducedMotion:false,
      firstDayOfWeek:1, dateFormat:"DD/MM/AAAA", timeFormat:"24h", timezone:"America/Mexico_City",
      defaultScale:"0-10", defaultDecimals:1, defaultRounding:"normal",
      activeSchoolYearId:null, activePeriodId:null,
      pinEnabled:false, pinHash:null, pinSalt:null, autoLockMinutes:10,
      onboardingCompleted:false, privacyAcknowledged:false,
      demoDataLoaded:false
    },
    teacherProfile:{ name:"", level:"", country:"México", timezone:"America/Mexico_City" },
    schoolYears:[], terms:[], holidays:[], subjects:[], groups:[], students:[],
    schedules:[], events:[], units:[], lessonPlans:[], assignments:[], attendanceRecords:[],
    assessmentCategories:[], assessments:[], grades:[], studentNotes:[], familyContacts:[],
    communications:[], meetings:[], substitutePlans:[], substituteReports:[], resources:[],
    inventoryItems:[], teacherGoals:[], professionalLearning:[], weeklyReviews:[], savedReports:[],
    auditLog:[]
  };
}

function migrateData(raw){
  if(!raw.schemaVersion) raw.schemaVersion = 1;
  // Espacio reservado para futuras migraciones incrementales por schemaVersion.
  const base = emptyData();
  Object.keys(base).forEach(k=>{ if(!(k in raw)) raw[k]=base[k]; });
  Object.keys(base.settings).forEach(k=>{ if(!(k in raw.settings)) raw.settings[k]=base.settings[k]; });
  raw.schemaVersion = SCHEMA_VERSION;
  raw.appVersion = APP_VERSION;
  return raw;
}

function validateData(raw){
  if(!raw || typeof raw!=="object") return false;
  const arrays = ["schoolYears","subjects","groups","students","events"];
  return arrays.every(k => Array.isArray(raw[k]) || raw[k]===undefined);
}

/* ===================== Store ===================== */
const Store = (() => {
  let data = null;
  let listeners = [];

  function load(){
    let raw;
    try{
      const txt = localStorage.getItem(STORAGE_KEY);
      if(!txt){ data = emptyData(); return data; }
      raw = JSON.parse(txt);
      if(!validateData(raw)) throw new Error("Datos con formato inválido");
      data = migrateData(raw);
    }catch(e){
      console.warn("Planner Digital Académico 2026: no se pudieron leer los datos guardados, se intentará recuperar un respaldo.", e);
      const recovered = tryRecoverFromBackup();
      if(recovered){ data = recovered; }
      else {
        try{
          const corruptCopy = localStorage.getItem(STORAGE_KEY);
          if(corruptCopy) localStorage.setItem(STORAGE_KEY+"__dañado_"+Date.now(), corruptCopy);
        }catch(e2){/* noop */}
        data = emptyData();
      }
    }
    return data;
  }

  function tryRecoverFromBackup(){
    try{
      const b = localStorage.getItem(STORAGE_KEY+"__autobackup");
      if(!b) return null;
      const raw = JSON.parse(b);
      if(!validateData(raw)) return null;
      return migrateData(raw);
    }catch(e){ return null; }
  }

  function persistNow(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      localStorage.setItem(STORAGE_KEY+"__autobackup", JSON.stringify(data));
      return true;
    }catch(e){
      console.error("Planner Digital Académico 2026: error al guardar", e);
      ToastManager.show("No se pudo guardar. Verifica el espacio de almacenamiento del navegador.", "error");
      return false;
    }
  }
  const persistDebounced = Utils.debounce(()=>{ persistNow(); notify(); }, 350);

  function save(immediate){
    if(immediate){ persistNow(); notify(); } else persistDebounced();
  }

  function backupSnapshot(label){
    const snap = {schemaVersion:data.schemaVersion, appVersion:data.appVersion, exportedAt:Utils.nowISO(), label:label||"auto", data:JSON.parse(JSON.stringify(data))};
    try{
      const key = STORAGE_KEY+"__preop_"+Date.now();
      localStorage.setItem(key, JSON.stringify(snap));
      const idx = JSON.parse(localStorage.getItem(STORAGE_KEY+"__preop_index")||"[]");
      idx.push(key);
      while(idx.length>5){ localStorage.removeItem(idx.shift()); }
      localStorage.setItem(STORAGE_KEY+"__preop_index", JSON.stringify(idx));
    }catch(e){ console.warn("No se pudo crear respaldo previo", e); }
    return snap;
  }

  function audit(action, entity, entityId, detail){
    data.auditLog.push({id:Utils.uid("log"), at:Utils.nowISO(), action, entity, entityId, detail: detail||""});
    if(data.auditLog.length>500) data.auditLog.splice(0, data.auditLog.length-500);
  }

  function onChange(fn){ listeners.push(fn); return ()=>{ listeners = listeners.filter(l=>l!==fn); }; }
  function notify(){ listeners.forEach(fn=>{ try{fn();}catch(e){console.error(e);} }); }

  // ---- CRUD genérico ----
  function list(coll){ return data[coll] || []; }
  function get(coll, id){ return (data[coll]||[]).find(r=>r.id===id) || null; }
  function insert(coll, record){
    record.id = record.id || Utils.uid(coll.slice(0,4));
    record.createdAt = record.createdAt || Utils.nowISO();
    record.updatedAt = Utils.nowISO();
    data[coll].push(record);
    audit("crear", coll, record.id);
    save();
    return record;
  }
  function update(coll, id, patch){
    const rec = get(coll, id);
    if(!rec) return null;
    Object.assign(rec, patch, {updatedAt: Utils.nowISO()});
    audit("editar", coll, id);
    save();
    return rec;
  }
  function remove(coll, id){
    const idx = data[coll].findIndex(r=>r.id===id);
    if(idx===-1) return false;
    data[coll].splice(idx,1);
    audit("eliminar", coll, id);
    save();
    return true;
  }

  return {
    get data(){ return data; },
    load, save, persistNow, backupSnapshot, audit, onChange,
    list, get, insert, update, remove
  };
})();

/* ===================== ToastManager ===================== */
const ToastManager = (() => {
  function show(msg, type){
    const root = document.getElementById("toast-root");
    const el = document.createElement("div");
    el.className = "toast" + (type?(" "+type):"");
    el.textContent = msg;
    root.appendChild(el);
    Utils.announce(msg);
    setTimeout(()=>{ el.style.opacity="0"; el.style.transition="opacity .3s"; setTimeout(()=>el.remove(),300); }, 3600);
  }
  return {show};
})();

/* ===================== ModalManager ===================== */
const ModalManager = (() => {
  let lastFocused = null;
  let openCount = 0;
  function close(){
    const root = document.getElementById("modal-root");
    root.innerHTML = "";
    document.removeEventListener("keydown", onKeydown, true);
    if(lastFocused && lastFocused.focus) lastFocused.focus();
  }
  function onKeydown(e){
    if(e.key==="Escape"){ e.preventDefault(); close(); return; }
    if(e.key==="Tab"){
      const modal = document.querySelector("#modal-root .modal");
      if(!modal) return;
      const focusables = modal.querySelectorAll('button,input,select,textarea,a[href],[tabindex]:not([tabindex="-1"])');
      if(!focusables.length) return;
      const first = focusables[0], last = focusables[focusables.length-1];
      if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
    }
  }
  function open({title, bodyHtml, footerHtml, size, onMount, onClose}){
    lastFocused = document.activeElement;
    const root = document.getElementById("modal-root");
    root.innerHTML = `
      <div class="modal-backdrop" data-close-backdrop="1">
        <div class="modal ${size==='lg'?'modal-lg':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title-text">
          <div class="modal-header">
            <h2 id="modal-title-text">${Utils.escapeHtml(title||"")}</h2>
            <button class="modal-close" id="modal-close-btn" aria-label="Cerrar">${Icons.close}</button>
          </div>
          <div class="modal-body">${bodyHtml||""}</div>
          ${footerHtml? `<div class="modal-footer">${footerHtml}</div>` : ""}
        </div>
      </div>`;
    root.querySelector(".modal-backdrop").addEventListener("mousedown", (e)=>{
      if(e.target.dataset.closeBackdrop!==undefined && e.target===e.currentTarget) close();
    });
    root.querySelector("#modal-close-btn").addEventListener("click", ()=>{ if(onClose) onClose(); close(); });
    document.addEventListener("keydown", onKeydown, true);
    const focusTarget = root.querySelector("[data-autofocus]") || root.querySelector("input,select,textarea,button");
    if(focusTarget) setTimeout(()=>focusTarget.focus(), 30);
    if(onMount) onMount(root);
  }
  function confirmDialog({title, message, confirmLabel, danger, onConfirm, requirePin}){
    open({
      title: title||"Confirmar",
      bodyHtml: `<p>${message}</p>`,
      footerHtml: `<button class="btn" id="cf-cancel">Cancelar</button>
        <button class="btn ${danger?'btn-danger':'btn-primary'}" id="cf-ok">${Utils.escapeHtml(confirmLabel||"Confirmar")}</button>`,
      onMount(root){
        root.querySelector("#cf-cancel").addEventListener("click", close);
        root.querySelector("#cf-ok").addEventListener("click", async ()=>{
          if(requirePin){
            const ok = await AuthService.verifyPinPrompt();
            if(!ok) return;
          }
          close();
          onConfirm();
        });
      }
    });
  }
  return {open, close, confirmDialog};
})();

/* ===================== AuthService (PIN local) ===================== */
const AuthService = (() => {
  let unlocked = true;
  let lockTimer = null;
  const enc = new TextEncoder();

  function bufToHex(buf){ return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join(""); }
  function randomSaltHex(){ const arr = new Uint8Array(16); crypto.getRandomValues(arr); return bufToHex(arr.buffer); }

  async function hashPin(pin, saltHex){
    const salted = enc.encode(saltHex + ":" + pin);
    const digest = await crypto.subtle.digest("SHA-256", salted);
    return bufToHex(digest);
  }

  async function setPin(pin){
    const salt = randomSaltHex();
    const hash = await hashPin(pin, salt);
    Store.data.settings.pinEnabled = true;
    Store.data.settings.pinSalt = salt;
    Store.data.settings.pinHash = hash;
    Store.save(true);
  }
  function disablePin(){
    Store.data.settings.pinEnabled = false;
    Store.data.settings.pinHash = null;
    Store.data.settings.pinSalt = null;
    Store.save(true);
  }
  async function checkPin(pin){
    const s = Store.data.settings;
    if(!s.pinEnabled) return true;
    const h = await hashPin(pin, s.pinSalt);
    return h === s.pinHash;
  }
  function isPinEnabled(){ return !!Store.data.settings.pinEnabled; }
  function isUnlocked(){ return !isPinEnabled() || unlocked; }

  function lock(){
    if(!isPinEnabled()) return;
    unlocked = false;
    renderLockScreen();
  }
  function unlock(){ unlocked = true; document.getElementById("pin-gate-root").hidden = true; document.getElementById("app-root").hidden = false; resetLockTimer(); }

  function resetLockTimer(){
    clearTimeout(lockTimer);
    const mins = Store.data.settings.autoLockMinutes;
    if(isPinEnabled() && mins>0){
      lockTimer = setTimeout(lock, mins*60*1000);
    }
  }
  ["click","keydown","touchstart"].forEach(evt=>document.addEventListener(evt, ()=>{ if(isUnlocked()) resetLockTimer(); }, {passive:true}));

  function renderLockScreen(){
    document.getElementById("app-root").hidden = true;
    const root = document.getElementById("pin-gate-root");
    root.hidden = false;
    let entered = "";
    const maxLen = 8;
    function draw(){
      root.innerHTML = `
        <div class="pin-gate">
          <div style="text-align:center;color:#fff;max-width:320px">
            ${Icons.logo}
            <h2 style="margin:14px 0 4px">Planner Digital Académico 2026 está bloqueada</h2>
            <p class="text-sm" style="color:#C7D3EA">Ingresa tu PIN para continuar</p>
            <div class="pin-dots" id="pin-dots"></div>
            <div class="pin-keypad" id="pin-keypad"></div>
            <button class="btn btn-ghost" id="pin-forgot" style="color:#fff;margin-top:14px">¿Olvidaste tu PIN?</button>
          </div>
        </div>`;
      const dotsEl = root.querySelector("#pin-dots");
      dotsEl.innerHTML = Array.from({length: Math.max(entered.length,4)}).map((_,i)=>`<span class="${i<entered.length?'filled':''}"></span>`).join("");
      const keypad = root.querySelector("#pin-keypad");
      const keys = ["1","2","3","4","5","6","7","8","9","borrar","0","entrar"];
      keypad.innerHTML = keys.map(k=>`<button data-key="${k}" aria-label="${k}">${k==='borrar'?'⌫':(k==='entrar'?'✓':k)}</button>`).join("");
      keypad.addEventListener("click", async (e)=>{
        const btn = e.target.closest("button"); if(!btn) return;
        const k = btn.dataset.key;
        if(k==="borrar") entered = entered.slice(0,-1);
        else if(k==="entrar"){
          const ok = await checkPin(entered);
          if(ok){ entered=""; unlock(); return; }
          else { ToastManager.show("PIN incorrecto", "error"); entered=""; }
        } else if(entered.length<maxLen) entered += k;
        draw();
      });
      root.querySelector("#pin-forgot").addEventListener("click", ()=>{
        ModalManager.open({title:"PIN olvidado", bodyHtml:`<p>El PIN es local y no se puede recuperar. Si lo olvidaste, puedes restaurar la aplicación desde un respaldo (.json) exportado previamente, o borrar los datos locales y comenzar de nuevo desde <strong>Configuración → Borrar información</strong> en otro dispositivo con acceso, o reinstalando la app en este navegador (se perderán los datos no respaldados).</p>`,
          footerHtml:`<button class="btn btn-primary" id="pf-ok">Entendido</button>`,
          onMount(r){ r.querySelector("#pf-ok").addEventListener("click", ModalManager.close); }
        });
      });
    }
    draw();
  }

  function verifyPinPrompt(){
    if(!isPinEnabled()) return Promise.resolve(true);
    return new Promise(resolve=>{
      let entered = "";
      ModalManager.open({
        title:"Confirma tu PIN",
        bodyHtml:`<p class="text-sm text-sec">Esta acción está protegida. Ingresa tu PIN para continuar.</p>
          <div class="field"><label for="pin-confirm-input">PIN</label>
          <input type="password" inputmode="numeric" pattern="[0-9]*" id="pin-confirm-input" maxlength="8" data-autofocus></div>
          <p class="error-msg" id="pin-confirm-error" hidden>PIN incorrecto.</p>`,
        footerHtml:`<button class="btn" id="pin-confirm-cancel">Cancelar</button><button class="btn btn-primary" id="pin-confirm-ok">Confirmar</button>`,
        onMount(r){
          const input = r.querySelector("#pin-confirm-input");
          async function attempt(){
            const ok = await checkPin(input.value.trim());
            if(ok){ ModalManager.close(); resolve(true); }
            else { r.querySelector("#pin-confirm-error").hidden = false; input.value=""; input.focus(); }
          }
          r.querySelector("#pin-confirm-ok").addEventListener("click", attempt);
          input.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); attempt(); } });
          r.querySelector("#pin-confirm-cancel").addEventListener("click", ()=>{ ModalManager.close(); resolve(false); });
        },
        onClose(){ resolve(false); }
      });
    });
  }

  return {setPin, disablePin, checkPin, isPinEnabled, isUnlocked, lock, unlock, resetLockTimer, verifyPinPrompt};
})();

/* ===================== Router ===================== */
const Router = (() => {
  const routes = {};
  let currentHash = "";
  const state = { filters:{} };
  function register(path, renderFn, opts){ routes[path] = {renderFn, protected: !!(opts&&opts.protected)}; }
  function navigate(path){ window.location.hash = path; }
  async function handle(){
    let hash = window.location.hash.replace(/^#/, "") || "/inicio";
    currentHash = hash;
    const [path, query] = hash.split("?");
    const route = routes[path] || routes["/inicio"];
    if(route.protected && AuthService.isPinEnabled() && !AuthService.isUnlocked()){
      AuthService.lock();
      return;
    }
    UI.setActiveNav(path);
    const viewRoot = document.getElementById("view-root");
    viewRoot.setAttribute("aria-busy","true");
    try{
      await route.renderFn(viewRoot, new URLSearchParams(query||""));
    }catch(e){
      console.error("Error al renderizar vista", e);
      viewRoot.innerHTML = `<div class="card"><h2>Ocurrió un problema al mostrar esta sección</h2><p class="text-sec">Intenta recargar. Si el problema continúa, exporta un respaldo desde Configuración.</p></div>`;
    }
    viewRoot.removeAttribute("aria-busy");
    viewRoot.focus();
    window.scrollTo(0,0);
  }
  function current(){ return currentHash; }
  window.addEventListener("hashchange", handle);
  return {register, navigate, handle, current, state};
})();

/* ===================== ValidationService ===================== */
const ValidationService = (() => {
  function isRequiredEmpty(v){ return v===undefined || v===null || (typeof v==="string" && v.trim()===""); }
  function validDate(s){ return /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(Utils.parseISODate(s)); }
  function validTime(s){ return /^\d{2}:\d{2}$/.test(s); }
  function validEmail(s){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s); }
  return {isRequiredEmpty, validDate, validTime, validEmail};
})();

/* ===================== EntityEngine (motor CRUD genérico) ===================== */
const EntityEngine = (() => {

  function computeOptions(field){
    if(typeof field.optionsSource==="function") return field.optionsSource();
    return field.options || [];
  }

  function fieldValueLabel(field, value){
    if(value===undefined||value===null||value==="") return "";
    if(field.type==="checkbox") return value ? "Sí" : "No";
    if(field.type==="date") return Utils.fmtDate(value);
    if(field.type==="time") return Utils.fmtTime(value);
    if(field.type==="select"){
      const opt = computeOptions(field).find(o=>String(o.value)===String(value));
      return opt ? opt.label : value;
    }
    if(field.type==="multiselect"){
      const opts = computeOptions(field);
      return (value||[]).map(v=>{ const o=opts.find(o=>String(o.value)===String(v)); return o?o.label:v; }).join(", ");
    }
    return String(value);
  }

  function renderFieldInput(field, value){
    const id = "f_"+field.key;
    const req = field.required ? "required aria-required=\"true\"" : "";
    value = value===undefined||value===null ? (typeof field.default==="function"?field.default():field.default) : value;
    if(value===undefined) value = field.type==="checkbox" ? false : "";
    let inner = "";
    switch(field.type){
      case "textarea":
        inner = `<textarea id="${id}" name="${field.key}" ${req} placeholder="${Utils.escapeHtml(field.placeholder||"")}">${Utils.escapeHtml(value)}</textarea>`;
        break;
      case "select": {
        const opts = computeOptions(field);
        inner = `<select id="${id}" name="${field.key}" ${req}><option value="">${field.placeholder||"Selecciona..."}</option>${opts.map(o=>`<option value="${Utils.escapeHtml(o.value)}" ${String(o.value)===String(value)?"selected":""}>${Utils.escapeHtml(o.label)}</option>`).join("")}</select>`;
        break;
      }
      case "multiselect": {
        const opts = computeOptions(field);
        const arr = Array.isArray(value) ? value.map(String) : [];
        inner = `<select id="${id}" name="${field.key}" multiple size="${Math.min(6,Math.max(3,opts.length))}">${opts.map(o=>`<option value="${Utils.escapeHtml(o.value)}" ${arr.includes(String(o.value))?"selected":""}>${Utils.escapeHtml(o.label)}</option>`).join("")}</select>`;
        break;
      }
      case "checkbox":
        inner = `<div class="checkbox-row"><input type="checkbox" id="${id}" name="${field.key}" ${value?"checked":""}><label for="${id}" style="margin:0">${Utils.escapeHtml(field.checkboxLabel||"")}</label></div>`;
        break;
      case "color":
        inner = `<div class="color-swatches" id="${id}" data-field="${field.key}" data-value="${Utils.escapeHtml(value||field.default||"#3976D9")}">
          ${(field.palette||["#3976D9","#2CB7A3","#F27D72","#F2C14E","#1F365C","#8B5CF6","#E85D9C","#0EA5E9"]).map(c=>`<button type="button" class="color-swatch ${String(value)===c?'selected':''}" style="background:${c}" data-color="${c}" aria-label="Color ${c}"></button>`).join("")}
          </div>`;
        break;
      case "number":
        inner = `<input type="number" id="${id}" name="${field.key}" ${req} value="${value===""?"":value}" ${field.min!==undefined?`min="${field.min}"`:""} ${field.max!==undefined?`max="${field.max}"`:""} step="${field.step||"any"}" placeholder="${Utils.escapeHtml(field.placeholder||"")}">`;
        break;
      case "date":
        inner = `<input type="date" id="${id}" name="${field.key}" ${req} value="${value||""}">`;
        break;
      case "time":
        inner = `<input type="time" id="${id}" name="${field.key}" ${req} value="${value||""}">`;
        break;
      case "email":
        inner = `<input type="email" id="${id}" name="${field.key}" value="${Utils.escapeHtml(value)}" placeholder="${Utils.escapeHtml(field.placeholder||"")}">`;
        break;
      case "tel":
        inner = `<input type="tel" id="${id}" name="${field.key}" value="${Utils.escapeHtml(value)}" placeholder="${Utils.escapeHtml(field.placeholder||"")}">`;
        break;
      case "url":
        inner = `<input type="url" id="${id}" name="${field.key}" value="${Utils.escapeHtml(value)}" placeholder="${Utils.escapeHtml(field.placeholder||"https://")}">`;
        break;
      default:
        inner = `<input type="text" id="${id}" name="${field.key}" ${req} value="${Utils.escapeHtml(value)}" placeholder="${Utils.escapeHtml(field.placeholder||"")}" ${field.maxlength?`maxlength="${field.maxlength}"`:""}>`;
    }
    return `<div class="field ${field.full?"full":""}" data-field-wrap="${field.key}">
      <label for="${id}">${Utils.escapeHtml(field.label)}${field.required?' <span aria-hidden="true" style="color:var(--error)">*</span>':''}</label>
      ${inner}
      ${field.hint?`<div class="hint">${Utils.escapeHtml(field.hint)}</div>`:""}
      <div class="error-msg" id="err_${field.key}" hidden></div>
    </div>`;
  }

  function readFormValues(form, fields){
    const values = {};
    fields.forEach(field=>{
      const el = form.querySelector(`[name="${field.key}"]`);
      if(field.type==="checkbox") values[field.key] = !!(el && el.checked);
      else if(field.type==="multiselect") values[field.key] = el ? Array.from(el.selectedOptions).map(o=>o.value) : [];
      else if(field.type==="color") { const sw = form.querySelector(`[data-field="${field.key}"]`); values[field.key] = sw ? sw.dataset.value : ""; }
      else if(field.type==="number") values[field.key] = el && el.value!=="" ? Number(el.value) : "";
      else values[field.key] = el ? el.value : "";
      if(typeof values[field.key]==="string") values[field.key] = SanitizationService.clean(values[field.key]);
    });
    return values;
  }

  function validateValues(values, fields, record, allData){
    const errors = {};
    fields.forEach(field=>{
      const v = values[field.key];
      if(field.required && field.type!=="checkbox" && ValidationService.isRequiredEmpty(Array.isArray(v)?(v.length?"x":""):v)){
        errors[field.key] = field.requiredMsg || `${field.label} es obligatorio.`;
        return;
      }
      if(field.type==="date" && v && !ValidationService.validDate(v)) errors[field.key] = "Fecha inválida.";
      if(field.type==="email" && v && !ValidationService.validEmail(v)) errors[field.key] = "Correo inválido.";
      if(field.type==="number" && v!=="" && field.min!==undefined && v<field.min) errors[field.key] = `El valor mínimo es ${field.min}.`;
      if(field.type==="number" && v!=="" && field.max!==undefined && v>field.max) errors[field.key] = `El valor máximo es ${field.max}.`;
      if(field.validate){
        const msg = field.validate(v, values, record, allData);
        if(msg) errors[field.key] = msg;
      }
    });
    return errors;
  }

  function showFormErrors(form, errors){
    form.querySelectorAll(".field").forEach(f=>f.classList.remove("has-error"));
    form.querySelectorAll(".error-msg").forEach(e=>{ e.hidden=true; e.textContent=""; });
    let first = null;
    Object.keys(errors).forEach(key=>{
      const wrap = form.querySelector(`[data-field-wrap="${key}"]`);
      const errEl = form.querySelector(`#err_${key}`);
      if(wrap) wrap.classList.add("has-error");
      if(errEl){ errEl.hidden=false; errEl.textContent = errors[key]; }
      if(!first) first = form.querySelector(`[name="${key}"]`) || wrap;
    });
    if(first && first.focus) first.focus();
  }

  function openForm(config, record, opts){
    opts = opts || {};
    const isNew = !record;
    const fields = typeof config.fields==="function" ? config.fields(record) : config.fields;
    ModalManager.open({
      title: opts.title || (isNew ? `Nueva ${config.singular.toLowerCase()}` : `Editar ${config.singular.toLowerCase()}`),
      size: config.formSize||"md",
      bodyHtml: `<form id="entity-form" novalidate>
        ${config.formIntro?`<p class="text-sm text-sec">${config.formIntro}</p>`:""}
        <div class="form-grid">${fields.map(f=>renderFieldInput(f, record?record[f.key]:undefined)).join("")}</div>
        ${config.extraFormHtml ? config.extraFormHtml(record) : ""}
      </form>`,
      footerHtml: `<button class="btn" id="ef-cancel" type="button">Cancelar</button>
        <button class="btn btn-primary" id="ef-save" type="button">${isNew?"Crear":"Guardar cambios"}</button>`,
      onMount(root){
        const form = root.querySelector("#entity-form");
        root.querySelectorAll(".color-swatches").forEach(sw=>{
          sw.addEventListener("click", e=>{
            const b = e.target.closest("[data-color]"); if(!b) return;
            sw.dataset.value = b.dataset.color;
            sw.querySelectorAll(".color-swatch").forEach(s=>s.classList.toggle("selected", s===b));
          });
        });
        if(config.onFormMount) config.onFormMount(root, record);
        root.querySelector("#ef-cancel").addEventListener("click", ModalManager.close);
        root.querySelector("#ef-save").addEventListener("click", ()=>{
          const values = readFormValues(form, fields);
          const errors = validateValues(values, fields, record, Store.data);
          const crossErrors = config.validateCross ? (config.validateCross(values, record) || {}) : {};
          Object.assign(errors, crossErrors);
          if(Object.keys(errors).length){ showFormErrors(form, errors); return; }
          let finalValues = values;
          if(config.beforeSave) finalValues = config.beforeSave(values, record, isNew) || values;
          if(isNew) Store.insert(config.key, finalValues);
          else Store.update(config.key, record.id, finalValues);
          ModalManager.close();
          ToastManager.show(isNew ? `${config.singular} creada correctamente.` : `${config.singular} actualizada.`, "success");
          if(config.afterSave) config.afterSave(finalValues, isNew);
          if(opts.onSaved) opts.onSaved();
        });
      }
    });
  }

  function confirmDelete(config, record, opts){
    opts = opts||{};
    const dependents = config.dependentsCount ? config.dependentsCount(record) : 0;
    const label = fieldValueLabel({type:"text"}, record[config.titleField]) || config.singular;
    ModalManager.open({
      title:`Eliminar ${config.singular.toLowerCase()}`,
      bodyHtml: `<p>¿Confirmas eliminar <strong>${Utils.escapeHtml(label)}</strong>? Esta acción no se puede deshacer.</p>
        ${dependents>0?`<p class="pill warning">Hay ${dependents} registro(s) relacionados que también podrían verse afectados.</p>`:""}
        <div class="field" style="margin-top:12px"><label for="del-confirm-text">Escribe ELIMINAR para confirmar</label><input type="text" id="del-confirm-text" data-autofocus></div>`,
      footerHtml:`<button class="btn" id="del-cancel">Cancelar</button><button class="btn btn-danger" id="del-ok">Eliminar</button>`,
      onMount(root){
        root.querySelector("#del-cancel").addEventListener("click", ModalManager.close);
        root.querySelector("#del-ok").addEventListener("click", async ()=>{
          const txt = root.querySelector("#del-confirm-text").value.trim().toUpperCase();
          if(txt!=="ELIMINAR"){ ToastManager.show('Escribe "ELIMINAR" para confirmar.', "warning"); return; }
          if(opts.requirePin){ const ok = await AuthService.verifyPinPrompt(); if(!ok) return; }
          Store.backupSnapshot("antes de eliminar "+config.key);
          Store.remove(config.key, record.id);
          ModalManager.close();
          ToastManager.show(`${config.singular} eliminada.`, "success");
          if(opts.onDeleted) opts.onDeleted();
        });
      }
    });
  }

  function emptyStateHtml(title, msg, actionLabel){
    return `<div class="empty-state">${Icons.empty}<h3>${Utils.escapeHtml(title)}</h3><p>${Utils.escapeHtml(msg)}</p>
      ${actionLabel?`<button class="btn btn-primary" data-empty-action="1">${Utils.escapeHtml(actionLabel)}</button>`:""}</div>`;
  }

  function renderList(container, config, opts){
    opts = opts || {};
    const viewKey = "listview_"+config.key;
    let mode = sessionStorage.getItem(viewKey) || "table";
    let search = "";
    const activeFilters = {};

    function getRecords(){
      let recs = Store.list(config.key).slice();
      if(config.scopeFilter) recs = recs.filter(config.scopeFilter);
      if(opts.extraFilter) recs = recs.filter(opts.extraFilter);
      if(search){
        const s = search.toLowerCase();
        recs = recs.filter(r => (config.searchFields||[config.titleField]).some(f => String(r[f]||"").toLowerCase().includes(s)));
      }
      Object.keys(activeFilters).forEach(k=>{
        const val = activeFilters[k];
        if(val==="") return;
        const filterDef = (config.filters||[]).find(f=>f.key===k);
        recs = recs.filter(r => filterDef.matches ? filterDef.matches(r,val) : String(r[k])===String(val));
      });
      if(config.sortFn) recs.sort(config.sortFn);
      return recs;
    }

    function statusPillClass(status){
      const map = config.statusColors || {};
      return map[status] || "neutral";
    }

    function draw(){
      const recs = getRecords();
      const cols = (config.columns || config.fields.filter(f=>f.showInList)).slice();
      container.innerHTML = `
        <div class="card-header">
          <div><h2 style="margin:0">${config.plural}</h2>${config.subtitle?`<p class="text-sec text-sm" style="margin:4px 0 0">${config.subtitle}</p>`:""}</div>
          <div class="btn-group">
            ${config.csvExport?`<button class="btn btn-secondary btn-sm" id="btn-export-csv">${Icons.download} CSV</button>`:""}
            ${opts.printKey?`<button class="btn btn-secondary btn-sm" id="btn-print-list">${Icons.print} Imprimir</button>`:""}
            ${config.allowCreate!==false?`<button class="btn btn-primary btn-sm" id="btn-new-record">${Icons.plus} Nuevo</button>`:""}
          </div>
        </div>
        <div class="filters-bar" id="filters-bar">
          <div class="field"><label for="search-box">Buscar</label><input type="text" id="search-box" placeholder="Buscar ${config.plural.toLowerCase()}..." value="${Utils.escapeHtml(search)}"></div>
          ${(config.filters||[]).map(f=>`<div class="field"><label for="filt_${f.key}">${f.label}</label>
            <select id="filt_${f.key}" data-filter-key="${f.key}"><option value="">Todos</option>${(typeof f.optionsSource==="function"?f.optionsSource():f.options).map(o=>`<option value="${Utils.escapeHtml(o.value)}" ${activeFilters[f.key]===o.value?"selected":""}>${Utils.escapeHtml(o.label)}</option>`).join("")}</select></div>`).join("")}
          <div class="view-toggle no-print"><button data-mode="table" class="${mode==='table'?'active':''}" aria-label="Vista de tabla">☰</button><button data-mode="cards" class="${mode==='cards'?'active':''}" aria-label="Vista de tarjetas">▦</button></div>
        </div>
        <button class="btn btn-secondary filters-toggle-mobile" id="btn-toggle-filters">${Icons.filter} Filtros</button>
        <div id="records-region"></div>
      `;
      const region = container.querySelector("#records-region");
      if(!recs.length){
        region.innerHTML = emptyStateHtml(config.emptyTitle||`Aún no hay ${config.plural.toLowerCase()}`, config.emptyMessage||"Crea el primer registro para comenzar.", config.allowCreate!==false?`Crear ${config.singular.toLowerCase()}`:null);
        const act = region.querySelector("[data-empty-action]");
        if(act) act.addEventListener("click", ()=>openForm(config, null, {onSaved:draw}));
      } else {
        region.innerHTML = `
          <div class="table-wrap ${mode==='cards'?'hide':''}">
            <table><thead><tr>${cols.map(c=>`<th>${Utils.escapeHtml(c.label)}</th>`).join("")}<th class="no-print">Acciones</th></tr></thead>
            <tbody>${recs.map(r=>`<tr>${cols.map(c=>`<td>${c.render?c.render(r):(c.key==='__status'?`<span class="pill ${statusPillClass(r[config.statusField])}">${Utils.escapeHtml(r[config.statusField]||"")}</span>`:(c.key==='__color'?`<span class="dot" style="background:${r[config.colorField]||'#999'}"></span>`:Utils.escapeHtml(fieldValueLabel(c, r[c.key]))))}</td>`).join("")}
              <td class="no-print"><div class="row-actions">
                ${config.extraActions?config.extraActions(r).map(a=>`<button class="btn btn-icon btn-sm btn-ghost" data-act="${a.key}" data-id="${r.id}" title="${Utils.escapeHtml(a.label)}" aria-label="${Utils.escapeHtml(a.label)}">${a.icon}</button>`).join(""):""}
                <button class="btn btn-icon btn-sm btn-ghost" data-act="edit" data-id="${r.id}" title="Editar" aria-label="Editar">${Icons.edit}</button>
                <button class="btn btn-icon btn-sm btn-ghost" data-act="delete" data-id="${r.id}" title="Eliminar" aria-label="Eliminar">${Icons.trash}</button>
              </div></td></tr>`).join("")}</tbody></table>
          </div>
          <div class="card-list ${mode==='cards'?'show':''}">
            ${recs.map(r=>`<div class="record-card">
              <div class="rc-title">${r[config.colorField]?`<span class="dot" style="background:${r[config.colorField]}"></span> `:""}${Utils.escapeHtml(r[config.titleField]||"(sin nombre)")}</div>
              <div class="rc-meta">${(config.cardSubtitleFields||[]).map(k=>fieldValueLabel(config.fields.find(f=>f.key===k)||{type:"text"}, r[k])).filter(Boolean).join(" · ")}</div>
              ${config.statusField?`<span class="pill ${statusPillClass(r[config.statusField])}">${Utils.escapeHtml(r[config.statusField]||"")}</span>`:""}
              <div class="row-actions" style="margin-top:10px">
                ${config.extraActions?config.extraActions(r).map(a=>`<button class="btn btn-sm btn-ghost" data-act="${a.key}" data-id="${r.id}">${a.icon} ${a.label}</button>`).join(""):""}
                <button class="btn btn-sm btn-ghost" data-act="edit" data-id="${r.id}">${Icons.edit} Editar</button>
                <button class="btn btn-sm btn-ghost" data-act="delete" data-id="${r.id}">${Icons.trash} Eliminar</button>
              </div></div>`).join("")}
          </div>`;
      }
      // wire events
      const newBtn = container.querySelector("#btn-new-record");
      if(newBtn) newBtn.addEventListener("click", ()=>openForm(config, null, {onSaved:draw}));
      const csvBtn = container.querySelector("#btn-export-csv");
      if(csvBtn) csvBtn.addEventListener("click", ()=>ExportService.exportEntityCSV(config, recs));
      const printBtn = container.querySelector("#btn-print-list");
      if(printBtn) printBtn.addEventListener("click", ()=>PrintService.printList(config, recs, opts.printKey));
      container.querySelector("#search-box").addEventListener("input", Utils.debounce(e=>{ search=e.target.value; draw(); },250));
      container.querySelectorAll("[data-filter-key]").forEach(sel=>sel.addEventListener("change", e=>{ activeFilters[e.target.dataset.filterKey]=e.target.value; draw(); }));
      container.querySelectorAll(".view-toggle button").forEach(b=>b.addEventListener("click", ()=>{ mode=b.dataset.mode; sessionStorage.setItem(viewKey, mode); draw(); }));
      const toggleFiltersBtn = container.querySelector("#btn-toggle-filters");
      if(toggleFiltersBtn) toggleFiltersBtn.addEventListener("click", ()=>container.querySelector("#filters-bar").classList.toggle("open"));
      region.addEventListener("click", (e)=>{
        const btn = e.target.closest("[data-act]"); if(!btn) return;
        const rec = Store.get(config.key, btn.dataset.id);
        if(!rec) return;
        const act = btn.dataset.act;
        if(act==="edit") openForm(config, rec, {onSaved:draw});
        else if(act==="delete") confirmDelete(config, rec, {onDeleted:draw, requirePin: config.protectedDelete});
        else if(config.extraActions){
          const def = config.extraActions(rec).find(a=>a.key===act);
          if(def) def.handler(rec, draw);
        }
      });
    }
    draw();
    return {refresh:draw};
  }

  return {renderList, renderFieldInput, readFormValues, validateValues, showFormErrors, openForm, confirmDelete, emptyStateHtml, fieldValueLabel};
})();

/* ===================== SchoolYearService (Ciclos y periodos) ===================== */
const SchoolYearService = (() => {
  const DIAS_SEMANA = [{value:"1",label:"Lunes"},{value:"2",label:"Martes"},{value:"3",label:"Miércoles"},{value:"4",label:"Jueves"},{value:"5",label:"Viernes"},{value:"6",label:"Sábado"},{value:"0",label:"Domingo"}];
  function list(){ return Store.list("schoolYears").slice().sort((a,b)=>(b.startDate||"").localeCompare(a.startDate||"")); }
  function get(id){ return Store.get("schoolYears", id); }
  function activeYear(){ return Store.data.settings.activeSchoolYearId ? get(Store.data.settings.activeSchoolYearId) : null; }
  function activePeriod(){ return Store.data.settings.activePeriodId ? Store.get("terms", Store.data.settings.activePeriodId) : null; }
  function termsOf(yearId){ return Store.list("terms").filter(t=>t.schoolYearId===yearId); }
  function holidaysOf(yearId){ return Store.list("holidays").filter(h=>h.schoolYearId===yearId); }

  function create(data, termNames){
    const year = Store.insert("schoolYears", {
      name:data.name, startDate:data.startDate, endDate:data.endDate,
      workingDays: data.workingDays||["1","2","3","4","5"], status:"proximo",
      periodCount: data.periodCount||3, archivedAt:null
    });
    (termNames && termNames.length ? termNames : defaultTermNames(data.periodCount||3)).forEach((name,i)=>{
      Store.insert("terms", {schoolYearId:year.id, name, order:i+1, startDate:"", endDate:""});
    });
    if(!Store.data.settings.activeSchoolYearId){ setActive(year.id); }
    return year;
  }
  function defaultTermNames(n){
    if(n===2) return ["Primer semestre","Segundo semestre"];
    if(n===3) return ["Primer trimestre","Segundo trimestre","Tercer trimestre"];
    if(n===4) return ["Primer bimestre","Segundo bimestre","Tercer bimestre","Cuarto bimestre"];
    return Array.from({length:n}).map((_,i)=>`Periodo ${i+1}`);
  }
  function setActive(id){
    const others = list().filter(y=>y.status==="activo" && y.id!==id);
    Store.list("schoolYears").forEach(y=>{ if(y.id===id) y.status="activo"; else if(y.status==="activo") y.status="proximo"; });
    Store.data.settings.activeSchoolYearId = id;
    const firstTerm = termsOf(id)[0];
    Store.data.settings.activePeriodId = firstTerm ? firstTerm.id : null;
    Store.save(true);
    return others.length>0;
  }
  function close(id){ Store.update("schoolYears", id, {status:"cerrado"}); }
  function archive(id){ Store.update("schoolYears", id, {status:"archivado", archivedAt:Utils.nowISO()}); }
  function duplicate(id){
    const y = get(id); if(!y) return null;
    const copy = Store.insert("schoolYears", {name:y.name+" (copia)", startDate:"", endDate:"", workingDays:y.workingDays, status:"proximo", periodCount:y.periodCount, archivedAt:null});
    termsOf(id).forEach(t=>Store.insert("terms", {schoolYearId:copy.id, name:t.name, order:t.order, startDate:"", endDate:""}));
    return copy;
  }
  function relatedCount(id){
    return Store.list("groups").filter(g=>g.schoolYearId===id).length
      + Store.list("events").filter(e=>e.schoolYearId===id).length;
  }
  function remove(id){
    Store.backupSnapshot("antes de eliminar ciclo");
    Store.remove("terms", null); // noop guard
    Store.data.terms = Store.data.terms.filter(t=>t.schoolYearId!==id);
    Store.data.holidays = Store.data.holidays.filter(h=>h.schoolYearId!==id);
    Store.remove("schoolYears", id);
    if(Store.data.settings.activeSchoolYearId===id){ Store.data.settings.activeSchoolYearId=null; Store.data.settings.activePeriodId=null; Store.save(true); }
  }
  function addTerm(yearId, name){ return Store.insert("terms", {schoolYearId:yearId, name, order:termsOf(yearId).length+1, startDate:"", endDate:""}); }
  function updateTerm(id, patch){ return Store.update("terms", id, patch); }
  function removeTerm(id){ Store.remove("terms", id); }
  function addHoliday(yearId, data){ return Store.insert("holidays", {schoolYearId:yearId, ...data}); }
  function removeHoliday(id){ Store.remove("holidays", id); }

  function statusLabel(s){ return {proximo:"Próximo", activo:"Activo", cerrado:"Cerrado", archivado:"Archivado"}[s]||s; }
  function statusPill(s){ return {proximo:"neutral", activo:"success", cerrado:"warning", archivado:"neutral"}[s]||"neutral"; }

  return {DIAS_SEMANA, list, get, activeYear, activePeriod, termsOf, holidaysOf, create, defaultTermNames, setActive, close, archive, duplicate, relatedCount, remove, addTerm, updateTerm, removeTerm, addHoliday, removeHoliday, statusLabel, statusPill};
})();

/* ===================== Privacy Gate ===================== */
const PrivacyGate = (() => {
  function needed(){ return !Store.data.settings.privacyAcknowledged; }
  function render(onDone){

      onDone();
    });
  }
  return {needed, render};
})();

/* ===================== Onboarding ===================== */

        </div>
      </div>`;
  }

  function goto(n){ step = n; render(); }

    if(step===1) return renderStep1();

    if(step===8) return renderStep8();
    if(step===9) return renderStep9();

  function renderStep1(){
    frame(`
      <h1 style="font-size:1.4rem;margin:8px 0 6px">Bienvenido a Planner Digital Académico 2026</h1>
      <p class="text-sec">Organiza tu ciclo escolar, planea tus clases y documenta el progreso desde un solo lugar.</p>
    `, `<button class="btn btn-secondary btn-block" id="ob-demo">Probar con datos de ejemplo</button>
        <button class="btn btn-primary btn-block" id="ob-start">Configurar mi espacio</button>`);

      DemoDataService.load();

      Store.data.settings.onboardingCompleted = true;

      <ul class="text-sm text-sec">
        <li>Crea respaldos periódicos desde Configuración → Respaldos.</li>
        <li>Evita registrar datos sensibles que no sean necesarios.</li>
        <li>Esta app no sustituye un expediente institucional oficial.</li>
      </ul>
      <label class="checkbox-row" style="margin-top:10px">
        <input type="checkbox" id="ob-privacy-check">

      </label>
    `, `<button class="btn" id="ob-back">Atrás</button><button class="btn btn-primary" id="ob-next" disabled>Continuar</button>`);

    check.addEventListener("change", ()=>{ next.disabled = !check.checked; });

        <div class="field full"><label for="ob-name">Nombre o apodo</label><input type="text" id="ob-name" value="${Utils.escapeHtml(wiz.profile.name)}" placeholder="Ej. Profe Mariana"></div>

      root().querySelector("#ob-pin-confirm-field").hidden = !pinEnable.checked;
    });
    root().querySelector("#ob-back").addEventListener("click", ()=>{ collectStep3(false); goto(2); });
    root().querySelector("#ob-next").addEventListener("click", ()=>{
      if(!collectStep3(true)) return;
      goto(4);
    });
  }
  function collectStep3(validate){
    wiz.profile.name = root().querySelector("#ob-name").value.trim();
    wiz.profile.level = root().querySelector("#ob-level").value;
    wiz.profile.country = root().querySelector("#ob-country").value.trim();
    wiz.profile.firstDayOfWeek = root().querySelector("#ob-firstday").value;
    wiz.profile.timeFormat = root().querySelector("#ob-timefmt").value;

    wiz.profile.pin = root().querySelector("#ob-pin").value.trim();
    wiz.profile.pinConfirm = root().querySelector("#ob-pin-confirm").value.trim();
    if(!validate) return true;
    if(wiz.profile.pinEnabled){
      if(!/^\d{4,8}$/.test(wiz.profile.pin)){ showErr("ob-pin-error","El PIN debe tener entre 4 y 8 dígitos numéricos."); return false; }
      if(wiz.profile.pin!==wiz.profile.pinConfirm){ showErr("ob-pin-error","Los PIN no coinciden."); return false; }

  function showErr(id,msg){ const el=root().querySelector("#"+id); if(el){el.hidden=false; el.textContent=msg;} }

  function renderStep4(){

        </div>
        <div class="field"><label for="ob-pcount">Número de periodos</label><select id="ob-pcount">${[2,3,4,5,6].map(n=>`<option value="${n}" ${wiz.year.periodCount===n?"selected":""}>${n}</option>`).join("")}</select></div>

      <div id="ob-periods-list">${wiz.year.periodNames.map((n,i)=>`<div class="field"><input type="text" data-pidx="${i}" value="${Utils.escapeHtml(n)}"></div>`).join("")}</div>

      <p class="error-msg" id="ob-year-error" hidden></p>
    `, `<button class="btn" id="ob-back">Atrás</button><button class="btn btn-primary" id="ob-next">Continuar</button>`);
    root().querySelectorAll("[data-wd]").forEach(cb=>cb.addEventListener("change",()=>{

        <label class="btn ${wiz.studentsChoice==='manual'?'btn-secondary':''}" style="cursor:pointer"><input type="radio" name="ob-sch" class="sr-only" value="manual" ${wiz.studentsChoice==='manual'?'checked':''}> Añadir manualmente</label>
        <label class="btn ${wiz.studentsChoice==='paste'?'btn-secondary':''}" style="cursor:pointer"><input type="radio" name="ob-sch" class="sr-only" value="paste" ${wiz.studentsChoice==='paste'?'checked':''}> Pegar lista</label>
        <label class="btn ${wiz.studentsChoice==='csv'?'btn-secondary':''}" style="cursor:pointer"><input type="radio" name="ob-sch" class="sr-only" value="csv" ${wiz.studentsChoice==='csv'?'checked':''}> Importar CSV</label>
      </div>
      <p class="hint">Si eliges "Pegar lista" o "Importar CSV" podrás hacerlo justo después de finalizar, una vez creado tu primer grupo.</p>
    `, `<button class="btn" id="ob-back">Atrás</button><button class="btn btn-primary" id="ob-next">Continuar</button>`);
    root().querySelectorAll('input[name="ob-sch"]').forEach(r=>r.addEventListener("change",()=>{ wiz.studentsChoice=r.value; renderStep8(); }));
    root().querySelector("#ob-back").addEventListener("click", ()=>goto(7));
    root().querySelector("#ob-next").addEventListener("click", ()=>{ commitAll(); goto(9); });
  }

  function commitAll(){
    Store.data.teacherProfile = {name:wiz.profile.name, level:wiz.profile.level, country:wiz.profile.country, timezone:wiz.profile.timezone};
    const s = Store.data.settings;
    s.firstDayOfWeek = Number(wiz.profile.firstDayOfWeek);
    s.timeFormat = wiz.profile.timeFormat;
    s.defaultScale = wiz.evaluation.scale;
    s.defaultDecimals = wiz.evaluation.decimals;
    s.defaultRounding = wiz.evaluation.rounding;
    Store.save(true);
    if(wiz.profile.pinEnabled && wiz.profile.pin){ AuthService.setPin(wiz.profile.pin); }
    const year = SchoolYearService.create(wiz.year, wiz.year.periodNames);
    SchoolYearService.setActive(year.id);
    const createdSubjects = wiz.subjects.filter(s=>s.name.trim()).map(s=>Store.insert("subjects", {name:s.name, code:s.code, color:s.color||"#3976D9", description:s.description||""}));
    wiz._createdSubjectIds = createdSubjects.map(s=>s.id);
    wiz._createdGroups = wiz.groups.filter(g=>g.name.trim()).map(g=>Store.insert("groups", {
      name:g.name, grade:g.grade, level:wiz.profile.level, schoolYearId:year.id,
      subjectIds:createdSubjects.map(s=>s.id), room:g.room, color:g.color||"#2CB7A3",
      estimatedStudents:g.estimatedStudents?Number(g.estimatedStudents):"", status:"activo", evaluationScheme:{}, notes:""
    }));
    const catDefs = wiz.evaluation.categories.filter(c=>c.name.trim());
    wiz._createdGroups.forEach(g=>{
      catDefs.forEach(c=>Store.insert("assessmentCategories", {groupId:g.id, name:c.name, weight:c.weight, color:c.color||"#3976D9", active:true}));
    });
    Store.data.settings.evalMinGrade = wiz.evaluation.minGrade;
    Store.data.settings.onboardingCompleted = true;
    Store.save(true);
  }

  function renderStep9(){
    const year = SchoolYearService.activeYear();
    frame(`
      <h2 style="font-size:1.15rem">Tu espacio está listo</h2>
      <div class="grid-cards">
        <div class="stat-tile"><div class="stat-num">${year?1:0}</div><div class="stat-label">Ciclo escolar</div></div>
        <div class="stat-tile tint-turquesa"><div class="stat-num">${Store.list("subjects").length}</div><div class="stat-label">Materias</div></div>
        <div class="stat-tile tint-coral"><div class="stat-num">${Store.list("groups").length}</div><div class="stat-label">Grupos</div></div>
      </div>
      <p class="text-sec" style="margin-top:14px">Puedes seguir personalizando todo desde Configuración cuando lo necesites.</p>
    `, `<button class="btn btn-secondary btn-block" id="ob-finish-plan">Crear primera planeación</button>
        <button class="btn btn-primary btn-block" id="ob-finish-dash">Ir al panel</button>`);
    root().querySelector("#ob-finish-dash").addEventListener("click", finish);
    root().querySelector("#ob-finish-plan").addEventListener("click", ()=>{ finish(); setTimeout(()=>{ Router.navigate("/planeaciones?nuevo=1"); },50); });
  }

  function finish(){
    root().hidden = true;
    root().innerHTML = "";
    App.startMainApp();
    if(wiz.studentsChoice==="paste" && wiz._createdGroups && wiz._createdGroups.length){
      setTimeout(()=>ImportService.openPasteListModal(wiz._createdGroups[0].id), 300);
    } else if(wiz.studentsChoice==="csv" && wiz._createdGroups && wiz._createdGroups.length){
      setTimeout(()=>ImportService.openCsvImportModal(wiz._createdGroups[0].id), 300);
    }
  }

  function start(){ step=1; render(); root().hidden=false; }
  return {needed, start};
})();
