<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --navy:#1B2A4A; --azul:#25406E; --turquesa:#1FA996; --turquesa-fuerte:#0E7D70;
  --ambar:#F2C14E; --ink:#1B2432; --ink-soft:#5B6779; --bg:#F5F7FA; --borde:#DCE3EC;
  --grad-marca:linear-gradient(120deg,#1B2A4A 0%,#25406E 55%,#1FA996 100%);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1080px;height:1080px;overflow:hidden;font-family:'Inter',sans-serif;}
.canvas{width:1080px;height:1080px;position:relative;background:var(--grad-marca); display:flex; align-items:center; justify-content:center;}
.logo{position:absolute; top:60px; left:64px; display:flex; align-items:center; gap:12px;}
.badge{width:42px;height:42px;border-radius:11px;background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;font-size:20px;}
.wordmark{font-family:'Sora',sans-serif;font-weight:700;font-size:1.25rem;color:#fff;}

.headline{position:absolute; top:150px; left:90px; right:90px; text-align:center; font-family:'Sora',sans-serif; font-size:46px; line-height:1.25; font-weight:800; color:#fff;}

.tarjeta{position:absolute; top:330px; left:190px; width:700px; height:640px; background:#fff; border-radius:24px; box-shadow:0 30px 70px rgba(0,0,0,0.3); display:flex; flex-direction:column; align-items:center; padding-top:48px;}
.pildora{background:#EAF6F4; color:var(--turquesa-fuerte); font-size:15px; letter-spacing:2px; text-transform:uppercase; font-weight:700; padding:8px 20px; border-radius:20px;}
.precio{font-family:'Sora',sans-serif; font-size:96px; font-weight:800; color:var(--navy); line-height:1; margin-top:28px; font-variant-numeric:tabular-nums;}
.precio sup{font-size:36px; font-weight:700; vertical-align:top; margin-right:4px;}
.precio .mxn{font-size:30px; font-weight:700; color:var(--ink-soft);}
.precio-nota{font-size:20px; color:var(--ink-soft); margin-top:10px; font-weight:600;}

.lista{margin-top:40px; display:flex; flex-direction:column; gap:16px; align-self:stretch; padding:0 56px;}
.item{display:flex; align-items:center; gap:12px; font-size:23px; color:var(--ink);}
.item .check{color:var(--turquesa-fuerte); font-weight:700; font-size:22px;}

.cta{margin-top:40px; background:var(--ambar); color:var(--navy); font-weight:700; font-size:25px; padding:20px 56px; border-radius:40px; box-shadow:0 14px 30px rgba(0,0,0,0.2);}
</style></head><body>
<div class="canvas">
  <div class="logo"><span class="badge">📘</span><span class="wordmark">Bookfluence Teachers</span></div>
  <div class="headline">El sistema que organiza<br>tu práctica docente.</div>
  <div class="tarjeta">
    <div class="pildora">Oferta de lanzamiento</div>
    <div class="precio"><sup>$</sup>344<span class="mxn"> MXN</span></div>
    <div class="precio-nota">IVA incluido · Pago único · Sin mensualidades</div>
    <div class="lista">
      <div class="item"><span class="check">✓</span>18 módulos integrados</div>
      <div class="item"><span class="check">✓</span>Manual incluido</div>
      <div class="item"><span class="check">✓</span>Actualizaciones futuras</div>
    </div>
    <div class="cta">Quiero mi copia</div>
  </div>
</div>
</body></html>
