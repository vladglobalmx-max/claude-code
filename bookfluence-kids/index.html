/* ===================== PrintService ===================== */
const PrintService = (function(){
  function encabezado(titulo, perfil){
    return `<div class="hoja-impresion">
      <h1 style="color:#25335B;">${SanitizationService.escapeHtml(titulo)}</h1>
      <p style="color:#5A6478;">${perfil?SanitizationService.escapeHtml(perfil.name)+" · ":""}${Utils.formatFechaLarga(Utils.todayISO())}</p>
      <hr style="border:none;border-top:1px solid #ccc;margin:10px 0;">
    </div>`;
  }
  function pie(){
    return `<p class="marca-impresion">Bookfluence Kids — Mi Día Genial</p>`;
  }
  function imprimirHTML(html){
    const zona = document.getElementById("zona-impresion");
    zona.innerHTML = html + pie();
    window.print();
  }

  function planDiario(profileId, fecha){
    const perfil = ProfileService.obtener(profileId);
    const tareas = TaskService.listar(profileId, {fecha});
    const eventos = CalendarService.listar(profileId,{desde:fecha,hasta:fecha});
    imprimirHTML(encabezado("Plan del día", perfil) + `
      <p><strong>Fecha:</strong> ${Utils.formatFechaLarga(fecha)}</p>
      <h3>Tareas y actividades</h3>
      <ul>${tareas.map(t=>`<li>${SanitizationService.escapeHtml(t.title)} — ${TareasView.etiquetaEstadoTarea(t.status)}</li>`).join("") || "<li>Sin tareas registradas.</li>"}</ul>
      <h3>Eventos</h3>
      <ul>${eventos.map(e=>`<li>${SanitizationService.escapeHtml(e.title)}${e.time?" a las "+e.time:""}</li>`).join("") || "<li>Sin eventos.</li>"}</ul>`);
  }
  function planSemanal(profileId, inicioSemana){
    const perfil = ProfileService.obtener(profileId);
    const dias = Array.from({length:7}).map((_,i)=>Utils.addDays(inicioSemana,i));
    imprimirHTML(encabezado("Plan semanal", perfil) + dias.map(d=>{
      const tareas = TaskService.listar(profileId,{fecha:d});
      const eventos = CalendarService.listar(profileId,{desde:d,hasta:d});
      return `<div class="hoja-impresion"><h3>${Utils.formatFechaLarga(d)}</h3>
        <ul>${[...tareas.map(t=>t.title), ...eventos.map(e=>e.title)].map(t=>`<li>${SanitizationService.escapeHtml(t)}</li>`).join("") || "<li>Sin actividades.</li>"}</ul></div>`;
    }).join(""));
  }
  function calendarioMensual(profileId, year, month){
    const perfil = ProfileService.obtener(profileId);
    const eventos = CalendarService.listar(profileId).filter(e=>{ const d=Utils.isoToDate(e.date); return d && d.getFullYear()===year && d.getMonth()===month; });
    imprimirHTML(encabezado("Calendario mensual", perfil) + `
      <ul>${eventos.map(e=>`<li>${Utils.formatFechaCorta(e.date)} — ${SanitizationService.escapeHtml(e.title)}</li>`).join("") || "<li>Sin eventos este mes.</li>"}</ul>`);
  }
  function listaTareas(profileId){
    const perfil = ProfileService.obtener(profileId);
    const tareas = TaskService.listar(profileId);
    imprimirHTML(encabezado("Lista de tareas", perfil) + `
      <ul>${tareas.map(t=>`<li>${SanitizationService.escapeHtml(t.title)} — ${t.dueDate?Utils.formatFechaCorta(t.dueDate):"sin fecha"} — ${TareasView.etiquetaEstadoTarea(t.status)}</li>`).join("") || "<li>Sin tareas.</li>"}</ul>`);
  }
  function planEstudio(profileId){
    const perfil = ProfileService.obtener(profileId);
    const sesiones = StudyService.listar(profileId);
    imprimirHTML(encabezado("Plan de estudio", perfil) + `
      <ul>${sesiones.map(s=>`<li>${SanitizationService.escapeHtml(s.topic)} — ${s.plannedMinutes} min planeados — ${s.status}</li>`).join("") || "<li>Sin sesiones registradas.</li>"}</ul>`);
  }
  function registroLectura(profileId){
    const perfil = ProfileService.obtener(profileId);
    const sesiones = ReadingService.listarSesiones(profileId);
    imprimirHTML(encabezado("Registro de lectura", perfil) + `
      <ul>${sesiones.map(s=>`<li>${Utils.formatFechaCorta(s.date)} — ${s.minutes} min — págs. ${s.startPage} a ${s.endPage}</li>`).join("") || "<li>Sin sesiones de lectura.</li>"}</ul>`);
  }
  function resenaLibro(bookId){
    const r = ReadingService.resenaDeLibro(bookId);
    const b = ReadingService.obtenerLibro(bookId);
    const perfil = ProfileService.obtener(b.profileId);
    if(!r){ ToastManager.mostrar("Este libro todavía no tiene una reseña.","info"); return; }
    imprimirHTML(encabezado("Reseña de libro", perfil) + `
      <h3>${SanitizationService.escapeHtml(b.title)}</h3>
      <p><strong>Personaje favorito:</strong> ${SanitizationService.escapeHtml(r.favoriteCharacter)}</p>
      <p><strong>Parte favorita:</strong> ${SanitizationService.escapeHtml(r.favoritePart)}</p>
      <p><strong>Aprendí:</strong> ${SanitizationService.escapeHtml(r.learned)}</p>
      <p><strong>Palabra nueva:</strong> ${SanitizationService.escapeHtml(r.newWord)}</p>
      <p><strong>Calificación:</strong> ${"★".repeat(r.rating)}</p>`);
  }
  function hojaMetas(profileId){
    const perfil = ProfileService.obtener(profileId);
    const metas = GoalService.listar(profileId);
    imprimirHTML(encabezado("Hoja de metas", perfil) + metas.map(g=>`
      <div class="hoja-impresion"><h3>${SanitizationService.escapeHtml(g.name)}</h3>
      <p>${SanitizationService.escapeHtml(g.reason)}</p>
      <ul>${GoalService.pasosDe(g.id).map(p=>`<li>[${p.done?"X":" "}] ${SanitizationService.escapeHtml(p.text)}</li>`).join("")}</ul></div>`).join("") || "<p>Sin metas registradas.</p>");
  }
  function gratitud(profileId){
    const perfil = ProfileService.obtener(profileId);
    const registros = EmotionService.listarGratitud(profileId).slice(0,14);
    imprimirHTML(encabezado("Gratitud", perfil) + registros.map(g=>`
      <div class="hoja-impresion"><h3>${Utils.formatFechaCorta(g.date)}</h3><ul>${(g.threeThings||[]).map(t=>`<li>${SanitizationService.escapeHtml(t)}</li>`).join("")}</ul></div>`).join("") || "<p>Sin registros.</p>");
  }
  function reporteSemanal(profileId, inicioSemana){
    const perfil = ProfileService.obtener(profileId);
    const fin = Utils.addDays(inicioSemana,6);
    const tareas = TaskService.listar(profileId).filter(t=>t.dueDate>=inicioSemana&&t.dueDate<=fin);
    const terminadas = tareas.filter(t=>t.status==="terminada");
    const pendientes = tareas.filter(t=>t.status!=="terminada");
    const sesiones = StudyService.listar(profileId).filter(s=>s.status==="terminada" && s.endedAt && s.endedAt.slice(0,10)>=inicioSemana && s.endedAt.slice(0,10)<=fin);
    const minLectura = ReadingService.minutosLeidosSemana(profileId, inicioSemana);
    const habitos = HabitService.listar(profileId);
    const metas = GoalService.listar(profileId,"activa");
    const estrellas = StarService.saldo(profileId);
    imprimirHTML(encabezado("Reporte semanal", perfil) + `
      <p><strong>Periodo:</strong> ${Utils.formatFechaCorta(inicioSemana)} al ${Utils.formatFechaCorta(fin)}</p>
      <h3>Actividades terminadas (${terminadas.length})</h3><ul>${terminadas.map(t=>`<li>${SanitizationService.escapeHtml(t.title)}</li>`).join("")||"<li>Ninguna esta semana.</li>"}</ul>
      <h3>Tareas pendientes (${pendientes.length})</h3><ul>${pendientes.map(t=>`<li>${SanitizationService.escapeHtml(t.title)}</li>`).join("")||"<li>Ninguna.</li>"}</ul>
      <h3>Sesiones de estudio terminadas</h3><p>${sesiones.length}</p>
      <h3>Minutos de lectura</h3><p>${minLectura}</p>
      <h3>Hábitos activos</h3><ul>${habitos.map(h=>`<li>${SanitizationService.escapeHtml(h.name)} — ${HabitService.porcentajeCumplimiento(h.id,inicioSemana,fin)}% cumplido</li>`).join("")||"<li>Ninguno.</li>"}</ul>
      <h3>Metas activas</h3><ul>${metas.map(g=>`<li>${SanitizationService.escapeHtml(g.name)} — ${g.progress}%</li>`).join("")||"<li>Ninguna.</li>"}</ul>
      <h3>Estrellas disponibles</h3><p>${estrellas}</p>
      <h3>Conversación sugerida</h3><p>¿Qué fue lo que más disfrutaste esta semana? ¿En qué te gustaría que te ayudemos la próxima semana?</p>`);
  }
  function certificado(profileId, logro){
    const perfil = ProfileService.obtener(profileId);
    imprimirHTML(`<div class="hoja-impresion centrado" style="border:6px solid #F6C84C;padding:40px;">
      <p style="letter-spacing:2px;color:#5A6478;">CERTIFICADO DE LOGRO</p>
      <h1 style="color:#25335B;margin-top:10px;">${SanitizationService.escapeHtml(perfil.name)}</h1>
      <p style="margin-top:16px;">Por: ${SanitizationService.escapeHtml(logro||"su esfuerzo y dedicación")}</p>
      <p style="margin-top:30px;color:#5A6478;">${Utils.formatFechaLarga(Utils.todayISO())}</p>
    </div>`);
  }
  return { planDiario, planSemanal, calendarioMensual, listaTareas, planEstudio, registroLectura, resenaLibro, hojaMetas, gratitud, reporteSemanal, certificado };
})();

/* ===================== ReportService ===================== */
const ReportService = (function(){
  const TIPOS = [
    {v:"diario", l:"Plan diario"}, {v:"semanal", l:"Plan semanal"}, {v:"mensual", l:"Calendario mensual"},
    {v:"tareas", l:"Lista de tareas"}, {v:"estudio", l:"Plan de estudio"}, {v:"lectura", l:"Registro de lectura"},
    {v:"metas", l:"Hoja de metas"}, {v:"gratitud", l:"Gratitud"}, {v:"semanalcompleto", l:"Reporte semanal completo"},
    {v:"certificado", l:"Certificado de logro"}
  ];
  function renderSelector(){
    const perfiles = ProfileService.listar();
    return `<div class="tarjeta">
      <h3>Generar un reporte</h3>
      <div class="campo mt-8"><label for="reporte-perfil">Perfil</label>
        <select id="reporte-perfil">${perfiles.map(p=>`<option value="${p.id}">${SanitizationService.escapeHtml(p.name)}</option>`).join("")}</select>
      </div>
      <div class="grupo-opciones mt-8">${TIPOS.map(t=>`<button type="button" class="btn btn-chico btn-fantasma" data-generar-reporte="${t.v}">${icono("printer")} ${t.l}</button>`).join("")}</div>
      <p class="texto-secundario mt-8">Para guardar como PDF, usa "Guardar como PDF" en la ventana de impresión de tu navegador.</p>
    </div>`;
  }
  return { renderSelector, TIPOS };
})();

Acciones["data-generar-reporte"] = function(el){
  const tipo = el.getAttribute("data-generar-reporte");
  const select = document.getElementById("reporte-perfil");
  const profileId = select ? select.value : (ProfileService.activo()||{}).id;
  if(!profileId){ ToastManager.mostrar("Elige un perfil primero.","error"); return; }
  const hoy = Utils.todayISO();
  const inicioSemana = Utils.startOfWeek(hoy, Store.obtener().appSettings.weekStartsMonday);
  const d = new Date();
  switch(tipo){
    case "diario": PrintService.planDiario(profileId, hoy); break;
    case "semanal": PrintService.planSemanal(profileId, inicioSemana); break;
    case "mensual": PrintService.calendarioMensual(profileId, d.getFullYear(), d.getMonth()); break;
    case "tareas": PrintService.listaTareas(profileId); break;
    case "estudio": PrintService.planEstudio(profileId); break;
    case "lectura": PrintService.registroLectura(profileId); break;
    case "metas": PrintService.hojaMetas(profileId); break;
    case "gratitud": PrintService.gratitud(profileId); break;
    case "semanalcompleto": PrintService.reporteSemanal(profileId, inicioSemana); break;
    case "certificado": PrintService.certificado(profileId, "su esfuerzo y dedicación esta semana"); break;
  }
};
Acciones["data-accion-imprimir"] = function(el){
  const tipo = el.getAttribute("data-accion-imprimir");
  const perfil = ProfileService.activo();
  if(!perfil) return;
  if(tipo==="semana") PrintService.planSemanal(perfil.id, Utils.startOfWeek(Utils.todayISO(), Store.obtener().appSettings.weekStartsMonday));
};

/* ===================== DemoData ===================== */
const DemoData = (function(){
  function cargarParaPerfil(profileId){
    const datos = Store.obtener();
    const perfil = ProfileService.obtener(profileId);
    if(!perfil) return;
    perfil.preferences = perfil.preferences || {};
    perfil.preferences.isDemo = true;

    const materias = SubjectService.listar(profileId, true);
    const matMate = materias.find(m=>m.name==="Matemáticas") || materias[0];
    const matEsp = materias.find(m=>m.name==="Español") || materias[0];
    const matCiencias = materias.find(m=>m.name==="Ciencias") || materias[0];

    const t1 = TaskService.crear(profileId, { title:"Resolver ejercicios de matemáticas", subjectId: matMate?matMate.id:"", dueDate: Utils.todayISO(), priority:"alta", difficulty:"concentrarme", estimatedMinutes:25 });
    TaskService.crear(profileId, { title:"Leer 20 minutos", subjectId: matEsp?matEsp.id:"", dueDate: Utils.todayISO(), priority:"media", difficulty:"facil", estimatedMinutes:20 });
    const t3 = TaskService.crear(profileId, { title:"Preparar exposición de ciencias", subjectId: matCiencias?matCiencias.id:"", dueDate: Utils.addDays(Utils.todayISO(),5), priority:"alta", difficulty:"dificil", estimatedMinutes:40 });
    TaskService.aplicarPlantilla(t3.id, "exposicion");

    const libro = ReadingService.crearLibro(profileId, { title:"El jardín secreto", author:"Autora ejemplo", genre:"Aventura", pages:180, status:"leyendo" });
    ReadingService.registrarSesion(profileId, libro.id, { date: Utils.todayISO(), minutes:20, startPage:0, endPage:15, comment:"Buen inicio." });

    GoalService.crear(profileId, { name:"Terminar un libro este mes", category:"Lectura", reason:"Quiero descubrir el final de la historia.",
      startDate: Utils.todayISO(), targetDate: Utils.addDays(Utils.todayISO(),30),
      steps:["Leer 15 minutos cada día","Comentar el libro con la familia","Escribir una reseña al terminar"] });

    CalendarService.crear(profileId, { title:"Examen de ciencias", date: Utils.addDays(Utils.todayISO(),6), type:"examen", description:"Repasar el sistema solar." });

    EmotionService.registrarEmocion(profileId, Utils.todayISO(), "feliz", "");
    EmotionService.registrarGratitud(profileId, Utils.todayISO(), { threeThings:["Mi familia","Un buen libro","El sol de hoy"], goodThing:"Jugué con mi mejor amigo.", helper:"Mi mamá", kindThing:"Ayudé a mi hermano.", learned:"Aprendí sobre los planetas.", tomorrowWant:"Terminar mi tarea temprano." });

    Store.guardar(true);
  }
  function eliminarDemo(profileId){
    ProfileService.eliminarDefinitivo(profileId);
  }
  return { cargarParaPerfil, eliminarDemo };
})();
