<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Impulso Sticker Builder</title>
    <link rel="icon" href="data:," />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #e5e5e5;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        color: #1c1917;
      }
      /* Workspace ("Mis proyectos") — pantalla de aterrizaje, ver ADR-0014 */
      #workspace-screen {
        min-height: 100vh;
        box-sizing: border-box;
      }
      #workspace-container {
        height: 100%;
      }
      .workspace-screen {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px 20px 60px;
        box-sizing: border-box;
      }
      .workspace-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .workspace-header h1 {
        font-size: 1.4em;
        margin: 0;
      }
      .workspace-new-btn {
        font: inherit;
        padding: 8px 16px;
        cursor: pointer;
        border: none;
        background: #1c1917;
        color: #ffffff;
        border-radius: 6px;
      }
      .workspace-error {
        color: #b91c1c;
      }
      .workspace-empty {
        color: #57534e;
      }
      .workspace-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 16px;
      }
      .workspace-card {
        border: 1px solid #d6d3d1;
        border-radius: 8px;
        padding: 10px;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .workspace-card-thumbnail {
        width: 100%;
        height: 140px;
        object-fit: contain;
        background: #f5f5f4;
        border-radius: 4px;
        cursor: pointer;
      }
      .workspace-card-name-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .workspace-card-name {
        font-weight: 600;
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }
      .workspace-card-name-input {
        font: inherit;
        font-weight: 600;
        flex: 1;
        min-width: 0;
      }
      .workspace-card-rename {
        border: none;
        background: none;
        cursor: pointer;
        font-size: 0.9em;
        padding: 2px 4px;
      }
      .workspace-card-updated {
        font-size: 0.8em;
        color: #78716c;
      }
      .workspace-card-actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: auto;
      }
      .workspace-card-actions button {
        font: inherit;
        font-size: 0.85em;
        padding: 4px 8px;
        cursor: pointer;
        border: 1px solid #d6d3d1;
        background: #f5f5f4;
        border-radius: 4px;
      }
      .workspace-card-delete {
        color: #b91c1c;
      }

      #app {
        display: grid;
        grid-template-rows: auto auto 1fr;
        grid-template-columns: 1fr;
        height: 100vh;
      }

      /* Barra superior: proyecto / deshacer-rehacer / guardar-abrir / acciones */
      #top-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: #1c1917;
        color: #e5e5e5;
        flex-wrap: wrap;
      }
      #top-bar button {
        font: inherit;
        padding: 4px 10px;
        cursor: pointer;
        border: 1px solid #44403c;
        background: #292524;
        color: inherit;
        border-radius: 4px;
      }
      #top-bar button:disabled {
        cursor: not-allowed;
        opacity: 0.4;
      }
      #top-bar .divider {
        width: 1px;
        align-self: stretch;
        background: #44403c;
        margin: 0 4px;
      }
      #toolbar-status {
        margin-left: auto;
        font-size: 0.85em;
        color: #a8a29e;
      }

      /* Barra de herramientas: Texto/Imagen + Zoom */
      #tools-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        background: #f5f5f4;
        border-bottom: 1px solid #d6d3d1;
      }
      #tools-container,
      #zoom-container {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #zoom-container {
        margin-left: auto;
      }
      #tools-bar button {
        font: inherit;
        padding: 4px 10px;
        cursor: pointer;
        border: 1px solid #d6d3d1;
        background: #ffffff;
        border-radius: 4px;
      }
      .zoom-percentage {
        min-width: 3.5em;
        text-align: right;
        color: #57534e;
      }

      /* Cuerpo: capas/assets | canvas | inspector */
      #body {
        display: grid;
        grid-template-columns: 240px 1fr 280px;
        min-height: 0;
      }

      #sidebar-left {
        display: flex;
        flex-direction: column;
        min-height: 0;
        border-right: 1px solid #d6d3d1;
        background: #fafaf9;
      }
      .sidebar-tabs {
        display: flex;
        border-bottom: 1px solid #d6d3d1;
      }
      .sidebar-tab {
        flex: 1;
        font: inherit;
        padding: 8px;
        cursor: pointer;
        border: none;
        background: none;
        color: #57534e;
      }
      .sidebar-tab.active {
        color: #1c1917;
        font-weight: 600;
        box-shadow: inset 0 -2px 0 #1c1917;
      }

      #layers-panel,
      #assets-panel {
        overflow-y: auto;
        padding: 8px;
        flex: 1;
      }
      .layer-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 6px;
        border-radius: 4px;
        cursor: pointer;
        user-select: none;
      }
      .layer-row:hover {
        background: #e7e5e4;
      }
      .layer-row.selected {
        background: #dbeafe;
      }
      .layer-label {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .layer-expand {
        border: none;
        background: none;
        cursor: pointer;
        width: 1.2em;
      }
      .layer-visibility,
      .layer-lock {
        border: none;
        background: none;
        cursor: pointer;
      }

      .assets-upload {
        font: inherit;
        width: 100%;
        padding: 6px;
        margin-bottom: 8px;
        cursor: pointer;
        border: 1px solid #d6d3d1;
        border-radius: 4px;
        background: #ffffff;
      }
      .assets-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .asset-item {
        position: relative;
        border: 1px solid #d6d3d1;
        border-radius: 4px;
        padding: 4px;
        cursor: pointer;
        background: #ffffff;
        text-align: center;
      }
      .asset-item:hover {
        background: #e7e5e4;
      }
      .asset-thumbnail {
        display: block;
        width: 100%;
        height: 64px;
        object-fit: contain;
        background: #f5f5f4;
      }
      .asset-name {
        display: block;
        font-size: 0.8em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        margin-top: 4px;
      }
      .asset-delete {
        position: absolute;
        top: 2px;
        right: 2px;
        border: none;
        background: rgba(255, 255, 255, 0.8);
        border-radius: 3px;
        cursor: pointer;
      }

      #canvas-viewport {
        overflow: auto;
        background: #d6d3d1;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 32px;
      }
      #canvas-runtime {
        display: inline-block;
        background: #ffffff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
      }

      #inspector-panel {
        overflow-x: hidden;
        overflow-y: auto;
        background: #fafaf9;
        border-left: 1px solid #d6d3d1;
        padding: 12px;
        font-size: 13px;
        min-width: 0;
      }
      .inspector-section {
        /* Los <fieldset> tienen un `min-width: min-content` implícito en la
           mayoría de los navegadores que ignora `flex-shrink`/el ancho del
           contenedor — sin este reset, el contenido (ej. el <select> de
           Alineación) fuerza al panel completo a desbordarse. */
        min-width: 0;
        box-sizing: border-box;
        width: 100%;
        border: 1px solid #e7e5e4;
        border-radius: 8px;
        margin-bottom: 12px;
        padding: 4px 12px 12px;
        background: #ffffff;
      }
      .inspector-section legend {
        padding: 0 4px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #78716c;
      }
      .inspector-field {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 8px;
      }
      .inspector-field > span {
        flex: 0 0 56px;
        color: #57534e;
        font-size: 12px;
      }
      .inspector-field select,
      .inspector-field textarea,
      .inspector-field input[type="text"] {
        font: inherit;
        flex: 1;
        min-width: 0;
        box-sizing: border-box;
        padding: 5px 8px;
        border: 1px solid #d6d3d1;
        border-radius: 6px;
        background: #fafaf9;
        color: #1c1917;
      }
      .inspector-field textarea {
        resize: vertical;
        min-height: 48px;
      }
      .inspector-field input[type="color"] {
        flex: 1;
        min-width: 0;
        height: 30px;
        padding: 2px;
        border: 1px solid #d6d3d1;
        border-radius: 6px;
        background: #fafaf9;
        cursor: pointer;
      }
      .inspector-field select:focus,
      .inspector-field textarea:focus,
      .inspector-field input[type="text"]:focus {
        outline: none;
        border-color: #1c1917;
        background: #ffffff;
      }
      .inspector-number-wrapper {
        position: relative;
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
      }
      .inspector-number-input {
        font: inherit;
        width: 100%;
        box-sizing: border-box;
        padding: 5px 8px;
        border: 1px solid #d6d3d1;
        border-radius: 6px;
        background: #fafaf9;
        color: #1c1917;
      }
      .inspector-number-wrapper--with-unit .inspector-number-input {
        padding-right: 28px;
      }
      .inspector-number-input:focus {
        outline: none;
        border-color: #1c1917;
        background: #ffffff;
      }
      .inspector-unit {
        position: absolute;
        right: 8px;
        pointer-events: none;
        color: #a8a29e;
        font-size: 11px;
      }
      .inspector-number-input.inspector-field-invalid,
      .inspector-field input[type="text"].inspector-field-invalid {
        border-color: #dc2626;
        background: #fef2f2;
      }
      .inspector-empty {
        color: #78716c;
        padding: 12px 4px;
        font-size: 13px;
      }

      /* Diálogo de proyecto nuevo */
      .new-project-dialog-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        align-items: center;
        justify-content: center;
        z-index: 100;
      }
      .new-project-dialog {
        background: #ffffff;
        border-radius: 8px;
        padding: 20px;
        min-width: 420px;
        max-width: 560px;
      }
      .new-project-dialog-status {
        color: #57534e;
      }
      .new-project-dialog-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin: 12px 0;
        max-height: 320px;
        overflow-y: auto;
      }
      .new-project-card {
        position: relative;
        border: 2px solid #d6d3d1;
        border-radius: 6px;
        padding: 6px;
        cursor: pointer;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        min-height: 100px;
        justify-content: center;
      }
      .new-project-card:hover {
        background: #f5f5f4;
      }
      .new-project-card.selected {
        border-color: #1c1917;
      }
      .new-project-card-thumbnail {
        max-width: 100%;
        max-height: 70px;
        object-fit: contain;
      }
      .new-project-card-name {
        font-size: 0.85em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 100%;
      }
      .new-project-card-delete {
        position: absolute;
        top: 2px;
        right: 2px;
        border: none;
        background: rgba(255, 255, 255, 0.85);
        border-radius: 3px;
        cursor: pointer;
        font-size: 0.8em;
        line-height: 1;
        padding: 2px 4px;
      }
      .new-project-card-custom {
        border-style: dashed;
      }
      .new-project-dialog-custom-fields {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 12px;
      }
      .new-project-dialog-error {
        color: #b91c1c;
      }
      .new-project-dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .new-project-dialog-actions button {
        font: inherit;
        padding: 6px 14px;
        cursor: pointer;
        border-radius: 4px;
        border: 1px solid #d6d3d1;
      }
      .new-project-dialog-create {
        background: #1c1917;
        color: #ffffff;
        border-color: #1c1917;
      }

      /* Diálogo de exportación */
      .export-dialog-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        align-items: center;
        justify-content: center;
        z-index: 100;
      }
      .export-dialog {
        background: #ffffff;
        border-radius: 8px;
        padding: 20px;
        min-width: 320px;
      }
      .export-dialog-format,
      .export-dialog-background {
        display: flex;
        gap: 12px;
        margin: 10px 0;
      }
      .export-dialog-scale {
        display: flex;
        gap: 6px;
        margin: 10px 0;
      }
      .export-dialog-scale-button {
        font: inherit;
        padding: 4px 10px;
        cursor: pointer;
        border-radius: 4px;
        border: 1px solid #d6d3d1;
        background: #ffffff;
      }
      .export-dialog-scale-button.active {
        background: #1c1917;
        color: #ffffff;
        border-color: #1c1917;
      }
      .export-dialog-filename {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin: 10px 0;
      }
      .export-dialog-filename-input {
        font: inherit;
        padding: 4px 6px;
      }
      .export-dialog-dimensions {
        color: #57534e;
        font-size: 0.9em;
      }
      .export-dialog-status {
        color: #1c1917;
      }
      .export-dialog-error {
        color: #b91c1c;
      }
      .export-dialog-warnings {
        color: #b45309;
        font-size: 0.9em;
        padding-left: 18px;
      }
      .export-dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 12px;
      }
      .export-dialog-actions button {
        font: inherit;
        padding: 6px 14px;
        cursor: pointer;
        border-radius: 4px;
        border: 1px solid #d6d3d1;
      }
      .export-dialog-export {
        background: #1c1917;
        color: #ffffff;
        border-color: #1c1917;
      }

      /* Diálogo de guardar como plantilla */
      .save-as-template-dialog-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        align-items: center;
        justify-content: center;
        z-index: 100;
      }
      .save-as-template-dialog {
        background: #ffffff;
        border-radius: 8px;
        padding: 20px;
        min-width: 320px;
      }
      .save-as-template-dialog-field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin: 10px 0;
      }
      .save-as-template-dialog-name,
      .save-as-template-dialog-description {
        font: inherit;
        padding: 4px 6px;
      }
      .save-as-template-dialog-status {
        color: #1c1917;
      }
      .save-as-template-dialog-error {
        color: #b91c1c;
      }
      .save-as-template-dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 12px;
      }
      .save-as-template-dialog-actions button {
        font: inherit;
        padding: 6px 14px;
        cursor: pointer;
        border-radius: 4px;
        border: 1px solid #d6d3d1;
      }
      .save-as-template-dialog-save {
        background: #1c1917;
        color: #ffffff;
        border-color: #1c1917;
      }
    </style>
  </head>
  <body>
    <div id="workspace-screen">
      <div id="workspace-container"></div>
    </div>
    <div id="editor-screen" style="display: none">
      <div id="app">
        <div id="top-bar">
          <button id="new-btn" type="button">Nuevo</button>
          <span class="divider"></span>
          <button id="undo-btn" type="button" title="Deshacer (Ctrl/Cmd+Z)">Deshacer</button>
          <button id="redo-btn" type="button" title="Rehacer (Ctrl/Cmd+Shift+Z)">Rehacer</button>
          <span class="divider"></span>
          <button id="save-btn" type="button" title="Guardar (Ctrl/Cmd+S)">Guardar</button>
          <button id="back-to-workspace-btn" type="button" title="Mis proyectos (Ctrl/Cmd+O)">Mis proyectos</button>
          <span class="divider"></span>
          <button id="export-btn" type="button">Exportar</button>
          <button id="save-as-template-btn" type="button">Guardar como plantilla</button>
          <span class="divider"></span>
          <button id="duplicate-btn" type="button" title="Duplicar (Ctrl/Cmd+D)">Duplicar</button>
          <button id="delete-btn" type="button" title="Eliminar (Supr)">Eliminar</button>
          <button id="group-btn" type="button" title="Agrupar (Ctrl/Cmd+G)">Agrupar</button>
          <button id="ungroup-btn" type="button" title="Desagrupar (Ctrl/Cmd+Shift+G)">Desagrupar</button>
          <span id="toolbar-status"></span>
        </div>
        <div id="tools-bar">
          <div id="tools-container"></div>
          <div id="zoom-container"></div>
        </div>
        <div id="body">
          <div id="sidebar-left">
            <div class="sidebar-tabs">
              <button id="tab-layers" type="button" class="sidebar-tab">Capas</button>
              <button id="tab-assets" type="button" class="sidebar-tab">Assets</button>
            </div>
            <div id="layers-panel"></div>
            <div id="assets-panel"></div>
          </div>
          <div id="canvas-viewport">
            <div id="canvas-runtime"></div>
          </div>
          <div id="inspector-panel"></div>
        </div>
      </div>
      <div id="new-project-dialog-root"></div>
      <div id="export-dialog-root"></div>
      <div id="save-as-template-dialog-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
