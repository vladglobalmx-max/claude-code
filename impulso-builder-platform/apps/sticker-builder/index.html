<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Impulso Sticker Builder</title>
    <!-- Fase 4.2, sección 11 (branding comercial) — favicon propio mínimo
         (SVG inline, sin archivo binario ni asset de terceros): un
         "sticker" simplificado sobre el mismo fondo oscuro (#1c1917) usado
         en toda la app. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c1917'/%3E%3Ccircle cx='32' cy='30' r='16' fill='white'/%3E%3Cpath d='M40 38 L52 50 L38 46 Z' fill='white'/%3E%3C/svg%3E"
    />

    <style>
      /*
       * Tokens visuales (Epic 7 / Fase 7.3 — Assisted Placement): primer
       * conjunto de custom properties del proyecto (antes de esta fase no
       * existía ninguno — colores como el azul de selección seguían
       * hardcodeados en @impulso/renderer-konva). Se define aquí, no allá,
       * porque solo la App conoce el fondo real del canvas (blanco) sobre
       * el que deben leerse; renderer-konva los lee vía
       * getComputedStyle(...) con un fallback propio si no existieran (ver
       * `manipulation/smartGuides.ts`).
       */
      :root {
        --impulso-snap-guide-color: #ff2d78;
        --impulso-grid-line-color: rgba(28, 25, 23, 0.12);
      }
      html, body {
        margin: 0;
        height: 100%;
        background: #e5e5e5;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        color: #1c1917;
      }
      /* Workspace ("Mis proyectos") — pantalla de aterrizaje, ver ADR-0014 */
      #workspace-screen {
        min-height: 100vh;
        box-sizing: border-box;
      }
      #workspace-container {
        height: 100%;
      }
      .workspace-screen {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px 20px 60px;
        box-sizing: border-box;
      }
      .workspace-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .workspace-header h1 {
        font-size: 1.4em;
        margin: 0;
      }
      .workspace-new-btn {
        font: inherit;
        padding: 8px 16px;
        cursor: pointer;
        border: none;
        background: #1c1917;
        color: #ffffff;
        border-radius: 6px;
      }
      .workspace-import-btn {
        font: inherit;
        padding: 8px 16px;
        cursor: pointer;
        border: 1px solid #d6d3d1;
        background: #ffffff;
        color: #1c1917;
        border-radius: 6px;
      }
      /* Fase 4.2, sección 13 — discreto a propósito, nunca "activado". */
      .workspace-commercial-status {
        margin: -8px 0 16px;
        font-size: 0.8em;
        color: #78716c;
      }
      .workspace-card-export-backup {
        font: inherit;
        padding: 4px 10px;
        cursor: pointer;
        border: 1px solid #d6d3d1;
        background: #ffffff;
        border-radius: 4px;
      }
      .workspace-error {
        color: #b91c1c;
      }
      .workspace-empty {
        color: #57534e;
      }
      .workspace-recovery-banner {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 16px;
      }
      .workspace-recovery-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        padding: 10px 14px;
        border-radius: 6px;
        background: #fefce8;
        border: 1px solid #fde047;
        color: #713f12;
      }
      .workspace-recovery-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .workspace-recovery-actions button {
        font: inherit;
        padding: 4px 12px;
        cursor: pointer;
        border-radius: 4px;
        border: 1px solid #ca8a04;
        background: #ffffff;
        color: #713f12;
      }
      .workspace-recovery-recover {
        background: #ca8a04 !important;
        color: #ffffff !important;
      }
      .workspace-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 16px;
      }
      .workspace-card {
        border: 1px solid #d6d3d1;
        border-radius: 8px;
        padding: 10px;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .workspace-card-thumbnail {
        width: 100%;
        height: 140px;
        object-fit: contain;
        background: #f5f5f4;
        border-radius: 4px;
        cursor: pointer;
      }
      .workspace-card-name-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .workspace-card-name {
        font-weight: 600;
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }
      .workspace-card-name-input {
        font: inherit;
        font-weight: 600;
        flex: 1;
        min-width: 0;
      }
      .workspace-card-rename {
        border: none;
        background: none;
        cursor: pointer;
        font-size: 0.9em;
        padding: 2px 4px;
      }
      .workspace-card-updated {
        font-size: 0.8em;
        color: #78716c;
      }
      .workspace-card-actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: auto;
      }
      .workspace-card-actions button {
        font: inherit;
        font-size: 0.85em;
        padding: 4px 8px;
        cursor: pointer;
        border: 1px solid #d6d3d1;
        background: #f5f5f4;
        border-radius: 4px;
      }
      .workspace-card-delete {
        color: #b91c1c;
      }

      #app {
        display: grid;
        grid-template-rows: auto auto 1fr;
        grid-template-columns: 1fr;
        height: 100vh;
      }

      /* Barra superior: proyecto / deshacer-rehacer / guardar-abrir / acciones */
      #top-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: #1c1917;
        color: #e5e5e5;
        flex-wrap: wrap;
      }
      #top-bar button {
        font: inherit;
        padding: 4px 10px;
        cursor: pointer;
        border: 1px solid #44403c;
        background: #292524;
        color: inherit;
        border-radius: 4px;
      }
      #top-bar button:disabled {
        cursor: not-allowed;
        opacity: 0.4;
      }
      #top-bar .divider {
        width: 1px;
        align-self: stretch;
        background: #44403c;
        margin: 0 4px;
      }
      #toolbar-status {
        margin-left: auto;
        font-size: 0.85em;
        color: #a8a29e;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      /* Epic 8 — Autosave, Recovery & Project Safety: indicador de estado
         de guardado (ver `app.ts` -> `renderSaveState`). Nunca solo color
         (siempre incluye texto, sección 6). */
      .save-status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.85em;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid transparent;
      }
      .save-status-clean {
        color: #a3e635;
        border-color: #3f6212;
        background: #1a2e05;
      }
      .save-status-dirty {
        color: #d6d3d1;
        border-color: #57534e;
        background: #292524;
      }
      .save-status-saving {
        color: #93c5fd;
        border-color: #1e3a5f;
        background: #0f2436;
      }
      .save-status-error {
        color: #fca5a5;
        border-color: #7f1d1d;
        background: #2c1010;
      }
      .save-status-recovered {
        color: #fde68a;
        border-color: #78350f;
        background: #2c1c05;
      }
      .save-status-retry {
        font: inherit;
        padding: 1px 8px;
        cursor: pointer;
        border-radius: 999px;
        border: 1px solid currentColor;
        background: transparent;
        color: inherit;
      }
      .unsaved-changes-dialog-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .unsaved-changes-dialog {
        background: #ffffff;
        color: #1c1917;
        padding: 20px 24px;
        border-radius: 8px;
        max-width: 420px;
        width: 90%;
      }
      .unsaved-changes-dialog h2 {
        margin: 0 0 8px;
        font-size: 1.1em;
      }
      .unsaved-changes-dialog p {
        margin: 0 0 16px;
        color: #44403c;
      }
      .unsaved-changes-dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        flex-wrap: wrap;
      }
      .unsaved-changes-dialog-actions button {
        font: inherit;
        padding: 6px 14px;
        cursor: pointer;
        border-radius: 4px;
        border: 1px solid #d6d3d1;
        background: #ffffff;
      }
      .unsaved-changes-dialog-stay {
        background: #1c1917;
        color: #ffffff;
        border-color: #1c1917;
      }
      .unsaved-changes-dialog-discard {
        color: #b91c1c;
        border-color: #b91c1c;
      }

      /* Fase 4.2, sección 12 — bienvenida de primera ejecución. */
      .welcome-dialog-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .welcome-dialog {
        background: #ffffff;
        color: #1c1917;
        padding: 24px 28px;
        border-radius: 8px;
        max-width: 480px;
        width: 90%;
      }
      .welcome-dialog h2 {
        margin: 0 0 12px;
        font-size: 1.2em;
      }
      .welcome-dialog-body p {
        margin: 0 0 10px;
        color: #44403c;
      }
      .welcome-dialog-support {
        color: #78716c;
        font-size: 0.9em;
      }
      .welcome-dialog-close {
        font: inherit;
        padding: 8px 20px;
        cursor: pointer;
        border: none;
        background: #1c1917;
        color: #ffffff;
        border-radius: 6px;
        margin-top: 8px;
      }

      /* Barra de herramientas: Texto/Imagen + Zoom */
      #tools-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        background: #f5f5f4;
        border-bottom: 1px solid #d6d3d1;
      }
      #tools-container,
      #grid-snap-container,
      #zoom-container {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #grid-snap-container {
        margin-left: 12px;
      }
      #zoom-container {
        margin-left: auto;
      }
      #tools-bar button {
        font: inherit;
        padding: 4px 10px;
        cursor: pointer;
        border: 1px solid #d6d3d1;
        background: #ffffff;
        border-radius: 4px;
      }
      /* Fase 7.3.5 — Beta Stabilization (UX Polish): toda la barra de
         herramientas (Texto/Imagen, zoom, Grid/Snap) carecía de feedback
         `:hover` — `:not(.active)` evita que el gris de hover tape el
         fondo oscuro de un toggle ya activo (Grid/Snap encendidos). */
      #tools-bar button:hover:not(.active) {
        background: #f5f5f4;
        border-color: #a8a29e;
      }
      .zoom-percentage {
        min-width: 3.5em;
        text-align: right;
        color: #57534e;
      }

      /* Cuerpo: capas/assets | canvas | inspector */
      #body {
        display: grid;
        grid-template-columns: 240px 1fr 280px;
        min-height: 0;
      }

      #sidebar-left {
        display: flex;
        flex-direction: column;
        min-height: 0;
        border-right: 1px solid #d6d3d1;
        background: #fafaf9;
      }
      .sidebar-tabs {
        display: flex;
        border-bottom: 1px solid #d6d3d1;
      }
      .sidebar-tab {
        flex: 1;
        font: inherit;
        padding: 8px;
        cursor: pointer;
        border: none;
        background: none;
        color: #57534e;
      }
      .sidebar-tab.active {
        color: #1c1917;
        font-weight: 600;
        box-shadow: inset 0 -2px 0 #1c1917;
      }

      #layers-panel,
      #assets-panel {
        overflow-y: auto;
        padding: 8px;
        flex: 1;
      }
      .layer-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 6px;
        border-radius: 4px;
        cursor: pointer;
        user-select: none;
      }
      .layer-row:hover {
        background: #e7e5e4;
      }
      .layer-row.selected {
        background: #dbeafe;
      }
      .layer-label {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .layer-expand {
        border: none;
        background: none;
        cursor: pointer;
        width: 1.2em;
      }
      .layer-visibility,
      .layer-lock {
        border: none;
        background: none;
        cursor: pointer;
      }

      .assets-upload {
        font: inherit;
        width: 100%;
        padding: 6px;
        margin-bottom: 8px;
        cursor: pointer;
        border: 1px solid #d6d3d1;
        border-radius: 4px;
        background: #ffffff;
      }
      .assets-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .asset-item {
        position: relative;
        border: 1px solid #d6d3d1;
        border-radius: 4px;
        padding: 4px;
        cursor: pointer;
        background: #ffffff;
        text-align: center;
      }
      .asset-item:hover {
        background: #e7e5e4;
      }
      .asset-thumbnail {
        display: block;
        width: 100%;
        height: 64px;
        object-fit: contain;
        background: #f5f5f4;
      }
      .asset-name {
        display: block;
        font-size: 0.8em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        margin-top: 4px;
      }
      .asset-delete {
        position: absolute;
        top: 2px;
        right: 2px;
        border: none;
        background: rgba(255, 255, 255, 0.8);
        border-radius: 3px;
        cursor: pointer;
      }

      /* Área de canvas + reglas (Epic 7 / Fase 7.3 — Assisted Placement):
         grid 2x2 clásico de cualquier editor de diseño — esquina, regla
         horizontal, regla vertical, y el viewport con scroll real. */
      #canvas-area {
        display: grid;
        grid-template-columns: 20px 1fr;
        grid-template-rows: 20px 1fr;
        min-height: 0;
        min-width: 0;
        overflow: hidden;
      }
      /* Ocultar Rulers (atajo "R", Fase 7.3, sección 11) — colapsa la fila/columna
         dedicada en vez de solo esconder el contenido, para que el canvas
         recupere ese espacio. */
      #canvas-area.rulers-hidden {
        grid-template-columns: 0 1fr;
        grid-template-rows: 0 1fr;
      }
      #canvas-area.rulers-hidden #ruler-corner,
      #canvas-area.rulers-hidden #ruler-horizontal,
      #canvas-area.rulers-hidden #ruler-vertical {
        display: none;
      }
      #ruler-corner {
        grid-column: 1;
        grid-row: 1;
        background: #f5f5f4;
        border-right: 1px solid #d6d3d1;
        border-bottom: 1px solid #d6d3d1;
      }
      #ruler-horizontal {
        grid-column: 2;
        grid-row: 1;
        display: block;
        border-bottom: 1px solid #d6d3d1;
      }
      #ruler-vertical {
        grid-column: 1;
        grid-row: 2;
        display: block;
        border-right: 1px solid #d6d3d1;
      }
      #canvas-viewport {
        grid-column: 2;
        grid-row: 2;
        position: relative;
        overflow: auto;
        background: #d6d3d1;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 32px;
      }
      #canvas-runtime {
        position: relative;
        display: inline-block;
        background: #ffffff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
      }
      /* Grid visual (Fase 7.3, sección 7): un único patrón CSS repetido —
         nunca miles de nodos — detrás del canvas Konva (primer hijo de
         #canvas-runtime) y sin capturar eventos. */
      .grid-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(to right, var(--impulso-grid-line-color) 1px, transparent 1px),
          linear-gradient(to bottom, var(--impulso-grid-line-color) 1px, transparent 1px);
        background-repeat: repeat;
      }
      /* Indicador de posición del puntero (Fase 7.3, sección 9). */
      #pointer-indicator {
        position: absolute;
        right: 8px;
        bottom: 8px;
        padding: 3px 8px;
        background: rgba(28, 25, 23, 0.8);
        color: #ffffff;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        border-radius: 4px;
        pointer-events: none;
        z-index: 10;
      }
      /* Controles de Grid/Snap (Fase 7.3, sección 10) — junto al zoom. */
      .grid-snap-control {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .grid-snap-toggle {
        font: inherit;
        padding: 4px 10px;
        cursor: pointer;
        border: 1px solid #d6d3d1;
        background: #ffffff;
        border-radius: 4px;
      }
      .grid-snap-toggle.active {
        background: #1c1917;
        color: #ffffff;
        border-color: #1c1917;
      }
      .grid-snap-size {
        font: inherit;
        width: 3.5em;
        padding: 4px 6px;
        border: 1px solid #d6d3d1;
        border-radius: 4px;
      }

      #inspector-panel {
        overflow-x: hidden;
        overflow-y: auto;
        background: #fafaf9;
        border-left: 1px solid #d6d3d1;
        padding: 12px;
        font-size: 13px;
        min-width: 0;
      }
      .inspector-section {
        /* Los <fieldset> tienen un `min-width: min-content` implícito en la
           mayoría de los navegadores que ignora `flex-shrink`/el ancho del
           contenedor — sin este reset, el contenido (ej. el <select> de
           Alineación) fuerza al panel completo a desbordarse. */
        min-width: 0;
        box-sizing: border-box;
        width: 100%;
        border: 1px solid #e7e5e4;
        border-radius: 8px;
        margin-bottom: 12px;
        padding: 4px 12px 12px;
        background: #ffffff;
      }
      .inspector-section legend {
        padding: 0 4px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #78716c;
      }
      .inspector-field {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 8px;
      }
      .inspector-field > span {
        flex: 0 0 56px;
        color: #57534e;
        font-size: 12px;
      }
      .inspector-field select,
      .inspector-field textarea,
      .inspector-field input[type="text"] {
        font: inherit;
        flex: 1;
        min-width: 0;
        box-sizing: border-box;
        padding: 5px 8px;
        border: 1px solid #d6d3d1;
        border-radius: 6px;
        background: #fafaf9;
        color: #1c1917;
      }
      .inspector-field textarea {
        resize: vertical;
        min-height: 48px;
      }
      .inspector-field input[type="color"] {
        flex: 1;
        min-width: 0;
        height: 30px;
        padding: 2px;
        border: 1px solid #d6d3d1;
        border-radius: 6px;
        background: #fafaf9;
        cursor: pointer;
      }
      .inspector-field select:focus,
      .inspector-field textarea:focus,
      .inspector-field input[type="text"]:focus {
        outline: none;
        border-color: #1c1917;
        background: #ffffff;
      }
      .inspector-number-wrapper {
        position: relative;
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
      }
      .inspector-number-input {
        font: inherit;
        width: 100%;
        box-sizing: border-box;
        padding: 5px 8px;
        border: 1px solid #d6d3d1;
        border-radius: 6px;
        background: #fafaf9;
        color: #1c1917;
      }
      .inspector-number-wrapper--with-unit .inspector-number-input {
        padding-right: 28px;
      }
      .inspector-number-input:focus {
        outline: none;
        border-color: #1c1917;
        background: #ffffff;
      }
      .inspector-unit {
        position: absolute;
        right: 8px;
        pointer-events: none;
        color: #a8a29e;
        font-size: 11px;
      }
      .inspector-number-input.inspector-field-invalid,
      .inspector-field input[type="text"].inspector-field-invalid {
        border-color: #dc2626;
        background: #fef2f2;
      }
      .inspector-empty {
        color: #78716c;
        padding: 12px 4px;
        font-size: 13px;
      }

      /* Alineación (Epic 7 / Fase 7.2) */
      .alignment-row {
        display: flex;
        gap: 4px;
        margin-top: 8px;
        flex-wrap: wrap;
      }
      .alignment-button {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 32px;
        padding: 0;
        border: 1px solid #d6d3d1;
        border-radius: 6px;
        background: #fafaf9;
        color: #44403c;
        cursor: pointer;
      }
      .alignment-button svg {
        width: 16px;
        height: 16px;
      }
      .alignment-button:hover {
        background: #f0efee;
        border-color: #a8a29e;
      }
      .alignment-button:focus-visible {
        outline: 2px solid #1c1917;
        outline-offset: 1px;
      }
      .alignment-button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .alignment-error {
        margin: 8px 0 0;
        font-size: 12px;
        color: #b91c1c;
      }
      .alignment-error:empty {
        margin: 0;
      }

      /* Diálogo de proyecto nuevo */
      .new-project-dialog-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        align-items: center;
        justify-content: center;
        z-index: 100;
      }
      .new-project-dialog {
        background: #ffffff;
        border-radius: 8px;
        padding: 20px;
        min-width: 420px;
        max-width: 560px;
      }
      .new-project-dialog-status {
        color: #57534e;
      }
      .new-project-dialog-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin: 12px 0;
        max-height: 320px;
        overflow-y: auto;
      }
      .new-project-card {
        position: relative;
        border: 2px solid #d6d3d1;
        border-radius: 6px;
        padding: 6px;
        cursor: pointer;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        min-height: 100px;
        justify-content: center;
      }
      .new-project-card:hover {
        background: #f5f5f4;
      }
      .new-project-card.selected {
        border-color: #1c1917;
      }
      .new-project-card-thumbnail {
        max-width: 100%;
        max-height: 70px;
        object-fit: contain;
      }
      .new-project-card-name {
        font-size: 0.85em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 100%;
      }
      .new-project-card-delete {
        position: absolute;
        top: 2px;
        right: 2px;
        border: none;
        background: rgba(255, 255, 255, 0.85);
        border-radius: 3px;
        cursor: pointer;
        font-size: 0.8em;
        line-height: 1;
        padding: 2px 4px;
      }
      .new-project-card-custom {
        border-style: dashed;
      }
      .new-project-dialog-custom-fields {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 12px;
      }
      .new-project-dialog-error {
        color: #b91c1c;
      }
      .new-project-dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .new-project-dialog-actions button {
        font: inherit;
        padding: 6px 14px;
        cursor: pointer;
        border-radius: 4px;
        border: 1px solid #d6d3d1;
      }
      .new-project-dialog-create {
        background: #1c1917;
        color: #ffffff;
        border-color: #1c1917;
      }

      /* Diálogo de exportación */
      .export-dialog-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        align-items: center;
        justify-content: center;
        z-index: 100;
      }
      .export-dialog {
        background: #ffffff;
        border-radius: 8px;
        padding: 20px;
        min-width: 320px;
      }
      .export-dialog-format,
      .export-dialog-background {
        display: flex;
        gap: 12px;
        margin: 10px 0;
      }
      .export-dialog-scale {
        display: flex;
        gap: 6px;
        margin: 10px 0;
      }
      .export-dialog-scale-button {
        font: inherit;
        padding: 4px 10px;
        cursor: pointer;
        border-radius: 4px;
        border: 1px solid #d6d3d1;
        background: #ffffff;
      }
      .export-dialog-scale-button.active {
        background: #1c1917;
        color: #ffffff;
        border-color: #1c1917;
      }
      .export-dialog-filename {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin: 10px 0;
      }
      .export-dialog-filename-input {
        font: inherit;
        padding: 4px 6px;
      }
      .export-dialog-dimensions {
        color: #57534e;
        font-size: 0.9em;
      }
      .export-dialog-status {
        color: #1c1917;
      }
      .export-dialog-error {
        color: #b91c1c;
      }
      .export-dialog-warnings {
        color: #b45309;
        font-size: 0.9em;
        padding-left: 18px;
      }
      .export-dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 12px;
      }
      .export-dialog-actions button {
        font: inherit;
        padding: 6px 14px;
        cursor: pointer;
        border-radius: 4px;
        border: 1px solid #d6d3d1;
      }
      .export-dialog-export {
        background: #1c1917;
        color: #ffffff;
        border-color: #1c1917;
      }

      /* Production Preview (Epic 9 / Fase 9.4) — panel reutilizable, no un
       * diálogo propio (se embebe dentro del flujo de exportación, sección
       * 22). Diferenciación de capas por trazo (dasharray), NUNCA solo por
       * color (UX Audit 0007, quick win #1). */
      .production-preview {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .production-preview-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      .production-preview-nav {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .production-preview-nav button {
        font: inherit;
        padding: 4px 10px;
        cursor: pointer;
        border-radius: 4px;
        border: 1px solid #d6d3d1;
      }
      .production-preview-nav button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .production-preview-layers {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        border: 1px solid #d6d3d1;
        border-radius: 4px;
        padding: 4px 8px;
      }
      .production-preview-zoom {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .production-preview-zoom button {
        font: inherit;
        padding: 4px 10px;
        cursor: pointer;
        border-radius: 4px;
        border: 1px solid #d6d3d1;
      }
      .production-preview-error {
        color: #b91c1c;
        font-weight: 600;
      }
      .production-preview-canvas-wrapper {
        overflow: auto;
        border: 1px solid #999;
        max-width: 100%;
        background: #e5e5e5;
      }
      .production-preview-scale-target {
        position: relative;
      }
      .production-preview-canvas-slot canvas {
        display: block;
        position: absolute;
        top: 0;
        left: 0;
      }
      .production-preview-overlay-svg {
        position: absolute;
        top: 0;
        left: 0;
      }
      .production-preview-overlay-stroke {
        stroke-width: 1.5;
        vector-effect: non-scaling-stroke;
      }
      .production-preview-sheet {
        stroke: #666;
        stroke-dasharray: 2 2;
      }
      .production-preview-usefularea {
        stroke: #9b59b6;
        stroke-dasharray: 8 3 2 3;
      }
      .production-preview-footprint {
        stroke: #e67e22;
        stroke-dasharray: 6 3;
      }
      .production-preview-trim {
        stroke: #2ecc71;
        stroke-dasharray: none;
      }
      .production-preview-safearea {
        stroke: #3498db;
        stroke-dasharray: 1 4;
      }
      .production-preview-cropmark {
        stroke: #000000;
        stroke-dasharray: none;
      }
      .production-preview-cutpath {
        stroke: #ff00ff;
        stroke-dasharray: 4 2 1 2;
      }
      .production-preview-summary {
        font-size: 13px;
      }
      .production-preview-summary dt {
        font-weight: 600;
      }
      .production-preview-summary dd {
        margin: 0 0 6px 0;
      }

      /* "Exportar para impresión" — flujo de 7 pasos (Epic 9 / Fase 9.4) */
      .production-export-dialog-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .production-export-dialog {
        background: #ffffff;
        color: #1c1917;
        padding: 20px 24px;
        border-radius: 8px;
        max-width: 720px;
        width: 92%;
        max-height: 88vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .production-export-step-indicator {
        margin: 0;
        font-size: 0.85em;
        color: #78716c;
      }
      .production-export-dialog h2 {
        margin: 0 0 8px;
        font-size: 1.15em;
      }
      .production-export-body {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .production-export-body label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 0.9em;
      }
      .production-export-body fieldset {
        /* Mismo reset que `.inspector-section` (Fase 9.5, hardening
           responsive) — un <fieldset> tiene un `min-width: min-content`
           implícito en la mayoría de los navegadores que ignora el ancho
           del contenedor; sin este reset, un <select> con opciones largas
           (ej. "bottom-center" en Alineación del grid) podría forzar
           overflow horizontal del diálogo en viewports angostos. */
        min-width: 0;
        box-sizing: border-box;
        border: 1px solid #d6d3d1;
        border-radius: 6px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 10px 12px;
      }
      .production-export-accept-warnings {
        flex-direction: row !important;
        align-items: center;
        gap: 8px !important;
      }
      .production-export-profile-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .production-export-profile-card {
        display: flex !important;
        flex-direction: row !important;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px 10px;
        border: 1px solid #d6d3d1;
        border-radius: 6px;
        padding: 10px 12px;
        cursor: pointer;
      }
      .production-export-profile-card-selected {
        border-color: #2563eb;
        background: #eff6ff;
      }
      .production-export-profile-card h3 {
        margin: 0;
        font-size: 1em;
        flex-basis: 100%;
      }
      .production-export-profile-card p {
        margin: 0;
        font-size: 0.85em;
        color: #57534e;
      }
      .production-export-simple-summary {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 10px;
        margin: 0;
        font-size: 0.9em;
      }
      .production-export-simple-summary dt {
        font-weight: 600;
      }
      .production-export-simple-summary dd {
        margin: 0;
      }
      .production-export-stale-banner {
        background: #fef3c7;
        border: 1px solid #f59e0b;
        border-radius: 6px;
        padding: 8px 10px;
        margin: 0;
      }
      .production-export-error {
        color: #b91c1c;
        font-weight: 600;
      }
      .production-export-issues {
        margin: 0 0 8px 0;
        padding-left: 20px;
      }
      .production-export-issues-error {
        color: #b91c1c;
      }
      .production-export-issues-warning {
        color: #b45309;
      }
      .production-export-results-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .production-export-live-region {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }
      .production-export-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .production-export-actions button {
        font: inherit;
        padding: 6px 14px;
        cursor: pointer;
        border-radius: 4px;
        border: 1px solid #d6d3d1;
        background: #ffffff;
      }
      .production-export-actions button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      /* Selector calificado con `button` a propósito: `.production-export-next`
         solo (una clase) tiene MENOS especificidad que la regla genérica
         `.production-export-actions button` de arriba (una clase + un
         elemento) — sin este calificador, la regla genérica ganaba y el
         botón quedaba con fondo blanco y texto blanco (invisible pero
         funcional: los clicks seguían funcionando, por eso ningún test
         automatizado lo detectó — encontrado recién al tomar capturas de
         pantalla reales para Release Candidate 1.0). */
      .production-export-actions button.production-export-next {
        background: #1c1917;
        color: #ffffff;
        border-color: #1c1917;
      }

      /* Diálogo de guardar como plantilla */
      .save-as-template-dialog-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        align-items: center;
        justify-content: center;
        z-index: 100;
      }
      .save-as-template-dialog {
        background: #ffffff;
        border-radius: 8px;
        padding: 20px;
        min-width: 320px;
      }
      .save-as-template-dialog-field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin: 10px 0;
      }
      .save-as-template-dialog-name,
      .save-as-template-dialog-description {
        font: inherit;
        padding: 4px 6px;
      }
      .save-as-template-dialog-status {
        color: #1c1917;
      }
      .save-as-template-dialog-error {
        color: #b91c1c;
      }
      .save-as-template-dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 12px;
      }
      .save-as-template-dialog-actions button {
        font: inherit;
        padding: 6px 14px;
        cursor: pointer;
        border-radius: 4px;
        border: 1px solid #d6d3d1;
      }
      .save-as-template-dialog-save {
        background: #1c1917;
        color: #ffffff;
        border-color: #1c1917;
      }
    </style>
  </head>
  <body>
    <div id="workspace-screen">
      <div id="workspace-container"></div>
    </div>
    <div id="editor-screen" style="display: none">
      <div id="app">
        <div id="top-bar">
          <button id="new-btn" type="button">Nuevo</button>
          <span class="divider"></span>
          <button id="undo-btn" type="button" title="Deshacer (Ctrl/Cmd+Z)">Deshacer</button>
          <button id="redo-btn" type="button" title="Rehacer (Ctrl/Cmd+Shift+Z)">Rehacer</button>
          <span class="divider"></span>
          <button id="save-btn" type="button" title="Guardar (Ctrl/Cmd+S)">Guardar</button>
          <span id="save-status" class="save-status save-status-clean"></span>
          <span id="save-status-announcer" class="sr-only" aria-live="polite"></span>
          <button id="back-to-workspace-btn" type="button" title="Mis proyectos (Ctrl/Cmd+O)">Mis proyectos</button>
          <span class="divider"></span>
          <button id="export-btn" type="button">Exportar</button>
          <button id="production-export-btn" type="button" title="Exportar para impresión (imposición, hojas de producción)">Exportar para impresión</button>
          <button id="save-as-template-btn" type="button">Guardar como plantilla</button>
          <span class="divider"></span>
          <button id="duplicate-btn" type="button" title="Duplicar (Ctrl/Cmd+D)">Duplicar</button>
          <button id="delete-btn" type="button" title="Eliminar (Supr)">Eliminar</button>
          <button id="group-btn" type="button" title="Agrupar (Ctrl/Cmd+G)">Agrupar</button>
          <button id="ungroup-btn" type="button" title="Desagrupar (Ctrl/Cmd+Shift+G)">Desagrupar</button>
          <span id="toolbar-status"></span>
        </div>
        <div id="tools-bar">
          <div id="tools-container"></div>
          <div id="grid-snap-container"></div>
          <div id="zoom-container"></div>
        </div>
        <div id="body">
          <div id="sidebar-left">
            <div class="sidebar-tabs">
              <button id="tab-layers" type="button" class="sidebar-tab">Capas</button>
              <button id="tab-assets" type="button" class="sidebar-tab">Biblioteca</button>
            </div>
            <div id="layers-panel"></div>
            <div id="assets-panel"></div>
          </div>
          <div id="canvas-area">
            <div id="ruler-corner" aria-hidden="true"></div>
            <canvas id="ruler-horizontal" aria-hidden="true"></canvas>
            <canvas id="ruler-vertical" aria-hidden="true"></canvas>
            <div id="canvas-viewport">
              <div id="canvas-runtime"></div>
              <div id="pointer-indicator" aria-hidden="true"></div>
            </div>
          </div>
          <div id="inspector-panel">
            <div id="alignment-panel"></div>
            <div id="inspector-content"></div>
          </div>
        </div>
      </div>
      <div id="new-project-dialog-root"></div>
      <div id="export-dialog-root"></div>
      <div id="production-export-dialog-root"></div>
      <div id="save-as-template-dialog-root"></div>
      <div id="unsaved-changes-dialog-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
