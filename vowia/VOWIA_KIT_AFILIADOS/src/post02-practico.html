<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FAF7F1; --surface:#FFFFFF; --surface-soft:#F3EEE4;
  --ink:#2B2420; --ink-soft:#6B6054; --borde:#E6DED2;
  --terracotta:#B5664A; --terracotta-deep:#96503A;
  --sage:#7D8F82; --sage-deep:#5E6E62; --gold:#BFA06A;
  --grad-marca:linear-gradient(135deg,#B5664A 0%,#96503A 50%,#7D8F82 100%);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1080px;height:1080px;overflow:hidden;font-family:'Inter',sans-serif;}
.canvas{
  width:1080px;height:1080px;position:relative;
  background:
    radial-gradient(ellipse 800px 600px at 100% 0%, rgba(181,102,74,0.10) 0%, transparent 60%),
    var(--bg);
}
.logo{position:absolute; top:60px; left:64px; display:flex; align-items:center; gap:12px;}
.anillo{width:42px;height:42px;border-radius:50%;background:var(--grad-marca);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 6px 16px rgba(150,80,58,0.25);}
.wordmark{font-family:'Playfair Display',serif;font-weight:700;font-size:1.5rem;color:var(--ink);}
.chip-precio{position:absolute; top:66px; right:64px; background:var(--surface-soft); border:1px solid var(--borde); border-radius:30px; padding:10px 20px; font-size:17px; font-weight:600; color:var(--ink);}

.headline{
  position:absolute; top:148px; left:64px; right:64px;
  font-family:'Playfair Display',serif; font-size:56px; line-height:1.14; font-weight:700; color:var(--ink);
}
.subtext{
  position:absolute; top:272px; left:64px;
  font-size:28px; color:var(--terracotta-deep); font-weight:600;
}

.beneficios{position:absolute; top:340px; left:64px; display:flex; flex-direction:column; gap:14px;}
.beneficio{display:flex; align-items:center; gap:12px; font-size:24px; color:var(--ink);}
.beneficio .check{width:28px;height:28px;border-radius:50%;background:var(--sage);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}

.mockup{
  position:absolute; top:560px; left:90px; width:900px; height:324px;
  border-radius:18px; overflow:hidden; box-shadow:0 30px 70px rgba(43,36,32,0.22); border:1px solid var(--borde);
  background:var(--surface);
}
.mockup img{width:100%; display:block; margin-top:-36px;}

.cta{
  position:absolute; bottom:66px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--bg); font-weight:600; font-size:25px;
  padding:20px 48px; border-radius:40px; box-shadow:0 14px 30px rgba(43,36,32,0.25);
}
</style></head><body>
<div class="canvas">
  <div class="logo"><span class="anillo">💍</span><span class="wordmark">Vowia</span></div>
  <div class="chip-precio">$344 MXN · pago único</div>
  <div class="headline">Organicen su boda<br>con más claridad.</div>
  <div class="subtext">Dos perspectivas. Un solo plan.</div>
  <div class="beneficios">
    <div class="beneficio"><span class="check">✓</span>Organicen sus prioridades</div>
    <div class="beneficio"><span class="check">✓</span>Identifiquen sus diferencias</div>
    <div class="beneficio"><span class="check">✓</span>Tomen decisiones juntos</div>
  </div>
  <div class="mockup"><img src="prioridades.png" alt=""></div>
  <div class="cta">Descubre cómo funciona</div>
</div>
</body></html>
