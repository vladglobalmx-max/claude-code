<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --azul:#4C8DFF; --turquesa:#34C1BC; --violeta:#8A7CF5; --amarillo:#F6C84C;
  --ink:#253047; --ink-soft:#5A6478; --bg:#F7F9FD; --borde:#E1E7F5;
  --grad-marca:linear-gradient(135deg,#4C8DFF 0%,#34C1BC 50%,#8A7CF5 100%);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1080px;height:1080px;overflow:hidden;font-family:'Work Sans',sans-serif;}
.canvas{width:1080px;height:1080px;position:relative;background:var(--bg);}
.logo{position:absolute; top:60px; left:64px; display:flex; align-items:center; gap:12px;}
.badge{width:42px;height:42px;border-radius:12px;background:var(--grad-marca);display:flex;align-items:center;justify-content:center;font-size:20px;}
.wordmark{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.2rem;color:var(--ink);}
.chip-precio{position:absolute; top:66px; right:64px; background:#fff; border:1px solid var(--borde); border-radius:30px; padding:10px 20px; font-size:17px; font-weight:600; color:var(--ink);}

.headline{position:absolute; top:148px; left:64px; right:64px; font-family:'Fredoka',sans-serif; font-size:48px; line-height:1.2; font-weight:600; color:var(--ink);}
.subtext{position:absolute; top:260px; left:64px; font-size:26px; color:var(--violeta); font-weight:700;}

.beneficios{position:absolute; top:326px; left:64px; display:flex; flex-direction:column; gap:14px;}
.beneficio{display:flex; align-items:center; gap:12px; font-size:23px; color:var(--ink);}
.beneficio .check{width:28px;height:28px;border-radius:50%;background:var(--turquesa);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}

.mockup{position:absolute; top:528px; left:90px; width:900px; height:466px; border-radius:18px; overflow:hidden; box-shadow:0 30px 70px rgba(76,141,255,0.18); border:1px solid var(--borde); background:#fff;}
.mockup img{width:100%; display:block; margin-top:0;}

.cta{position:absolute; bottom:66px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; font-weight:700; font-size:25px; padding:20px 48px; border-radius:40px; box-shadow:0 14px 30px rgba(37,48,71,0.3);}
</style></head><body>
<div class="canvas">
  <div class="logo"><span class="badge">📖</span><span class="wordmark">Bookfluence Kids</span></div>
  <div class="chip-precio">$299 MXN · pago único</div>
  <div class="headline">Tu hijo organiza<br>su día, solo.</div>
  <div class="subtext">Tú supervisas cuando quieras.</div>
  <div class="beneficios">
    <div class="beneficio"><span class="check">✓</span>Sin internet para usarla</div>
    <div class="beneficio"><span class="check">✓</span>Sin anuncios ni compras</div>
    <div class="beneficio"><span class="check">✓</span>Panel de padres con PIN</div>
  </div>
  <div class="mockup"><img src="kids-metas.png" alt=""></div>
  <div class="cta">Ver cómo funciona</div>
</div>
</body></html>
