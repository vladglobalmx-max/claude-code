project_id = "gs-orders"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
# THÖREN 7C — deshabilitado a propósito: seed_demo_data.sql ahora exige un
# GUC de sesión (thoren.allow_demo_seed=local) que la ruta automática de
# `supabase db reset` no fija. Sembrar datos de demo es un paso EXPLÍCITO
# vía scripts/reset-local-demo.sh (ver ese script y el README) — nunca algo
# que "db reset" haga solo, en ningún entorno.
enabled = false
sql_paths = ["./seed/seed_demo_data.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = false

[auth.email]
# NOTA: en esta versión del CLI, enable_signup también controla si el
# proveedor de email/password está prendido (GOTRUE_EXTERNAL_EMAIL_ENABLED),
# no solo el auto-registro. Debe quedar en true para poder hacer login local,
# aunque la app no exponga una pantalla de registro. Esto solo afecta el
# stack local (supabase/config.toml) — no el proyecto de producción.
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
