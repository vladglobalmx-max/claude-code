<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --navy:#1B2A4A; --turquesa:#1FA996; --ambar:#F2C14E; --ink-soft:#C7CEDA;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1080px;height:1920px;overflow:hidden;font-family:'Inter',sans-serif;}
.canvas{width:1080px;height:1920px;position:relative; background:linear-gradient(180deg,#14213D 0%, #0E1830 100%);}
.safe{position:absolute; top:250px; left:90px; right:90px; bottom:250px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;}
.logo{position:absolute; top:300px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:12px;}
.badge{width:48px;height:48px;border-radius:13px;background:linear-gradient(120deg,#1B2A4A,#1FA996);display:flex;align-items:center;justify-content:center;font-size:22px;}
.wordmark{font-family:'Sora',sans-serif;font-weight:700;font-size:1.7rem;color:#fff;}

.headline{margin-top:120px; font-family:'Sora',sans-serif; font-size:60px; line-height:1.3; font-weight:800; color:#fff;}
.headline em{font-style:normal; color:var(--turquesa);}
.subtext{margin-top:48px; font-size:28px; line-height:1.55; color:var(--ink-soft); max-width:760px;}
.linea{width:70px; height:3px; background:var(--ambar); margin-top:48px;}
</style></head><body>
<div class="canvas">
  <div class="logo"><span class="badge">📘</span><span class="wordmark">Bookfluence Teachers</span></div>
  <div class="safe">
    <div class="headline">¿Cuántas horas a la semana<br>se te van entre <em>hojas sueltas</em><br>y Excel improvisado?</div>
    <div class="linea"></div>
    <div class="subtext">Tu tiempo de planeación vale más que eso.</div>
  </div>
</div>
</body></html>
