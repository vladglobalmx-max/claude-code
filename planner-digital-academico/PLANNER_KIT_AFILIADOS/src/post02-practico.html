<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --navy:#1B2A4A; --azul:#25406E; --turquesa:#1FA996; --turquesa-fuerte:#0E7D70;
  --ambar:#F2C14E; --ink:#1B2432; --ink-soft:#5B6779; --bg:#F5F7FA; --borde:#DCE3EC;
  --grad-marca:linear-gradient(120deg,#1B2A4A 0%,#25406E 55%,#1FA996 100%);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1080px;height:1080px;overflow:hidden;font-family:'Inter',sans-serif;}
.canvas{width:1080px;height:1080px;position:relative;background:var(--bg);}
.logo{position:absolute; top:60px; left:64px; display:flex; align-items:center; gap:12px;}
.badge{width:42px;height:42px;border-radius:11px;background:var(--grad-marca);display:flex;align-items:center;justify-content:center;font-size:20px;}
.wordmark{font-family:'Sora',sans-serif;font-weight:700;font-size:1.25rem;color:var(--navy);}
.chip-precio{position:absolute; top:66px; right:64px; background:#fff; border:1px solid var(--borde); border-radius:30px; padding:10px 20px; font-size:17px; font-weight:600; color:var(--navy);}

.headline{position:absolute; top:148px; left:64px; right:64px; font-family:'Sora',sans-serif; font-size:52px; line-height:1.15; font-weight:800; color:var(--navy);}
.subtext{position:absolute; top:272px; left:64px; font-size:26px; color:var(--turquesa-fuerte); font-weight:700;}

.beneficios{position:absolute; top:336px; left:64px; display:flex; flex-direction:column; gap:14px;}
.beneficio{display:flex; align-items:center; gap:12px; font-size:23px; color:var(--ink);}
.beneficio .check{width:28px;height:28px;border-radius:50%;background:var(--turquesa);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}

.mockup{position:absolute; top:534px; left:90px; width:900px; height:460px; border-radius:16px; overflow:hidden; box-shadow:0 30px 70px rgba(27,42,74,0.2); border:1px solid var(--borde); background:#fff;}
.mockup img{width:100%; display:block; margin-top:-56px;}

.cta{position:absolute; bottom:66px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; font-weight:700; font-size:25px; padding:20px 48px; border-radius:40px; box-shadow:0 14px 30px rgba(27,42,74,0.3);}
</style></head><body>
<div class="canvas">
  <div class="logo"><span class="badge">📘</span><span class="wordmark">Bookfluence Teachers</span></div>
  <div class="chip-precio">$344 MXN · pago único</div>
  <div class="headline">Organiza todo tu<br>ciclo escolar.</div>
  <div class="subtext">18 módulos integrados, un solo lugar.</div>
  <div class="beneficios">
    <div class="beneficio"><span class="check">✓</span>Planeaciones reutilizables</div>
    <div class="beneficio"><span class="check">✓</span>Asistencia con alertas automáticas</div>
    <div class="beneficio"><span class="check">✓</span>Reportes listos para imprimir</div>
  </div>
  <div class="mockup"><img src="planner-planeacion.png" alt=""></div>
  <div class="cta">Descubre cómo funciona</div>
</div>
</body></html>
