<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --navy:#1B2A4A; --turquesa:#1FA996; --turquesa-fuerte:#0E7D70; --ambar:#F2C14E;
  --ink:#1B2432; --ink-soft:#5B6779; --bg:#F5F7FA; --borde:#DCE3EC;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1080px;height:1920px;overflow:hidden;font-family:'Inter',sans-serif;}
.canvas{width:1080px;height:1920px;position:relative;background:var(--bg);}
.logo{position:absolute; top:300px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:12px;}
.badge{width:46px;height:46px;border-radius:13px;background:linear-gradient(120deg,#1B2A4A,#1FA996);display:flex;align-items:center;justify-content:center;font-size:21px;}
.wordmark{font-family:'Sora',sans-serif;font-weight:700;font-size:1.6rem;color:var(--navy);}

.headline{position:absolute; top:416px; left:90px; right:90px; text-align:center; font-family:'Sora',sans-serif; font-size:58px; line-height:1.2; font-weight:800; color:var(--navy);}
.subtext{position:absolute; top:558px; left:130px; right:130px; text-align:center; font-size:28px; line-height:1.55; color:var(--ink-soft);}
.badge-pill{position:absolute; top:716px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; font-size:19px; letter-spacing:1.5px; font-weight:700; padding:14px 30px; border-radius:30px; white-space:nowrap;}

.mockup{position:absolute; top:816px; left:70px; width:940px; height:622px; border-radius:20px; overflow:hidden; box-shadow:0 36px 80px rgba(27,42,74,0.22); border:1px solid var(--borde); background:#fff;}
.mockup img{width:100%; display:block; margin-top:0;}
</style></head><body>
<div class="canvas">
  <div class="logo"><span class="badge">📘</span><span class="wordmark">Bookfluence Teachers</span></div>
  <div class="headline">Todo tu ciclo escolar,<br>en un solo lugar.</div>
  <div class="subtext">Grupos, planeaciones, asistencia, calificaciones y reportes — conectados entre sí.</div>
  <div class="badge-pill">18 MÓDULOS INTEGRADOS</div>
  <div class="mockup"><img src="planner-dashboard.png" alt=""></div>
</div>
</body></html>
